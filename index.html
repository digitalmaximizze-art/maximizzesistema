function saveContractFromForm(contract) {
  Object.assign(contract, {
    clientId: document.getElementById("cof-clientId").value,
    servicesDescription: document.getElementById("cof-services").value.trim(),
    value: parseFloat(document.getElementById("cof-value").value) || 0,
    status: document.getElementById("cof-status").value,
    startDate: document.getElementById("cof-startDate").value,
    endDate: document.getElementById("cof-endDate").value,
    autoRenew: document.getElementById("cof-autoRenew").checked,
    notes: document.getElementById("cof-notes").value.trim(),
  });
}

function attachContratosEvents() {
  document.getElementById("btn-new-contract").addEventListener("click", () => {
    if (!DATA.clients.length) { showToast("Cadastre um cliente antes de criar um contrato."); return; }
    openModal("Novo contrato", contractFormHtml(null), `
      <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
      <button class="btn-primary" id="modal-save" type="button">Salvar contrato</button>
    `);
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-save").addEventListener("click", async () => {
      const contract = { id: uid(), fileUrl: "", isDemo: false };
      saveContractFromForm(contract);
      DATA.contracts.push(contract);
      logAudit("criou", "Contrato", contract.id, "Contrato criado");
      await saveData();
      closeModal();
      showToast("Contrato cadastrado.");
      renderView("contratos");
    });
  });

  document.querySelectorAll("[data-edit-contract]").forEach(el => {
    el.addEventListener("click", () => {
      const contract = DATA.contracts.find(c => c.id === el.dataset.editContract);
      openModal("Editar contrato", contractFormHtml(contract), `
        <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
        <button class="btn-primary" id="modal-save" type="button">Salvar alterações</button>
      `);
      document.getElementById("modal-cancel").addEventListener("click", closeModal);
      document.getElementById("modal-save").addEventListener("click", async () => {
        saveContractFromForm(contract);
        await saveData();
        closeModal();
        showToast("Contrato atualizado.");
        renderView("contratos");
      });
    });
  });

  document.querySelectorAll("[data-delete-contract]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const contract = DATA.contracts.find(c => c.id === btn.dataset.deleteContract);
      if (!contract) return;
      const client = DATA.clients.find(c => c.id === contract.clientId);
      if (!window.confirm("Excluir o contrato de " + (client ? client.companyName : "este cliente") + "? Essa ação não pode ser desfeita.")) return;
      DATA.contracts = DATA.contracts.filter(c => c.id !== contract.id);
      logAudit("excluiu", "Contrato", contract.id, "Contrato de " + (client ? client.companyName : "-") + " excluído");
      await saveData();
      showToast("Contrato removido.");
      renderView("contratos");
    });
  });
}

function exportReport(key) {
  if (key === "faturamento") {
    const rows = DATA.payments.map(p => {
      const c = DATA.clients.find(cl => cl.id === p.clientId);
      return [c ? c.companyName : "-", p.competencia, p.value, p.status, p.paymentDate || ""];
    });
    downloadCSV("faturamento.csv", ["Cliente", "Competência", "Valor", "Status", "Data pagamento"], rows);
  } else if (key === "despesas") {
    const rows = [
      ...DATA.agencyCosts.map(c => [c.name, COST_CATEGORY_LABELS[c.category] || c.category, c.value, "Recorrente"]),
      ...DATA.expenses.map(e => [e.description, COST_CATEGORY_LABELS[e.category] || e.category, e.value, e.date]),
    ];
    downloadCSV("despesas.csv", ["Descrição", "Categoria", "Valor", "Data/Periodicidade"], rows);
  } else if (key === "clientes") {
    const rows = DATA.clients.map(c => [c.companyName, c.contactName, c.email, c.whatsapp, c.status, c.monthlyValue]);
    downloadCSV("clientes.csv", ["Empresa", "Responsável", "E-mail", "WhatsApp", "Status", "Mensalidade"], rows);
  } else if (key === "inadimplencia") {
    const rows = DATA.payments.filter(p => p.status === "ATRASADO").map(p => {
      const c = DATA.clients.find(cl => cl.id === p.clientId);
      return [c ? c.companyName : "-", p.competencia, p.value, p.dueDate];
    });
    downloadCSV("inadimplência.csv", ["Cliente", "Competência", "Valor", "Vencimento"], rows);
  } else if (key === "colaboradores") {
    const rows = DATA.employees.map(e => [e.name, e.role, CONTRACT_TYPE_LABELS[e.contractType] || e.contractType, employeeCostLabel(e), e.status]);
    downloadCSV("colaboradores.csv", ["Nome", "Função", "Tipo de contratação", "Valor", "Status"], rows);
  } else if (key === "rentabilidade") {
    const rows = rentabilidadePorCliente().map(r => [r.client.companyName, r.mensalidade, r.custoEquipe, r.software, r.lucro, r.margem.toFixed(1) + "%"]);
    downloadCSV("rentabilidade-por-cliente.csv", ["Cliente", "Mensalidade", "Custo equipe", "Software", "Lucro", "Margem"], rows);
  } else if (key === "orcamentos") {
    const rows = DATA.budgets.map(b => {
      const c = DATA.clients.find(cl => cl.id === b.clientId);
      const calc = computeBudget(b);
      return ["#" + b.number, c ? c.companyName : (b.prospectName || "-"), b.status, calc.totalCost.toFixed(2), calc.recommendedPrice.toFixed(2)];
    });
    downloadCSV("orçamentos.csv", ["Número", "Cliente", "Status", "Custo total", "Preço recomendado"], rows);
  } else if (key === "leads") {
    const rows = DATA.leads.map(l => [l.name, l.company, LEAD_STAGE_LABELS[l.stage], l.estimatedValue || "", l.origin || ""]);
    downloadCSV("leads.csv", ["Nome", "Empresa", "Etapa", "Valor estimado", "Origem"], rows);
  } else if (key === "fluxo") {
    const rows = fluxoDeCaixa().map(row => [row.month, row.saldoInicial.toFixed(2), row.entradas.toFixed(2), row.saidas.toFixed(2), row.saldoFinal.toFixed(2)]);
    downloadCSV("fluxo-de-caixa.csv", ["Mês", "Saldo inicial", "Entradas", "Saídas", "Saldo final"], rows);
  }
}

function countDemoRecords() {
  const keys = ["clients","employees","leads","projects","tasks","payments","agencyCosts","employeePayments","budgets","expenses","revenues","contracts","auditLogs"];
  let count = 0;
  keys.forEach(k => { count += (DATA[k] || []).filter(x => x && x.isDemo).length; });
  return count;
}

        <div class="field"><label>CNPJ</label><input type="text" id="cf-document" value="${escapeHtml(s.document || "")}" /></div>
        <div class="field"><label>Telefone</label><input type="text" id="cf-phone" value="${escapeHtml(s.phone || "")}" /></div>
        <div class="field"><label>WhatsApp</label><input type="text" id="cf-whatsapp" value="${escapeHtml(s.whatsapp || "")}" /></div>
        <div class="field"><label>E-mail</label><input type="text" id="cf-email" value="${escapeHtml(s.email || "")}" /></div>
        <div class="field"><label>Chave Pix</label><input type="text" id="cf-pixKey" value="${escapeHtml(s.pixKey || "")}" /></div>
        <div class="field full"><label>Endereço</label><input type="text" id="cf-address" value="${escapeHtml(s.address || "")}" /></div>
        <div class="field full"><label>Dados bancários</label><textarea id="cf-bankData">${escapeHtml(s.bankData || "")}</textarea></div>
      </div>
      <button class="btn-primary btn-sm" id="btn-save-agency" type="button">Salvar dados da agência</button>
    </div>

    <div class="panel info-panel" style="margin-bottom:20px;">
      <h3>Margens da calculadora</h3>
      <p>Margem mínima ${s.minMargin}% &middot; recomendada ${s.recommendedMargin}% &middot; premium ${s.premiumMargin}%. Editáveis na página <strong style="color:var(--text-100)">Custos da Agência</strong>.</p>
    </div>

    <div class="panel" style="padding:20px;margin-bottom:20px;">
      <div class="section-label" style="margin-top:0;">Proposta comercial</div>
      <div class="form-grid">
        <div class="field full"><label for="cf-logoUrl">Link do logo (https://)</label><input type="url" id="cf-logoUrl" value="${escapeHtml(s.logoUrl || "")}" /></div>
        <div class="field"><label for="cf-validity">Validade padrão (dias)</label><input type="number" min="1" id="cf-validity" value="${Number(s.proposalValidityDays) || 15}" /></div>
        <div class="field"><label for="cf-terms">Condições de pagamento padrão</label><input type="text" id="cf-terms" value="${escapeHtml(s.proposalPaymentTerms || "")}" /></div>
        <div class="field full"><label for="cf-proposalNotes">Texto final da proposta</label><textarea id="cf-proposalNotes">${escapeHtml(s.proposalNotes || "")}</textarea></div>
      </div>
      <button class="btn-primary btn-sm" id="btn-save-proposal" type="button">Salvar proposta</button>

    <div class="panel" style="padding:20px;margin-bottom:20px;">

function attachConfiguracoesEvents() {
  document.getElementById("btn-save-proposal").addEventListener("click", async () => {
    const logo = document.getElementById("cf-logoUrl").value.trim();
    if (logo && !safeUrl(logo)) { showToast("O link do logo precisa começar com https://"); return; }
    Object.assign(DATA.settings, {
      logoUrl: logo,
      proposalValidityDays: Math.max(1, parseInt(document.getElementById("cf-validity").value) || 15),
      proposalPaymentTerms: document.getElementById("cf-terms").value.trim(),
      proposalNotes: document.getElementById("cf-proposalNotes").value.trim(),
    });
    await saveData();
    showToast("Dados da proposta atualizados.");
  });

  document.getElementById("btn-save-capacity").addEventListener("click", async () => {
    DATA.settings.clientsPerEmployee = Math.max(1, parseInt(document.getElementById("cf-clientsPerEmployee").value) || 3);
    await saveData();
    showToast("Limite atualizado.");
  });

  document.getElementById("btn-new-user").addEventListener("click", () => {
    openModal("Adicionar usuário", `
      <div class="field"><label for="uf-email">E-mail *</label><input type="email" id="uf-email" /></div>
      <div class="field"><label for="uf-role">Perfil</label><select id="uf-role">${USER_ROLE_INFO.map(r => `<option ${r.role === "Colaborador" ? "selected" : ""}>${r.role}</option>`).join("")}</select></div>
    `, `
      <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
      <button class="btn-primary" id="modal-save" type="button">Adicionar</button>
    `);
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-save").addEventListener("click", async () => {
      const email = document.getElementById("uf-email").value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showToast("Informe um e-mail válido."); return; }
      if (DATA.appUsers.some(u => u.email === email)) { showToast("Este e-mail já tem um perfil."); return; }
      DATA.appUsers.push({ id: uid(), email, role: document.getElementById("uf-role").value, isDemo: false });
      logAudit("criou", "Usuário", null, email + " adicionado");
      await saveData();
      closeModal();
      showToast("Usuário adicionado. Agora crie o login dele no Supabase.");
      renderView("configuracoes");
    });
  });

  const adminCount = () => DATA.appUsers.filter(u => u.role === "Administrador").length;
  document.querySelectorAll("[data-user-role]").forEach(sel => {
    sel.addEventListener("change", async () => {
      const user = DATA.appUsers.find(u => u.id === sel.dataset.userRole);
      if (user.role === "Administrador" && sel.value !== "Administrador" && adminCount() === 1) {
        showToast("Precisa existir pelo menos um administrador.");
        renderView("configuracoes");
        return;
      }
      user.role = sel.value;
      logAudit("atualizou", "Usuário", null, user.email + " agora é " + user.role);
      await saveData();
      showToast("Perfil atualizado.");
      if (user.email === CURRENT_USER_EMAIL.toLowerCase()) {
        CURRENT_ROLE = user.role;
        renderSidebar();
        renderView(currentView);
      }
    });
  });
  document.querySelectorAll("[data-delete-user]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const user = DATA.appUsers.find(u => u.id === btn.dataset.deleteUser);
      if (user.email === CURRENT_USER_EMAIL.toLowerCase()) { showToast("Você não pode remover o seu próprio acesso."); return; }
      if (user.role === "Administrador" && adminCount() === 1) { showToast("Precisa existir pelo menos um administrador."); return; }
      if (!window.confirm("Remover o acesso de " + user.email + "?")) return;
      DATA.appUsers = DATA.appUsers.filter(u => u.id !== user.id);
      logAudit("removeu", "Usuário", null, user.email + " removido");
      await saveData();
      showToast("Acesso removido.");
      renderView("configuracoes");
    });
  });

  document.getElementById("btn-save-agency").addEventListener("click", async () => {
    Object.assign(DATA.settings, {
      agencyName: document.getElementById("cf-agencyName").value.trim(),
      document: document.getElementById("cf-document").value.trim(),
      phone: document.getElementById("cf-phone").value.trim(),
      whatsapp: document.getElementById("cf-whatsapp").value.trim(),
      email: document.getElementById("cf-email").value.trim(),
      pixKey: document.getElementById("cf-pixKey").value.trim(),
      address: document.getElementById("cf-address").value.trim(),
      bankData: document.getElementById("cf-bankData").value.trim(),
    });
    await saveData();
    document.querySelector(".brand-name").textContent = DATA.settings.agencyName || "Maximizze";
    showToast("Dados da agência atualizados.");
  });

  const clearBtn = document.getElementById("btn-clear-demo");
  if (clearBtn) clearBtn.addEventListener("click", async () => {
    const count = countDemoRecords();
    if (count === 0) return;
    const ok = window.confirm("Remover " + count + " registro(s) demonstrativo(s)? Essa ação não pode ser desfeita.");
    if (!ok) return;

    const keys = ["clients","employees","leads","projects","tasks","contentPosts","payments","agencyCosts","employeePayments","budgets","expenses","revenues","contracts","auditLogs"];
    keys.forEach(k => { DATA[k] = (DATA[k] || []).filter(x => !(x && x.isDemo)); });
    DATA.isDemo = false;
    logAudit("removeu", "Dados demonstrativos", null, count + " registro(s) demonstrativo(s) removido(s)");
    await saveData();
    showToast("Dados demonstrativos removidos.");
    renderView("configuracoes");
  });
}

// ===========================================================================
// Boot
// ===========================================================================
(async function boot() {
  const { data } = await sb.auth.getSession();
  const session = data.session;

  if (AUTH_LINK.error) {
    // Link invalido/expirado: explica em vez de deixar a tela de login muda.
    setRecoveryFlag(false);
    clearAuthUrl();
    if (session && session.user) {
      await enterApp(session.user.email);
      showToast("O link de redefinição expirou ou já foi usado.");
    } else {
      openForgot(authLinkErrorText());
    }
    return;
  }
  if (hasRecoveryFlag()) {
    if (session && session.user) { showAuthPanel("reset"); return; }
    setRecoveryFlag(false);
    clearAuthUrl();
    openForgot("Este link expirou ou já foi usado. Peça um novo abaixo.");
    return;
  }
  if (session && session.user) await enterApp(session.user.email);
})();
</script>
