function openPaymentModal(client, mode) {
  const { next } = clientPaymentSummary(client.id);
  const target = next || null;
  const title = mode === "partial" ? "Registrar pagamento parcial" : "Confirmar pagamento";
  const body = `
    <div class="field">
      <label>Valor pago (R$)</label>
      <input type="number" step="0.01" id="pm-value" value="${target ? target.value : client.monthlyValue}" />
    </div>
    <div class="field">
      <label>Data do pagamento</label>
      <input type="date" id="pm-date" value="${localToday()}" />
    </div>
    <div class="field">
      <label>Forma de pagamento</label>
      <select id="pm-method">${PAYMENT_METHODS.map(m => `<option>${m}</option>`).join("")}</select>
    </div>
    <div class="field">
      <label>Observação</label>
      <textarea id="pm-notes"></textarea>
    </div>
  `;
  openModal(title, body, `
    <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
    <button class="btn-primary" id="modal-save" type="button">Salvar</button>
  `);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", async () => {
    const value = parseFloat(document.getElementById("pm-value").value) || 0;
    const date = document.getElementById("pm-date").value;
    const method = document.getElementById("pm-method").value;
    const notes = document.getElementById("pm-notes").value.trim();
    const isPartial = mode === "partial";

    if (target) {
      target.status = isPartial ? "PARCIAL" : "PAGO";
      target.paidValue = value;
      target.paymentDate = date;
      target.paymentMethod = method;
      target.notes = notes;
    } else {
      DATA.payments.push({
        id: uid(), clientId: client.id, competencia: monthLabelNow(),
        value: client.monthlyValue, paidValue: value, dueDate: dueDateFor(monthLabelNow(), client.dueDay),
        paymentDate: date, paymentMethod: method, status: isPartial ? "PARCIAL" : "PAGO", notes, isDemo: false,
      });
    }
    if (!isPartial && client.status === "INADIMPLENTE" && !DATA.payments.some(p => p.clientId === client.id && p.status === "ATRASADO")) client.status = "ATIVO";
    logAudit("registrou", "Pagamento", client.id, (isPartial ? "Pagamento parcial de " : "Pagamento de ") + client.companyName + ": " + fmtBRL(value));
    await saveData();
    closeModal();
    showToast("Pagamento registrado.");
    renderView("cliente-detail");
  });
}

function attachClientDetailEvents() {
  document.getElementById("back-to-clients").addEventListener("click", (e) => { e.preventDefault(); currentClientId = null; renderView("clientes"); });
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => { clientDetailTab = btn.dataset.tab; renderView("cliente-detail"); });
  });

  const client = DATA.clients.find(c => c.id === currentClientId);
  if (!client) return;

  if (clientDetailTab === "info") {
    const editBtn = document.getElementById("btn-edit-client");
    if (editBtn) editBtn.addEventListener("click", () => {
      openModal("Editar cliente", clientFormHtml(client), `
        <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
        <button class="btn-primary" id="modal-save" type="button">Salvar alterações</button>
      `);
      document.getElementById("modal-cancel").addEventListener("click", closeModal);
      document.getElementById("modal-save").addEventListener("click", async () => {
        const values = readClientForm();
        if (!values.companyName) { showToast("Informe o nome da empresa."); return; }
        Object.assign(client, values);
        await saveData();
        closeModal();
        showToast("Cliente atualizado.");
        renderView("cliente-detail");
      });
    });

    const deleteBtn = document.getElementById("btn-delete-client");
    if (deleteBtn) deleteBtn.addEventListener("click", async () => {
      const ok = window.confirm("Excluir " + client.companyName + "? Isso remove também mensalidades, projetos, tarefas, contratos, orçamentos e receitas vinculados a este cliente. Essa ação não pode ser desfeita.");
      if (!ok) return;
      deleteClientCascade(client.id);
      await saveData();
      currentClientId = null;
      showToast("Cliente excluído.");
      renderView("clientes");
    });
  }

  if (clientDetailTab === "servicos") {
    document.querySelectorAll("[data-remove-service]").forEach(btn => {
      btn.addEventListener("click", async () => {
        client.services = (client.services || []).filter(s => s !== btn.dataset.removeService);
        await saveData();
        renderView("cliente-detail");
      });
    });
    document.querySelectorAll("[data-add-service]").forEach(btn => {
      btn.addEventListener("click", async () => {
        client.services = client.services || [];
        client.services.push(btn.dataset.addService);
        await saveData();
        renderView("cliente-detail");
      });
    });
  }

  if (clientDetailTab === "financeiro") {
    const confirmBtn = document.getElementById("btn-confirm-payment");
    const partialBtn = document.getElementById("btn-partial-payment");
    const delinquentBtn = document.getElementById("btn-mark-delinquent");
    if (confirmBtn) confirmBtn.addEventListener("click", () => openPaymentModal(client, "full"));
    if (partialBtn) partialBtn.addEventListener("click", () => openPaymentModal(client, "partial"));
    if (delinquentBtn) delinquentBtn.addEventListener("click", async () => {
      client.status = "INADIMPLENTE";
      const { next } = clientPaymentSummary(client.id);
      if (next) next.status = "ATRASADO";
      logAudit("marcou", "Cliente", client.id, client.companyName + " marcado como inadimplente");
      await saveData();
      showToast("Cliente marcado como inadimplente.");
      renderView("cliente-detail");
    });
  }
}

function mensalidadeFiltered() {
  const now = monthLabelNow();
  const next = monthLabelOffset(1);
  return DATA.payments.filter(p => {
    if (mensalidadeFilter === "pagos") return p.status === "PAGO";
    if (mensalidadeFilter === "pendentes") return p.status === "PENDENTE";
    if (mensalidadeFilter === "atrasados") return p.status === "ATRASADO";
    if (mensalidadeFilter === "este_mes") return p.competencia === now;
    if (mensalidadeFilter === "proximo_mes") return p.competencia === next;
    return true;
  });
}

function chargeMessage(p, client) {
  const name = client.contactName || client.companyName;
  const month = fmtMonth(p.competencia || (p.dueDate || "").slice(0, 7));
  const lines = p.status === "ATRASADO"
    ? ["Olá, " + name + "! Tudo bem?", "Identificamos em aberto a mensalidade de " + month + " da " + client.companyName + ", no valor de " + fmtBRL(p.value) + ", vencida em " + fmtDate(p.dueDate) + ".", "Pode nos confirmar o pagamento?"]
    : ["Olá, " + name + "! Tudo bem?", "Passando para lembrar da mensalidade de " + month + " da " + client.companyName + ", no valor de " + fmtBRL(p.value) + ", com vencimento em " + fmtDate(p.dueDate) + "."];
  if (DATA.settings.pixKey) lines.push("Chave Pix: " + DATA.settings.pixKey);
  return lines.join("\n\n");
}

function renderMensalidades() {
  const all = DATA.payments;
  const totalPrevisto = all.reduce((s, p) => s + Number(p.value), 0);
  const totalRecebido = all.filter(p => p.status === "PAGO").reduce((s, p) => s + Number(p.paidValue || p.value), 0);
  const totalAtrasado = all.filter(p => p.status === "ATRASADO").reduce((s, p) => s + Number(p.value), 0);
  const totalAReceber = all.filter(p => p.status !== "PAGO" && p.status !== "CANCELADO").reduce((s, p) => s + Number(p.value), 0);

  const filters = [
    ["todos", "Todos"], ["pagos", "Pagos"], ["pendentes", "Pendentes"],
    ["atrasados", "Atrasados"], ["este_mes", "Este mês"], ["proximo_mes", "Próximo mês"],
  ];

  const rows = mensalidadeFiltered().sort((a, b) => (b.dueDate || "").localeCompare(a.dueDate || "")).map(p => {
    const client = DATA.clients.find(c => c.id === p.clientId);
    const charge = client && p.status !== "PAGO" && p.status !== "CANCELADO" ? whatsappUrl(client.whatsapp, chargeMessage(p, client)) : "";
    const st = PAYMENT_STATUS_LABELS[p.status] || PAYMENT_STATUS_LABELS.PENDENTE;
    return `
      <tr>
        <td><span class="row-link" data-goto-client="${p.clientId}">${escapeHtml(client ? client.companyName : "-")}</span></td>
        <td>${fmtBRL(p.value)}</td>
        <td>${fmtDate(p.dueDate)}</td>
        <td><span class="badge ${st.cls}"><span class="badge-dot" style="background:currentColor"></span>${st.label}</span></td>
        <td>${fmtDate(p.paymentDate)}</td>
        <td class="cell-actions">
          ${charge ? `<a class="btn-ghost btn-sm" href="${escapeHtml(charge)}" target="_blank" rel="noopener">Cobrar</a>` : ""}
          ${p.status !== "PAGO" ? `<button class="btn-ghost btn-sm" data-quick-confirm="${p.id}" type="button">Confirmar</button>` : ""}
        </td>
      </tr>
    `;
  }).join("") || `<tr class="empty-row"><td colspan="6">Nenhuma mensalidade encontrada para este filtro.</td></tr>`;

  const kpi = (label, value, cls) => `<div class="panel kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value" style="${cls || ""}">${fmtBRL(value)}</div></div>`;

  return `
    <div class="page-title">Mensalidades</div>
    <div class="page-sub">Controle de cobranças recorrentes dos clientes</div>

    <div class="summary-grid">
      ${kpi("Total a receber", totalAReceber)}
      ${kpi("Total recebido", totalRecebido, "color:var(--success)")}
      ${kpi("Total atrasado", totalAtrasado, "color:var(--alert)")}
      ${kpi("Total previsto", totalPrevisto)}
    </div>

    <div class="toolbar">
      ${filters.map(([key, label]) => `<button class="filter-chip ${mensalidadeFilter === key ? "active" : ""}" data-filter="${key}" type="button">${label}</button>`).join("")}
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Cliente</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Data pagamento</th><th>Ações</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function attachMensalidadesEvents() {
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => { mensalidadeFilter = btn.dataset.filter; renderView("mensalidades"); });
  });
  document.querySelectorAll("[data-goto-client]").forEach(el => {
    el.addEventListener("click", () => { currentClientId = el.dataset.gotoClient; clientDetailTab = "financeiro"; renderView("cliente-detail"); });
  });
  document.querySelectorAll("[data-quick-confirm]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const payment = DATA.payments.find(p => p.id === btn.dataset.quickConfirm);
      if (!payment) return;
      payment.status = "PAGO";
      payment.paidValue = payment.value;
      payment.paymentDate = localToday();
      payment.paymentMethod = payment.paymentMethod || "PIX";
      const client = DATA.clients.find(c => c.id === payment.clientId);
      if (client && client.status === "INADIMPLENTE" && !DATA.payments.some(p => p.clientId === client.id && p.status === "ATRASADO")) client.status = "ATIVO";
      await saveData();
      showToast("Pagamento confirmado.");
      renderView("mensalidades");
    });
  });
}

// ===========================================================================
// CALCULADORA DE ORCAMENTOS
// ===========================================================================
const BILLING_LABELS = { MENSAL: "Mensal", AVULSO: "Avulso" };
const SERVICE_CATEGORIES = ["Design", "Audiovisual", "Web", "Tráfego", "Automação", "Social média", "Outros"];
const SERVICE_UNITS = ["por arte", "por captação", "por vídeo", "por projeto", "por mês", "por hora", "por diária", "por serviço"];
const SCENARIO_LABELS = { MINIMO: "Mínimo", RECOMENDADO: "Recomendado", PREMIUM: "Premium", TABELA: "Tabela de preços", MANUAL: "Valor manual" };

function nextBudgetNumber() {
  const year = String(new Date().getFullYear());
  const used = DATA.budgets.map(b => String(b.number || "")).filter(n => n.startsWith(year + "-")).map(n => parseInt(n.split("-")[1]) || 0);
  return year + "-" + String((used.length ? Math.max(...used) : 0) + 1).padStart(3, "0");
}

function num(v) { return Number(v) || 0; }

// ---------------------------------------------------------------------------
// Calculo
// ---------------------------------------------------------------------------
function budgetCosts(b) {
  const items = b.items || [];
  const monthly = items.filter(i => i.billing === "MENSAL");
  const oneOff = items.filter(i => i.billing !== "MENSAL");
  const sum = (list, key) => list.reduce((s, i) => s + num(i.qty) * num(i[key]), 0);

  const legacy = !items.length && !b.billingType; // orcamentos antigos, de custo unico
  const hasMonthly = monthly.length > 0 || (!items.length && b.billingType === "MENSAL");
  const usesRateio = hasMonthly || legacy;

  // O novo cliente entra na divisao. Trabalho so avulso nao recebe rateio automatico.
  const client = DATA.clients.find(c => c.id === b.clientId);
  const activeCount = DATA.clients.filter(c => c.status === "ATIVO").length;
  const divisor = Math.max(1, activeCount + (client && client.status === "ATIVO" ? 0 : 1));
  const softwareTotal = DATA.agencyCosts.filter(c => c.category === "SOFTWARE").reduce((s, c) => s + num(c.value), 0);
  const fixedTotal = DATA.agencyCosts.filter(c => c.category !== "SOFTWARE").reduce((s, c) => s + num(c.value), 0);

  const shareOf = (mode, manual, snapshot, total) => {
    if (mode === "MANUAL") return num(manual);
    if (mode !== "RATEIO_AUTOMATICO" || !usesRateio) return 0;
    return snapshot != null ? num(snapshot) : total / divisor;
  };
  const softwareCost = shareOf(b.softwareCostMode, b.manualSoftwareCost, b.softwareCostSnapshot, softwareTotal);
  const overheadCost = shareOf(b.overheadCostMode, b.manualOverheadCost, b.overheadCostSnapshot, fixedTotal);
  const employeeCost = (b.employeeItems || []).filter(i => i.selected !== false).reduce((s, i) => s + num(i.costValue), 0);
  const general = employeeCost + softwareCost + overheadCost + num(b.operationalCost) + num(b.otherCosts);

  const monthlyCost = sum(monthly, "unitCost") + (hasMonthly ? general : 0);
  const oneOffCost = sum(oneOff, "unitCost") + (hasMonthly ? 0 : general);
  return {
    employeeCost, softwareCost, overheadCost, general, hasMonthly,
    itemCost: sum(items, "unitCost"), monthlyCost, oneOffCost, totalCost: monthlyCost + oneOffCost,
    listMonthly: sum(monthly, "unitPrice"), listOneOff: sum(oneOff, "unitPrice"),
    rate: (num(b.taxPercent) + num(b.feePercent)) / 100,
  };
}

function roundCommercial(v) {
  if (v <= 0) return 0;
  const step = v < 100 ? 1 : v < 1000 ? 10 : 50;
  return Math.ceil(v / step - 1e-9) * step;
}

function priceForMargin(cost, marginPct, rate) {
  const denominator = 1 - num(marginPct) / 100 - rate;
  return denominator > 0 ? cost / denominator : 0;
}

function scenarioPrices(b, key, costs) {
  const c = costs || budgetCosts(b);
  if (key === "TABELA") return { monthly: c.listMonthly, oneOff: c.listOneOff };
  if (key === "MANUAL") return { monthly: num(b.finalMonthly), oneOff: num(b.finalOneOff) };
  const margin = key === "MINIMO" ? b.minMargin : key === "PREMIUM" ? b.premiumMargin : b.recommendedMargin;
  const finish = (v) => b.roundPrices ? roundCommercial(v) : Math.round(v * 100) / 100;
  return { monthly: finish(priceForMargin(c.monthlyCost, margin, c.rate)), oneOff: finish(priceForMargin(c.oneOffCost, margin, c.rate)) };
}

function realMargin(prices, c) {
  const revenue = prices.monthly + prices.oneOff;
  if (revenue <= 0) return { profit: -c.totalCost, margin: 0 };
  const profit = revenue * (1 - c.rate) - c.totalCost;
  return { profit, margin: (profit / revenue) * 100 };
}

function budgetFinalPrices(b, costs) {
  if (b.selectedScenario && (b.finalMonthly != null || b.finalOneOff != null)) return { monthly: num(b.finalMonthly), oneOff: num(b.finalOneOff) };
  return scenarioPrices(b, "RECOMENDADO", costs);
}

// Mantido para relatorios e listas: preco total em cada cenario.
function computeBudget(b) {
  const c = budgetCosts(b);
  const total = (k) => { const p = scenarioPrices(b, k, c); return p.monthly + p.oneOff; };
  return { ...c, minPrice: total("MINIMO"), recommendedPrice: total("RECOMENDADO"), premiumPrice: total("PREMIUM") };
}

function budgetProblems(b) {
  const c = budgetCosts(b);
  const errors = [], warnings = [];
  const margins = [num(b.minMargin), num(b.recommendedMargin), num(b.premiumMargin)];
  if (margins.some(m => m < 0)) errors.push("As margens não podem ser negativas.");
  if (margins[0] > margins[1] || margins[1] > margins[2]) errors.push("A ordem das margens deve ser: mínima, recomendada e premium, da menor para a maior.");
  if (num(b.taxPercent) < 0 || num(b.feePercent) < 0) errors.push("Imposto e taxas não podem ser negativos.");
  if (Math.max(...margins) + num(b.taxPercent) + num(b.feePercent) >= 100) errors.push("Margem, imposto e taxas somados precisam ficar abaixo de 100%.");
  const hasList = c.listMonthly + c.listOneOff > 0;
  if (c.totalCost <= 0 && !hasList) errors.push("Adicione um serviço com preço ou informe algum custo: sem isso, o preço daria R$ 0,00.");
  if ((b.items || []).some(i => num(i.qty) <= 0)) errors.push("A quantidade de cada serviço precisa ser maior que zero.");
  if ((b.items || []).some(i => !String(i.name || "").trim())) errors.push("Dê um nome a todos os serviços adicionados.");
  if ((b.employeeItems || []).some(i => i.selected !== false && num(i.costValue) <= 0)) warnings.push("Há pessoa da equipe selecionada com custo zerado.");
  if ((b.items || []).some(i => num(i.unitPrice) <= 0)) warnings.push("Há serviço sem preço de tabela.");
  if ((b.items || []).some(i => num(i.unitCost) <= 0) && c.employeeCost <= 0) warnings.push("Há serviço sem custo e nenhuma pessoa selecionada: a margem pode parecer maior do que é.");
  if (num(b.taxPercent) === 0) warnings.push("Imposto em 0%: confirme se é isso mesmo.");
  if (!c.hasMonthly && (b.softwareCostMode === "RATEIO_AUTOMATICO" || b.overheadCostMode === "RATEIO_AUTOMATICO") && (b.items || []).length) warnings.push("Trabalho só avulso não recebe rateio automático de custos mensais. Use valor manual se quiser incluir uma parte.");
  return { errors, warnings };
}

function fmtPrices(p) {
  const parts = [];
  if (p.monthly > 0) parts.push(fmtBRL(p.monthly) + "/mês");
  if (p.oneOff > 0) parts.push(fmtBRL(p.oneOff) + (p.monthly > 0 ? " avulso" : ""));
  return parts.join(" + ") || fmtBRL(0);
}

function budgetPartyName(b) {
  const client = DATA.clients.find(c => c.id === b.clientId);
  return client ? client.companyName : (b.prospectName || "-");
}

function budgetsAwaitingReturn() {
  const today = localToday();
  return DATA.budgets.filter(b => b.status === "ENVIADO" && b.followUpDate && b.followUpDate <= today)
    .sort((x, y) => x.followUpDate.localeCompare(y.followUpDate));
}

function addDays(dateStr, days) {
  const d = parseDate(dateStr); d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}

function canEditPrices() { return CURRENT_ROLE !== "Financeiro"; }

function serviceMarginText(s) {
  const price = num(s.basePrice), cost = num(s.internalCostEstimate);
  if (price <= 0) return "Sem preço";
  if (cost <= 0) return "Sem custo";
  const rate = (num(DATA.settings.taxPercent) + num(DATA.settings.feePercent)) / 100;
  return ((price * (1 - rate) - cost) / price * 100).toFixed(1) + "%";
}

function renderPrecos() {
  const services = [...DATA.services].sort((a, b) => (a.category || "Outros").localeCompare(b.category || "Outros") || (a.name || "").localeCompare(b.name || ""));
  const editable = canEditPrices();
  const rows = services.map(s => `
    <tr>
      <td>${editable ? `<button class="text-btn" data-edit-service="${s.id}" type="button">${escapeHtml(s.name)}</button>` : escapeHtml(s.name)}${s.status === "INATIVO" ? ` <span class="badge badge-gray">Inativo</span>` : ""}</td>
      <td>${escapeHtml(s.category || "-")}</td>
      <td>${escapeHtml(s.unit || "-")}</td>
      <td>${BILLING_LABELS[s.billingType] || "Avulso"}</td>
      <td><input class="price-input" type="number" min="0" step="0.01" data-service-price="${s.id}" aria-label="Preço de ${escapeHtml(s.name)}" value="${num(s.basePrice) || ""}" placeholder="Definir" ${editable ? "" : "disabled"} /></td>
      <td><input class="price-input" type="number" min="0" step="0.01" data-service-cost="${s.id}" aria-label="Custo de ${escapeHtml(s.name)}" value="${num(s.internalCostEstimate) || ""}" placeholder="Definir" ${editable ? "" : "disabled"} /></td>
      <td data-service-margin="${s.id}">${serviceMarginText(s)}</td>
      <td class="cell-actions"><button class="btn-danger-outline btn-sm" data-delete-service="${s.id}" type="button">Excluir</button></td>
    </tr>
  `).join("") || `<tr class="empty-row"><td colspan="8">Nenhum serviço cadastrado ainda.</td></tr>`;
  const missing = services.filter(s => s.status !== "INATIVO" && num(s.basePrice) <= 0).length;

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Tabela de preços</div>
        <div class="page-sub">Preço de venda e custo interno de cada serviço. Os orçamentos partem daqui.</div>
      </div>
      <button class="btn-primary" id="btn-new-service" type="button">+ Novo serviço</button>
    </div>
    ${missing ? `<p class="bp-warn" style="margin:0 0 12px;">${missing} serviço(s) ainda sem preço.</p>` : ""}

  return `
    <div class="form-grid">
      <div class="field full"><label for="sf-name">Nome *</label><input type="text" id="sf-name" value="${val(s.name)}" /></div>

      <div class="field"><label for="sf-price">Preço de venda (R$)</label><input type="number" min="0" step="0.01" id="sf-price" value="${val(s.basePrice)}" /></div>
      <div class="field"><label for="sf-cost">Custo interno (R$)</label><input type="number" min="0" step="0.01" id="sf-cost" value="${val(s.internalCostEstimate)}" /></div>
      <div class="field"><label for="sf-billing">Cobrança</label><select id="sf-billing">${Object.keys(BILLING_LABELS).map(k => `<option value="${k}" ${(s.billingType || "AVULSO") === k ? "selected" : ""}>${BILLING_LABELS[k]}</option>`).join("")}</select></div>
      <div class="field"><label for="sf-status">Status</label><select id="sf-status"><option value="ATIVO" ${s.status !== "INATIVO" ? "selected" : ""}>Ativo</option><option value="INATIVO" ${s.status === "INATIVO" ? "selected" : ""}>Inativo</option></select></div>
      <div class="field"><label for="sf-days">Prazo (dias)</label><input type="number" min="0" id="sf-days" value="${val(s.deadlineDays)}" /></div>
      <div class="field"><label for="sf-deliverables">Quantidade de entregas</label><input type="number" min="0" id="sf-deliverables" value="${val(s.deliverablesCount)}" /></div>
      <div class="field full"><label for="sf-description">O que está incluído</label><textarea id="sf-description">${val(s.description)}</textarea></div>
    </div>
  `;
}

function openServiceModal(service) {
  const isNew = !service;
  openModal(isNew ? "Novo serviço" : "Editar serviço", serviceFormHtml(service), `
    <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
    <button class="btn-primary" id="modal-save" type="button">Salvar serviço</button>
  `);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", async () => {
    const v = (id) => document.getElementById(id).value.trim();
    const name = v("sf-name");
    if (!name) { showToast("Informe o nome do serviço."); return; }
    if (DATA.services.some(s => s !== service && normalizeText(s.name) === normalizeText(name))) { showToast("Já existe um serviço com esse nome."); return; }
    const values = {
      name, category: v("sf-category"), unit: v("sf-unit"), billingType: v("sf-billing"), status: v("sf-status"),
      basePrice: Math.max(0, parseFloat(v("sf-price")) || 0), internalCostEstimate: Math.max(0, parseFloat(v("sf-cost")) || 0),
      deadlineDays: parseInt(v("sf-days")) || null, deliverablesCount: parseInt(v("sf-deliverables")) || null, description: v("sf-description"),
    };
    if (isNew) DATA.services.push({ id: uid(), ...values, isDemo: false });
    else Object.assign(service, values);
    await saveData();
    closeModal();
    showToast(isNew ? "Serviço cadastrado." : "Serviço atualizado.");
    renderView("precos");
  });
}

function attachPrecosEvents() {
  document.getElementById("btn-new-service").addEventListener("click", () => openServiceModal(null));
  document.querySelectorAll("[data-edit-service]").forEach(b => b.addEventListener("click", () => openServiceModal(DATA.services.find(s => s.id === b.dataset.editService))));
  const inline = (attr, field) => document.querySelectorAll("[" + attr + "]").forEach(input => {
    input.addEventListener("change", async () => {
      const id = input.getAttribute(attr);
      const service = DATA.services.find(s => s.id === id);
      service[field] = Math.max(0, parseFloat(input.value) || 0);
      await saveData();
      const cell = document.querySelector(`[data-service-margin="${id}"]`);
      if (cell) cell.textContent = serviceMarginText(service);
      showToast("Valor salvo.");
    });
  });
  inline("data-service-price", "basePrice");
  inline("data-service-cost", "internalCostEstimate");
  document.querySelectorAll("[data-delete-service]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const service = DATA.services.find(s => s.id === btn.dataset.deleteService);
      if (!service || !window.confirm("Excluir o serviço \"" + service.name + "\" da tabela? Orçamentos já feitos não mudam.")) return;
      DATA.services = DATA.services.filter(s => s.id !== service.id);
      logAudit("excluiu", "Serviço", service.id, service.name + " excluído da tabela de preços");
      await saveData();
      showToast("Serviço excluído.");
      renderView("precos");
    });
  });
}

function renderOrcamentosList() {

  const rows = budgets.map(b => {

      <div class="followup-row">

      </div>`).join("")}</div>` : ""}

function suggestedEmployeeCost(emp) {
  if (emp.contractType === "FIXO_MENSAL") return Math.round(num(emp.fixedValue) / (num(DATA.settings.clientsPerEmployee) || 3) * 100) / 100;
  if (emp.contractType === "POR_CLIENTE") return num(emp.perClientValue);
  if (emp.contractType === "POR_SERVICO") return num(emp.perServiceValue);
  return 0;
}

function newBudgetDraft(source) {
  const s = DATA.settings;
  const base = source ? clone(source) : {};
  const stored = base.employeeItems || [];
  const today = localToday();
  return {
    id: null, clientId: "", prospectName: "", prospectWhatsapp: "", estimatedClientRevenue: "",
    billingType: "MENSAL", softwareCostMode: "RATEIO_AUTOMATICO", manualSoftwareCost: 0,
    overheadCostMode: "RATEIO_AUTOMATICO", manualOverheadCost: 0, operationalCost: 0, otherCosts: 0,
    minMargin: s.minMargin, recommendedMargin: s.recommendedMargin, premiumMargin: s.premiumMargin,
    taxPercent: num(s.taxPercent), feePercent: num(s.feePercent), roundPrices: true, deliveryText: "", notes: "",
    paymentTerms: s.proposalPaymentTerms || "", validUntil: addDays(today, num(s.proposalValidityDays) || 15),
    ...base,
    items: base.items || [],
    billingType: base.billingType || "MENSAL",
    overheadCostMode: base.overheadCostMode || "NAO_CONSIDERAR",
    softwareCostSnapshot: null, overheadCostSnapshot: null,
    employeeItems: DATA.employees.filter(e => e.status === "ATIVO" || stored.some(i => i.employeeId === e.id)).map(e => {
      const saved = stored.find(i => i.employeeId === e.id);
      return { employeeId: e.id, selected: !!saved, costValue: saved ? num(saved.costValue) : 0 };
    }),
    ...(source ? {} : { overheadCostMode: "RATEIO_AUTOMATICO" }),
  };
}

function renderBudgetPreview(d) {
  const c = budgetCosts(d);
  const { errors, warnings } = budgetProblems(d);
  const row = (label, value) => `<div class="bp-row"><span>${label}</span><strong>${value}</strong></div>`;
  const keys = ["MINIMO", "RECOMENDADO", "PREMIUM"];
  if (c.listMonthly + c.listOneOff > 0) keys.push("TABELA");
  const scenarios = keys.map(k => {
    const p = scenarioPrices(d, k, c);
    const m = realMargin(p, c);
    return `<div class="bp-row"><span>${SCENARIO_LABELS[k]}<br><small style="color:var(--text-400)">margem real ${m.margin.toFixed(1)}%</small></span><strong>${fmtPrices(p)}</strong></div>`;
  }).join("");
  return `
    <div class="section-label" style="margin-top:0;">Resultado em tempo real</div>
    ${row("Custo mensal", fmtBRL(c.monthlyCost))}
    ${row("Custo avulso", fmtBRL(c.oneOffCost))}
    ${row("Imposto e taxas", ((c.rate * 100).toFixed(2).replace(".", ",")) + "%")}
    <div class="bp-block">${errors.length ? "" : scenarios}</div>
    ${errors.map(e => `<p class="bp-error">${escapeHtml(e)}</p>`).join("")}
    ${warnings.map(w => `<p class="bp-warn">${escapeHtml(w)}</p>`).join("")}
  `;
}

function budgetBarText(d) {
  const problems = budgetProblems(d);
  return problems.errors.length ? "Falta preencher" : fmtPrices(scenarioPrices(d, "RECOMENDADO"));
}

  const v = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };

  Object.assign(d, {
    clientId: v("bf-clientId") || null, prospectName: v("bf-prospectName"), prospectWhatsapp: v("bf-prospectWhatsapp"),
    estimatedClientRevenue: parseFloat(v("bf-estimatedRevenue")) || null,
    softwareCostMode: v("bf-swMode"), manualSoftwareCost: n("bf-swManual"),
    overheadCostMode: v("bf-ovMode"), manualOverheadCost: n("bf-ovManual"),
    operationalCost: n("bf-operational"), otherCosts: n("bf-other"),
    minMargin: n("bf-minMargin"), recommendedMargin: n("bf-recMargin"), premiumMargin: n("bf-premiumMargin"),
    taxPercent: n("bf-tax"), feePercent: n("bf-fee"), roundPrices: document.getElementById("bf-round").checked,
    validUntil: v("bf-validUntil") || null, deliveryText: v("bf-delivery"), paymentTerms: v("bf-terms"), notes: v("bf-notes"),
  });
  if (document.getElementById("bf-billing")) d.billingType = v("bf-billing");
  document.querySelectorAll("[data-item]").forEach(el => {
    const item = d.items[Number(el.dataset.item)];
    const field = el.dataset.itemField;
    item[field] = (field === "name" || field === "billing") ? el.value : (parseFloat(el.value) || 0);
  });
  document.querySelectorAll("[data-emp-toggle]").forEach(chk => { d.employeeItems.find(i => i.employeeId === chk.dataset.empToggle).selected = chk.checked; });
  document.querySelectorAll("[data-emp-cost]").forEach(inp => { d.employeeItems.find(i => i.employeeId === inp.dataset.empCost).costValue = parseFloat(inp.value) || 0; });
}

function attachOrcamentoFormEvents() {
  document.getElementById("back-to-budgets").addEventListener("click", (e) => { e.preventDefault(); renderView(budgetDraft.id ? "orcamento-detail" : "orcamentos"); });

  document.getElementById("budget-bar-view").addEventListener("click", () => document.getElementById("budget-preview").scrollIntoView({ behavior: "smooth", block: "start" }));
  const form = document.getElementById("budget-form");
  const refreshPreview = () => {
    readBudgetForm();
    document.getElementById("budget-preview").innerHTML = renderBudgetPreview(budgetDraft);
    document.getElementById("budget-bar-price").textContent = budgetBarText(budgetDraft);
    document.getElementById("bf-swManualWrap").style.display = budgetDraft.softwareCostMode === "MANUAL" ? "" : "none";
    document.getElementById("bf-ovManualWrap").style.display = budgetDraft.overheadCostMode === "MANUAL" ? "" : "none";
  };
  form.addEventListener("input", refreshPreview);
  form.addEventListener("change", refreshPreview);

  document.querySelectorAll("[data-emp-toggle]").forEach(chk => {
    chk.addEventListener("change", () => {
      const input = document.querySelector(`[data-emp-cost="${chk.dataset.empToggle}"]`);
      input.disabled = !chk.checked;
      if (chk.checked && !(parseFloat(input.value) > 0)) {
        const suggestion = suggestedEmployeeCost(DATA.employees.find(e => e.id === chk.dataset.empToggle));
        if (suggestion) input.value = suggestion;
      }
      refreshPreview();
    });
  });

  document.getElementById("bi-add-service").addEventListener("click", () => {
    const service = DATA.services.find(s => s.id === document.getElementById("bi-service").value);
    if (!service) { showToast("Escolha um serviço da tabela."); return; }
    readBudgetForm();
    budgetDraft.items.push({ serviceId: service.id, name: service.name, unit: service.unit || "", description: service.description || "", qty: 1, unitPrice: num(service.basePrice), unitCost: num(service.internalCostEstimate), billing: service.billingType || "AVULSO" });
    renderView("orcamento-form");
  });
  document.getElementById("bi-add-free").addEventListener("click", () => {
    readBudgetForm();
    budgetDraft.items.push({ serviceId: null, name: "", unit: "", description: "", qty: 1, unitPrice: 0, unitCost: 0, billing: "AVULSO" });
    renderView("orcamento-form");
  });
  document.querySelectorAll("[data-remove-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      readBudgetForm();
      budgetDraft.items.splice(Number(btn.dataset.removeItem), 1);
      renderView("orcamento-form");
    });
  });

  document.getElementById("btn-calc-budget").addEventListener("click", async () => {
    readBudgetForm();
    const d = budgetDraft;
    if (!d.clientId && !d.prospectName) { showToast("Selecione um cliente ou informe o nome do prospect."); return; }
    const { errors } = budgetProblems(d);
    if (errors.length) { showToast(errors[0]); return; }

    // Congela os rateios: mudar custos ou clientes depois nao altera o que foi enviado.
    const costs = budgetCosts(d);
    const scenario = d.selectedScenario && d.selectedScenario !== "MANUAL" ? d.selectedScenario : (d.selectedScenario === "MANUAL" ? "MANUAL" : "RECOMENDADO");
    const record = {
      clientId: d.clientId, prospectName: d.prospectName, prospectWhatsapp: d.prospectWhatsapp, estimatedClientRevenue: d.estimatedClientRevenue,
      billingType: d.items.length ? (costs.hasMonthly ? "MENSAL" : "AVULSO") : d.billingType, items: d.items,
      employeeItems: d.employeeItems.filter(i => i.selected).map(i => ({ employeeId: i.employeeId, costValue: num(i.costValue) })),
      softwareCostMode: d.softwareCostMode, manualSoftwareCost: num(d.manualSoftwareCost), softwareCostSnapshot: costs.softwareCost,
      overheadCostMode: d.overheadCostMode, manualOverheadCost: num(d.manualOverheadCost), overheadCostSnapshot: costs.overheadCost,
      operationalCost: num(d.operationalCost), otherCosts: num(d.otherCosts),
      minMargin: num(d.minMargin), recommendedMargin: num(d.recommendedMargin), premiumMargin: num(d.premiumMargin),
      taxPercent: num(d.taxPercent), feePercent: num(d.feePercent), roundPrices: !!d.roundPrices,
      validUntil: d.validUntil, deliveryText: d.deliveryText, paymentTerms: d.paymentTerms, notes: d.notes,
      selectedScenario: scenario,
    };
    const finals = scenario === "MANUAL" ? { monthly: num(d.finalMonthly), oneOff: num(d.finalOneOff) } : scenarioPrices({ ...record }, scenario);
    record.finalMonthly = finals.monthly;
    record.finalOneOff = finals.oneOff;

    let budget = d.id ? DATA.budgets.find(b => b.id === d.id) : null;
    if (budget) Object.assign(budget, record);
    else {
      budget = { id: uid(), number: nextBudgetNumber(), status: "RASCUNHO", createdAt: localToday(), isDemo: false, ...record };
      DATA.budgets.push(budget);
    }
    await saveData();
    currentBudgetId = budget.id;
    showToast("Orçamento salvo.");
    renderView("orcamento-detail");
  });
}

function renderOrcamentoDetail(budgetId) {

  const chosen = b.selectedScenario || "RECOMENDADO";
  const locked = !!b.convertedAt;

  const card = (key, label, marginLabel) => {
    const p = scenarioPrices(b, key, c);
    const m = realMargin(p, c);
    const isChosen = chosen === key;
    return `

        <div class="kv-label" style="margin-bottom:4px;">${label}</div>

        ${locked ? "" : `<button class="${isChosen ? "btn-primary" : "btn-ghost"} btn-sm" data-use-scenario="${key}" type="button" style="margin-top:8px;" ${isChosen ? "disabled" : ""}>${isChosen ? "Escolhido" : "Usar este preço"}</button>`}
      </div>
    `;
  };

  const alerts = [];
  if (finalMargin.profit < 0) alerts.push("O preço escolhido dá prejuízo depois de custos e impostos.");
  else if (finalMargin.margin < num(b.minMargin)) alerts.push("O preço escolhido está abaixo da margem mínima de " + num(b.minMargin) + "%.");
  if (num(b.taxPercent) === 0 && b.taxPercent != null) alerts.push("Este orçamento não considera imposto.");

      </div>

        <span class="badge ${st.cls}"><span class="badge-dot" style="background:currentColor"></span>${st.label}</span>

          ${Object.keys(BUDGET_STATUS_LABELS).map(k => `<option value="${k}" ${b.status === k ? "selected" : ""}>${BUDGET_STATUS_LABELS[k].label}</option>`).join("")}
        </select>
        ${locked ? "" : `<button class="btn-ghost btn-sm" id="btn-edit-budget" type="button">Editar</button>`}
        <button class="btn-ghost btn-sm" id="btn-duplicate-budget" type="button">Duplicar</button>
        ${locked ? "" : `<button class="btn-danger-outline btn-sm" id="btn-delete-budget" type="button">Excluir</button>`}
      </div>
    </div>

    <div class="detail-actions" style="margin-top:14px;">

      <button class="btn-ghost btn-sm" id="btn-send-whatsapp" type="button">Enviar por WhatsApp</button>
      ${b.status === "ENVIADO" ? `<label class="inline-note" for="bd-followup">Cobrar retorno em</label><input type="date" id="bd-followup" value="${escapeHtml(b.followUpDate || "")}" style="width:auto;" />` : ""}
      ${locked ? `<span class="inline-note">Convertido em cliente em ${fmtDate(b.convertedAt)}. Para mudar valores, duplique.</span>` : ""}
    </div>

    ${alertBox}

    <div class="section-label">Escolha o preço</div>
    <div class="scenario-grid">
      ${card("MINIMO", "Mínimo", "Margem-alvo de " + num(b.minMargin) + "%")}

      target.services = [...new Set([...(target.services || []), ...names])];
      target.teamIds = [...new Set([...(target.teamIds || []), ...teamIds])];
      if (target.status === "EM_NEGOCIACAO") target.status = "ATIVO";
    }
    if (checked("ap-contract")) {
      DATA.contracts.push({ id: uid(), clientId: target.id, servicesDescription: names.join(", "), value: finals.monthly, startDate: today, endDate: null, autoRenew: false, status: "ATIVO", notes: "Orçamento #" + b.number, fileUrl: "", isDemo: false });

      await saveData();
      renderView("orcamento-detail");
    });

  const followup = document.getElementById("bd-followup");

  const editBtn = document.getElementById("btn-edit-budget");
  if (editBtn) editBtn.addEventListener("click", () => {
    budgetDraft = { ...newBudgetDraft(b), id: b.id, number: b.number };
    renderView("orcamento-form");
  });
  document.getElementById("btn-duplicate-budget").addEventListener("click", () => {
    budgetDraft = newBudgetDraft(b);
    Object.assign(budgetDraft, { id: null, number: null, status: undefined, createdAt: undefined, sentAt: null, followUpDate: null, convertedAt: null, validUntil: addDays(localToday(), num(DATA.settings.proposalValidityDays) || 15) });
    showToast("Cópia aberta. Ela só será criada ao salvar.");
    renderView("orcamento-form");
  });
  const delBtn = document.getElementById("btn-delete-budget");
  if (delBtn) delBtn.addEventListener("click", async () => {
    if (!window.confirm("Excluir o orçamento #" + b.number + "? Essa ação não pode ser desfeita.")) return;
    DATA.budgets = DATA.budgets.filter(x => x.id !== b.id);
    logAudit("excluiu", "Orçamento", b.id, "Orçamento #" + b.number + " excluído");
    await saveData();
    showToast("Orçamento excluído.");
    renderView("orcamentos");
  });

  document.getElementById("btn-print-proposal").addEventListener("click", () => {
    const win = window.open("", "_blank");

    win.document.write(budgetProposalHtml(b));
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 400);

  document.getElementById("btn-send-whatsapp").addEventListener("click", async () => {
    const url = budgetWhatsappUrl(b);
    if (!url) { showToast("Informe o WhatsApp do cliente ou do prospect."); return; }
    window.open(url, "_blank", "noopener");

function employeeCostLabel(e) {
  if (e.contractType === "FIXO_MENSAL") return fmtBRL(e.fixedValue) + " /mês";
  if (e.contractType === "POR_CLIENTE") return fmtBRL(e.perClientValue) + " /cliente";
  if (e.contractType === "POR_SERVICO") return fmtBRL(e.perServiceValue) + " /servico";
  if (e.contractType === "PERCENTUAL" || e.contractType === "COMISSAO") return Number(e.percentage || 0) + "% sobre projeto";
  return "A combinar";
}

function employeeNameOf(payment) {
  return (DATA.employees.find(e => e.id === payment.employeeId) || {}).name || "Colaborador";
}

function employeeLoad() {
  const limit = Number(DATA.settings.clientsPerEmployee) || 3;
  const activeClients = DATA.clients.filter(c => c.status === "ATIVO" || c.status === "INADIMPLENTE");
  const people = DATA.employees.filter(e => e.status === "ATIVO").map(e => ({
    employee: e, count: activeClients.filter(c => (c.teamIds || []).includes(e.id)).length,
  }));
  return {
    limit, people,
    freeSlots: people.reduce((s, p) => s + Math.max(limit - p.count, 0), 0),
    overloaded: people.filter(p => p.count > limit),
    unassigned: activeClients.filter(c => !(c.teamIds || []).length),
  };
}

function renderCapacityPanel() {
  const load = employeeLoad();
  if (!load.people.length) return "";
  const rows = load.people.map(p => {
    const pct = Math.min(100, (p.count / load.limit) * 100);
    const cls = p.count > load.limit ? "over" : p.count === load.limit ? "full" : "";
    return `<div class="cap-row"><span>${escapeHtml(p.employee.name)}</span><div class="cap-track"><div class="cap-fill ${cls}" style="width:${pct}%"></div></div><span class="cap-count">${p.count}/${load.limit}</span></div>`;
  }).join("");
  const notes = [];
  notes.push(load.freeSlots + " vaga(s) livre(s) na equipe");
  if (load.overloaded.length) notes.push(load.overloaded.length + " pessoa(s) acima do limite");
  if (load.unassigned.length) notes.push(load.unassigned.length + " cliente(s) ativo(s) sem equipe definida");
  return `
    <div class="panel followup-panel">
      <div class="section-label" style="margin-top:0;">Capacidade da equipe</div>
      ${rows}
      <p style="font-size:12.5px;color:var(--text-400);margin-top:8px;">${notes.join(" &middot; ")}. O limite por pessoa fica em Configurações; a equipe de cada cliente, no cadastro do cliente.</p>
    </div>
  `;
}

// ===========================================================================
function monthsForFilter(filter) {
  const now = new Date();
  if (filter === "este_mes") return [monthLabelNow()];
  if (filter === "mes_anterior") return [monthLabelOffset(-1)];
  if (filter === "ultimos_3") return [monthLabelOffset(-2), monthLabelOffset(-1), monthLabelNow()];
  if (filter === "ultimos_6") return [-5,-4,-3,-2,-1,0].map(monthLabelOffset);
  if (filter === "este_ano") {
    const list = [];
    for (let m = 0; m <= now.getMonth(); m++) list.push(`${now.getFullYear()}-${String(m + 1).padStart(2, "0")}`);
    return list;
  }
  return [monthLabelNow()];
}

function computeFinanceiro(filter) {
  const months = monthsForFilter(filter);
  const monthSet = new Set(months);

  const mensalidadesRecebidas = DATA.payments.filter(p => monthSet.has(p.competencia) && (p.status === "PAGO" || p.status === "PARCIAL"));
  const revenuesPeriodo = DATA.revenues.filter(r => monthSet.has((r.date || "").slice(0, 7)));
  const entradas = [
    ...mensalidadesRecebidas.map(p => ({ desc: (DATA.clients.find(c => c.id === p.clientId) || {}).companyName || "Cliente", cat: "Mensalidade", value: Number(p.paidValue || p.value), date: p.paymentDate })),
    ...revenuesPeriodo.map(r => ({ desc: r.description, cat: r.category, value: Number(r.value), date: r.date })),
  ];
  const totalEntradas = entradas.reduce((s, e) => s + e.value, 0);

  const colaboradoresPagos = DATA.employeePayments.filter(p => monthSet.has(p.competencia) && p.status === "PAGO");
  const expensesPeriodo = DATA.expenses.filter(e => monthSet.has((e.date || "").slice(0, 7)));
  const custosAgenciaTotal = DATA.agencyCosts.reduce((s, c) => s + Number(c.value), 0) * months.length;

  const saidas = [
    ...colaboradoresPagos.map(p => ({ desc: employeeNameOf(p), cat: "Colaborador", value: Number(p.value), date: p.paymentDate })),
    ...expensesPeriodo.map(e => ({ desc: e.description, cat: COST_CATEGORY_LABELS[e.category] || e.category, value: Number(e.value), date: e.date })),
    { desc: "Custos fixos da agência (" + months.length + " mês(es))", cat: "Estrutura/Software", value: custosAgenciaTotal, date: null },
  ];
  const totalSaidas = saidas.reduce((s, e) => s + e.value, 0);

  const contasAPagar = DATA.employeePayments.filter(p => p.status !== "PAGO").reduce((s, p) => s + Number(p.value), 0)
    + DATA.expenses.filter(e => !e.paid).reduce((s, e) => s + Number(e.value), 0);
  const contasAReceber = DATA.payments.filter(p => p.status === "PENDENTE" || p.status === "ATRASADO" || p.status === "PARCIAL")
    .reduce((s, p) => s + Number(p.value) - (p.status === "PARCIAL" ? Number(p.paidValue || 0) : 0), 0);

  return { months, entradas, saidas, totalEntradas, totalSaidas, saldo: totalEntradas - totalSaidas, contasAPagar, contasAReceber };
}

function fluxoDeCaixa() {
  const last6 = [-5,-4,-3,-2,-1,0].map(monthLabelOffset);
  const custosAgenciaMensal = DATA.agencyCosts.reduce((s, c) => s + Number(c.value), 0);
  let saldoAcumulado = 0;
  return last6.map(m => {
    const entradas = DATA.payments.filter(p => p.competencia === m && (p.status === "PAGO" || p.status === "PARCIAL")).reduce((s, p) => s + Number(p.paidValue || p.value), 0)
      + DATA.revenues.filter(r => (r.date || "").slice(0, 7) === m).reduce((s, r) => s + Number(r.value), 0);
    const saidas = DATA.employeePayments.filter(p => p.competencia === m && p.status === "PAGO").reduce((s, p) => s + Number(p.value), 0)
      + DATA.expenses.filter(e => (e.date || "").slice(0, 7) === m).reduce((s, e) => s + Number(e.value), 0)
      + custosAgenciaMensal;
    const saldoInicial = saldoAcumulado;
    saldoAcumulado += entradas - saidas;
    return { month: m, saldoInicial, entradas, saidas, saldoFinal: saldoAcumulado };
  });
}

function rentabilidadePorCliente() {
  const activeClients = DATA.clients.filter(c => c.status === "ATIVO");
  const now = monthLabelNow();
  const totalColaboradoresMes = DATA.employeePayments.filter(p => p.competencia === now).reduce((s, p) => s + Number(p.value), 0);
  const softwareTotal = DATA.agencyCosts.filter(c => c.category === "SOFTWARE").reduce((s, c) => s + Number(c.value), 0);
  const n = Math.max(1, activeClients.length);

  return activeClients.map(c => {
    const mensalidade = Number(c.monthlyValue || 0);
    const custoEquipe = totalColaboradoresMes / n;
    const software = softwareTotal / n;
    const lucro = mensalidade - custoEquipe - software;
    const margem = mensalidade > 0 ? (lucro / mensalidade) * 100 : 0;
    return { client: c, mensalidade, custoEquipe, software, lucro, margem };
  }).sort((a, b) => b.lucro - a.lucro);
}

    deadline: document.getElementById("pf-deadline").value,
    status: document.getElementById("pf-status").value,

            <button class="task-move-btn" data-move-task="${t.id}" data-dir="1" type="button" ${idx === TASK_STATUS_ORDER.length - 1 ? "disabled" : ""}>Avançar &rarr;</button>
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="kanban-col">
        <div class="kanban-col-head">
          <span class="kanban-col-title">${TASK_STATUS_LABELS[status]}</span>
          <span class="kanban-col-count">${tasks.length}</span>
        </div>
        <div class="kanban-cards">${cards}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Tarefas</div>
        <div class="page-sub">Quadro kanban da operação</div>
      </div>
      <button class="btn-primary" id="btn-new-task" type="button">+ Nova tarefa</button>
    </div>
    <div class="kanban-wrap">${columns}</div>
  `;
}

      });

    });

      renderView("tarefas");
    });
  });
}

function renderCalendario() {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calendarMonthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = localToday();

  const eventsByDay = {};
  const addEvent = (day, label, cls) => {
    if (day < 1 || day > daysInMonth) return;
    if (!eventsByDay[day]) eventsByDay[day] = [];
    eventsByDay[day].push({ label, cls });
  };

  DATA.clients.forEach(c => { if (c.dueDay) addEvent(c.dueDay, "Venc. " + c.companyName, "ev-client"); });
  DATA.employeePayments.filter(p => p.competencia === monthKey && p.status !== "PAGO").forEach(p => {
    addEvent(parseDate(p.paymentDate || monthKey + "-05").getDate() || 5, "Pagto " + employeeNameOf(p), "ev-employee");
  });
  DATA.projects.filter(p => (p.deadline || "").slice(0, 7) === monthKey).forEach(p => {
    addEvent(parseDate(p.deadline).getDate(), "Prazo " + p.name, "ev-project");
  });
  DATA.tasks.filter(t => (t.deadline || "").slice(0, 7) === monthKey && t.status !== "CONCLUIDO").forEach(t => {
    addEvent(parseDate(t.deadline).getDate(), "Tarefa " + t.title, "ev-task");
  });

  DATA.leads.filter(l => (l.nextContactDate || "").slice(0, 7) === monthKey && l.stage !== "FECHADO" && l.stage !== "PERDIDO").forEach(l => {
    addEvent(parseDate(l.nextContactDate).getDate(), "Retorno " + l.name, "ev-employee");
  });
  DATA.contentPosts.filter(p => (p.publishDate || "").slice(0, 7) === monthKey && p.status !== "PUBLICADO").forEach(p => {
    addEvent(parseDate(p.publishDate).getDate(), "Post " + p.title, "ev-project");
  });

  const weekdays = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  let cells = "";
  for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthKey}-${String(d).padStart(2, "0")}`;
    const evs = (eventsByDay[d] || []).slice(0, 3).map(e => `<div class="cal-event ${e.cls}">${escapeHtml(e.label)}</div>`).join("");
    const extra = (eventsByDay[d] || []).length > 3 ? `<div style="font-size:10px;color:var(--text-500);">+${eventsByDay[d].length - 3} mais</div>` : "";
    cells += `<div class="cal-cell ${dateStr === todayStr ? "today" : ""} ${(eventsByDay[d] || []).length ? "has-events" : ""}"><div class="cal-day-num">${dateStr.slice(8)}<span class="cal-m">/${dateStr.slice(5, 7)}</span></div>${evs}${extra}</div>`;
  }

  const monthName = base.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Calendário</div>
        <div class="page-sub" style="text-transform:capitalize;">${monthName}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost btn-sm" id="cal-prev" type="button">&larr;</button>
        <button class="btn-ghost btn-sm" id="cal-today" type="button">Hoje</button>
        <button class="btn-ghost btn-sm" id="cal-next" type="button">&rarr;</button>
      </div>
    </div>
    <div class="cal-legend">
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--accent-light)"></span>Vencimento de cliente</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--warning)"></span>Pagamento de colaborador e retorno de lead</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--success)"></span>Prazo de projeto e post</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--danger)"></span>Prazo de tarefa</div>
    </div>
    <div class="cal-grid">
      ${weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join("")}
      ${cells}
    </div>
  `;
}

function attachCalendarioEvents() {
  document.getElementById("cal-prev").addEventListener("click", () => { calendarMonthOffset--; renderView("calendario"); });
  document.getElementById("cal-next").addEventListener("click", () => { calendarMonthOffset++; renderView("calendario"); });
  document.getElementById("cal-today").addEventListener("click", () => { calendarMonthOffset = 0; renderView("calendario"); });
}

// ===========================================================================
// ALERTAS (sino de notificacoes)
// ===========================================================================
function computeAlerts() {
  const alerts = [];
  const now = new Date();
  const in5days = new Date(now); in5days.setDate(in5days.getDate() + 5);
  const in30days = new Date(now); in30days.setDate(in30days.getDate() + 30);

  const overduePayments = DATA.payments.filter(p => p.status === "ATRASADO");
  if (overduePayments.length) alerts.push({ label: overduePayments.length + " mensalidade(s) em atraso", view: "mensalidades" });

  const opSnap = operationSnapshot();
  if (opSnap.leadsDue.length) alerts.push({ label: opSnap.leadsDue.length + " lead(s) para retornar hoje ou em atraso", view: "leads" });
  if (opSnap.postsApproval.length) alerts.push({ label: opSnap.postsApproval.length + " post(s) aguardando aprovação", view: "conteudo" });
  if (canView("colaboradores") && opSnap.capacity.overloaded.length) alerts.push({ label: opSnap.capacity.overloaded.length + " pessoa(s) acima do limite de clientes", view: "colaboradores" });
  const postsSoon = DATA.contentPosts.filter(p => p.publishDate && p.publishDate >= localToday() && parseDate(p.publishDate) <= in5days && !["APROVADO", "AGENDADO", "PUBLICADO"].includes(p.status));
  if (postsSoon.length) alerts.push({ label: postsSoon.length + " post(s) com data próxima ainda sem aprovação", view: "conteudo" });

  const budgetsDue = budgetsAwaitingReturn();
  if (budgetsDue.length) alerts.push({ label: budgetsDue.length + " orçamento(s) para cobrar retorno", view: "orcamentos" });

  const delinquent = DATA.clients.filter(c => c.status === "INADIMPLENTE");
  if (delinquent.length) alerts.push({ label: delinquent.length + " cliente(s) inadimplente(s)", view: "mensalidades" });

  DATA.clients.filter(c => c.status === "ATIVO" && c.dueDay).forEach(c => {
    const dueThisMonth = parseDate(dueDateFor(monthLabelNow(), c.dueDay));
    if (dueThisMonth >= parseDate(localToday()) && dueThisMonth <= in5days) {
      alerts.push({ label: "Mensalidade de " + c.companyName + " vence dia " + c.dueDay, view: "mensalidades" });
    }
  });

  const pendentesColab = DATA.employeePayments.filter(p => p.competencia === monthLabelNow() && p.status !== "PAGO");
  if (pendentesColab.length) alerts.push({ label: pendentesColab.length + " pagamento(s) de colaborador pendente(s) este mês", view: "colaboradores" });

  const overdueExpenses = DATA.expenses.filter(e => !e.paid && e.date < localToday());
  if (overdueExpenses.length) alerts.push({ label: overdueExpenses.length + " despesa(s) vencida(s) não paga(s)", view: "financeiro" });

  DATA.projects.filter(p => p.status !== "CONCLUIDO" && p.status !== "CANCELADO" && p.deadline).forEach(p => {
    const d = parseDate(p.deadline);
    if (d >= parseDate(localToday()) && d <= in5days) alerts.push({ label: "Projeto \"" + p.name + "\" com prazo próximo", view: "projetos" });
  });

  DATA.contracts.filter(c => c.status === "ATIVO" && c.endDate).forEach(c => {
    const d = parseDate(c.endDate);
    if (d >= parseDate(localToday()) && d <= in30days) {
      const client = DATA.clients.find(cl => cl.id === c.clientId);
      alerts.push({ label: "Contrato de " + (client ? client.companyName : "-") + " vence em breve", view: "contratos" });
    }
  });

  return alerts;
}

function renderBell() {
  if (!DATA) return;
  const alerts = computeAlerts();
  const badge = document.getElementById("bell-badge");
  if (alerts.length) { badge.style.display = "block"; badge.textContent = alerts.length; }
  else { badge.style.display = "none"; }

  const dropdown = document.getElementById("bell-dropdown");
  dropdown.innerHTML = `
    <div class="panel" style="padding:14px;max-height:340px;overflow-y:auto;">
      <div style="font-size:12.5px;font-weight:600;margin-bottom:10px;">Alertas</div>
      ${alerts.length ? alerts.map(a => `<div class="row-link" data-alert-goto="${a.view}" style="display:block;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--bg-800);">${escapeHtml(a.label)}</div>`).join("") : '<p style="font-size:12.5px;color:var(--text-500);">Nenhum alerta no momento.</p>'}
    </div>
  `;
  dropdown.querySelectorAll("[data-alert-goto]").forEach(el => {
    el.addEventListener("click", () => { notificationsOpen = false; dropdown.style.display = "none"; renderView(el.dataset.alertGoto); });
  });
}

let BELL_ATTACHED = false;
function attachBellEvents() {
  if (BELL_ATTACHED) return;
  BELL_ATTACHED = true;
  document.getElementById("bell-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    notificationsOpen = !notificationsOpen;
    document.getElementById("bell-dropdown").style.display = notificationsOpen ? "block" : "none";
  });
  document.addEventListener("click", () => {
    if (notificationsOpen) { notificationsOpen = false; document.getElementById("bell-dropdown").style.display = "none"; }
  });
}

function readLeadForm() {
  const v = (id) => document.getElementById(id).value.trim();
  return {
    name: v("lf-name"), company: v("lf-company"), whatsapp: v("lf-whatsapp"), email: v("lf-email"), instagram: v("lf-instagram"),
    niche: v("lf-niche"), region: v("lf-region"), desiredService: v("lf-desiredService"),
    estimatedValue: parseFloat(v("lf-estimatedValue")) || null, origin: v("lf-origin"),
    responsibleId: v("lf-responsibleId") || null, nextAction: v("lf-nextAction"), nextContactDate: v("lf-nextContactDate") || null, notes: v("lf-notes"),
  };
}

function leadNextLine(l) {
  if (!l.nextAction && !l.nextContactDate) return "";
  const late = l.nextContactDate && l.nextContactDate < localToday();
  const parts = [l.nextAction, l.nextContactDate ? fmtDate(l.nextContactDate) : ""].filter(Boolean).map(escapeHtml).join(" &middot; ");
  return `<div class="next-action ${late ? "late" : ""}">${late ? "Atrasado: " : "Próxima: "}${parts}</div>`;
}

function renderLeads() {
  const today = localToday();
  const visible = DATA.leads.filter(l => !leadNicheFilter || l.niche === leadNicheFilter);
  const open = (l) => l.stage !== "FECHADO" && l.stage !== "PERDIDO";
  const columns = LEAD_STAGE_ORDER.map(stage => {
    const leads = visible.filter(l => l.stage === stage);
    const cards = leads.map(l => {
      const resp = DATA.employees.find(e => e.id === l.responsibleId);
      const idx = LEAD_STAGE_ORDER.indexOf(l.stage);
      const wa = whatsappUrl(l.whatsapp);
      const ig = (l.instagram || "").replace(/^@/, "").replace(/[^\w.]/g, "");
      return `
        <div class="panel task-card">
          <div class="task-title"><button class="text-btn" data-open-lead="${l.id}" type="button">${escapeHtml(l.name)}</button></div>
          <div class="task-meta-row"><span>${escapeHtml(l.company || "-")}</span><span>${l.estimatedValue ? fmtBRL(l.estimatedValue) : ""}</span></div>
          <div class="task-meta-row" style="margin-bottom:0;"><span>${escapeHtml(l.niche || l.desiredService || "-")}</span><span>${escapeHtml(resp ? resp.name : "")}</span></div>
          ${leadNextLine(l)}
          ${wa || ig ? `<div class="card-links">${wa ? `<a href="${escapeHtml(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}${ig ? `<a href="https://instagram.com/${escapeHtml(ig)}" target="_blank" rel="noopener">Instagram</a>` : ""}</div>` : ""}
          <div class="task-move-row">
            <button class="task-move-btn" data-move-lead="${l.id}" data-dir="-1" type="button" ${idx === 0 ? "disabled" : ""} aria-label="Etapa anterior">&larr;</button>
            ${open(l) ? `<button class="task-move-btn" data-lead-convert="${l.id}" type="button" style="color:var(--success);">Converter</button>` : ""}
            <button class="task-move-btn" data-move-lead="${l.id}" data-dir="1" type="button" ${idx === LEAD_STAGE_ORDER.length - 1 ? "disabled" : ""} aria-label="Próxima etapa">&rarr;</button>
          </div>
        </div>
      `;
    }).join("");
    return `
      <div class="kanban-col">
        <div class="kanban-col-head"><span class="kanban-col-title">${LEAD_STAGE_LABELS[stage]}</span><span class="kanban-col-count">${leads.length}</span></div>
        <div class="kanban-cards">${cards}</div>
      </div>
    `;
  }).join("");

  const due = visible.filter(l => open(l) && l.nextContactDate && l.nextContactDate <= today)
    .sort((a, b) => a.nextContactDate.localeCompare(b.nextContactDate));
  const dueRows = due.map(l => `
    <div class="followup-row">
      <div class="grow"><button class="text-btn" data-open-lead="${l.id}" type="button">${escapeHtml(l.company || l.name)}</button>
        <div style="font-size:12px;color:var(--text-400);margin-top:2px;">${escapeHtml(l.nextAction || "Sem ação definida")}${l.region ? " &middot; " + escapeHtml(l.region) : ""}</div></div>
      <span class="badge ${l.nextContactDate < today ? "badge-red" : "badge-yellow"}">${l.nextContactDate < today ? fmtDate(l.nextContactDate) : "Hoje"}</span>
    </div>
  `).join("");

  const nicheCount = {};
  DATA.leads.filter(l => l.niche && open(l)).forEach(l => { nicheCount[l.niche] = (nicheCount[l.niche] || 0) + 1; });
  const nicheChips = Object.keys(nicheCount).sort().map(n => `<button class="filter-chip ${leadNicheFilter === n ? "active" : ""}" data-lead-niche="${escapeHtml(n)}" type="button">${escapeHtml(n)} (${nicheCount[n]})</button>`).join("");

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Leads</div>
        <div class="page-sub">Funil comercial do primeiro contato até o fechamento</div>
      </div>
      <button class="btn-primary" id="btn-new-lead" type="button">+ Novo lead</button>
    </div>
    ${nicheChips ? `<div class="toolbar"><button class="filter-chip ${leadNicheFilter ? "" : "active"}" data-lead-niche="" type="button">Todos os nichos</button>${nicheChips}</div>` : ""}
    ${due.length ? `<div class="panel followup-panel"><div class="section-label" style="margin-top:0;">Retornar hoje (${due.length})</div>${dueRows}</div>` : ""}
    <div class="kanban-wrap">${columns}</div>
  `;
}

function openLeadModal(lead) {
  const isNew = !lead;
  const history = lead ? [...(lead.contactHistory || [])].reverse() : [];
  const historyHtml = isNew ? "" : `
    <div class="section-label">Registrar contato</div>
    <div class="form-grid">
      <div class="field"><label>Tipo</label><select id="lc-type">${LEAD_CONTACT_TYPES.map(t => `<option>${t}</option>`).join("")}</select></div>
      <div class="field"><label>Data</label><input type="date" id="lc-date" value="${localToday()}" /></div>
      <div class="field full"><label>O que aconteceu</label><textarea id="lc-note"></textarea></div>
    </div>
    <button class="btn-ghost btn-sm" id="lc-add" type="button">Registrar contato</button>
    <div class="history-list">${history.map(h => `<div class="history-item"><strong>${escapeHtml(h.type)}</strong> &middot; ${fmtDate(h.date)}${h.by ? " &middot; " + escapeHtml(h.by) : ""}<br>${escapeHtml(h.note || "")}</div>`).join("") || `<div class="history-item">Nenhum contato registrado ainda.</div>`}</div>
  `;
  openModal(isNew ? "Novo lead" : "Lead: " + (lead.name || ""), leadFormHtml(lead) + historyHtml, `
    ${isNew ? "" : `<button class="btn-danger-outline" id="lead-delete" type="button" style="margin-right:auto;">Excluir</button>`}
    <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
    <button class="btn-primary" id="modal-save" type="button">Salvar lead</button>
  `);
  document.getElementById("modal-title").textContent = isNew ? "Novo lead" : "Lead: " + lead.name;
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", async () => {
    const values = readLeadForm();
    if (!values.name) { showToast("Informe o nome do lead."); return; }
    if (isNew) DATA.leads.push({ id: uid(), ...values, stage: "NOVO_LEAD", contactHistory: [], convertedClientId: null, isDemo: false });
    else Object.assign(lead, values);
    await saveData();
    closeModal();
    showToast(isNew ? "Lead cadastrado." : "Lead atualizado.");
    renderView("leads");
  });
  if (isNew) return;
  document.getElementById("lc-add").addEventListener("click", async () => {
    const note = document.getElementById("lc-note").value.trim();
    if (!note) { showToast("Descreva o contato."); return; }
    Object.assign(lead, readLeadForm());
    lead.contactHistory = [...(lead.contactHistory || []), { type: document.getElementById("lc-type").value, date: document.getElementById("lc-date").value || localToday(), note, by: CURRENT_USER_EMAIL }];
    if (lead.stage === "NOVO_LEAD") lead.stage = "CONTATO_REALIZADO";
    await saveData();
    showToast("Contato registrado.");
    renderView("leads");
    openLeadModal(lead);
  });
  document.getElementById("lead-delete").addEventListener("click", async () => {
    if (!window.confirm("Excluir o lead \"" + lead.name + "\"? Essa ação não pode ser desfeita.")) return;
    DATA.leads = DATA.leads.filter(l => l.id !== lead.id);
    logAudit("excluiu", "Lead", lead.id, "Lead " + lead.name + " excluído");
    await saveData();
    closeModal();
    showToast("Lead excluído.");
    renderView("leads");
  });
}

function attachLeadsEvents() {
  document.getElementById("btn-new-lead").addEventListener("click", () => openLeadModal(null));
  document.querySelectorAll("[data-open-lead]").forEach(btn => {

      };

      await saveData();
      await syncRecurringCharges();

      renderView("leads");
    });

}

function postFormHtml(post, presetDate) {
  const p = post || {};
  const val = (v) => escapeHtml(v == null ? "" : v);
  const clientOptions = DATA.clients.map(c => `<option value="${c.id}" ${(p.clientId || contentClientFilter) === c.id ? "selected" : ""}>${escapeHtml(c.companyName)}</option>`).join("");
  const mine = myEmployeeId();
  const selectedResp = p.responsibleId || (isCollaborator() ? mine : "");
  const respOptions = DATA.employees.map(e => `<option value="${e.id}" ${selectedResp === e.id ? "selected" : ""}>${escapeHtml(e.name)}</option>`).join("");
  const opt = (list, cur) => list.map(x => `<option ${cur === x ? "selected" : ""}>${x}</option>`).join("");
  return `
    <div class="form-grid">
      <div class="field full"><label>Título *</label><input type="text" id="pf2-title" value="${val(p.title)}" /></div>
      <div class="field"><label>Cliente *</label><select id="pf2-clientId"><option value="">--</option>${clientOptions}</select></div>
      <div class="field"><label>Data de publicação</label><input type="date" id="pf2-publishDate" value="${val(p.publishDate || presetDate)}" /></div>
      <div class="field"><label>Formato</label><select id="pf2-format">${opt(POST_FORMATS, p.format)}</select></div>
      <div class="field"><label>Canal</label><select id="pf2-channel">${opt(POST_CHANNELS, p.channel)}</select></div>
      <div class="field"><label>Status</label><select id="pf2-status">${POST_STATUS_ORDER.map(s => `<option value="${s}" ${(p.status || "IDEIA") === s ? "selected" : ""}>${POST_STATUS[s].label}</option>`).join("")}</select></div>
      <div class="field"><label>Responsável</label><select id="pf2-responsibleId" ${isCollaborator() ? "disabled" : ""}><option value="">--</option>${respOptions}</select></div>
      <div class="field full"><label>Legenda</label><textarea id="pf2-caption">${val(p.caption)}</textarea></div>
      <div class="field full"><label>Link da arte ou do vídeo</label><input type="url" id="pf2-mediaUrl" placeholder="https://..." value="${val(p.mediaUrl)}" /></div>
      <div class="field full"><label>Observações</label><textarea id="pf2-notes">${val(p.notes)}</textarea></div>
    </div>
  `;
}

function openPostModal(post, presetDate) {
  const isNew = !post;
  const link = post && safeUrl(post.mediaUrl);
  openModal(isNew ? "Novo post" : "Editar post", postFormHtml(post, presetDate), `
    ${!isNew && !isCollaborator() ? `<button class="btn-danger-outline" id="post-delete" type="button" style="margin-right:auto;">Excluir</button>` : ""}
    ${link ? `<a class="btn-ghost" href="${escapeHtml(link)}" target="_blank" rel="noopener">Abrir arte</a>` : ""}
    <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
    <button class="btn-primary" id="modal-save" type="button">Salvar post</button>
  `);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", async () => {
    const v = (id) => document.getElementById(id).value.trim();
    const values = {
      title: v("pf2-title"), clientId: v("pf2-clientId") || null, publishDate: v("pf2-publishDate") || null, format: v("pf2-format"),
      channel: v("pf2-channel"), status: v("pf2-status"), responsibleId: v("pf2-responsibleId") || null,
      caption: v("pf2-caption"), mediaUrl: v("pf2-mediaUrl"), notes: v("pf2-notes"),
    };
    if (!values.title) { showToast("Informe o título do post."); return; }
    if (!values.clientId) { showToast("Escolha o cliente."); return; }
    if (isCollaborator() && !values.responsibleId) { showToast("Seu e-mail não está ligado a um colaborador. Fale com o administrador."); return; }
    if (values.mediaUrl && !safeUrl(values.mediaUrl)) { showToast("O link precisa começar com https://"); return; }
    if (isNew) DATA.contentPosts.push({ id: uid(), ...values, isDemo: false });
    else Object.assign(post, values);
    await saveData();
    closeModal();
    showToast(isNew ? "Post criado." : "Post atualizado.");
    renderView("conteudo");
  });
  const del = document.getElementById("post-delete");
  if (del) del.addEventListener("click", async () => {
    if (!window.confirm("Excluir o post \"" + post.title + "\"? Essa ação não pode ser desfeita.")) return;
    DATA.contentPosts = DATA.contentPosts.filter(p => p.id !== post.id);
    logAudit("excluiu", "Post", post.id, post.title + " excluído");
    await saveData();
    closeModal();
    showToast("Post excluído.");
    renderView("conteudo");
  });
}

function renderConteudo() {
  const posts = DATA.contentPosts.filter(p => !contentClientFilter || p.clientId === contentClientFilter);
  const clientName = (id) => (DATA.clients.find(c => c.id === id) || {}).companyName || "-";
  const respName = (id) => (DATA.employees.find(e => e.id === id) || {}).name || "Sem responsável";

  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + contentMonthOffset);
  const year = base.getFullYear(); const month = base.getMonth();
  const monthKey = year + "-" + pad2(month + 1);

  let body = "";
  if (contentMode === "calendario") {
    const firstWeekday = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();
    const today = localToday();
    let cells = "";
    for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= days; d++) {
      const dateStr = monthKey + "-" + pad2(d);
      const dayPosts = posts.filter(p => p.publishDate === dateStr);
      const chips = dayPosts.map(p => `<button class="post-chip ${POST_STATUS[p.status] ? POST_STATUS[p.status].chip : ""}" data-open-post="${p.id}" type="button" title="${escapeHtml(clientName(p.clientId) + ": " + p.title)}">${contentClientFilter ? "" : escapeHtml(clientName(p.clientId)) + ": "}${escapeHtml(p.title)}</button>`).join("");
      cells += `<div class="cal-cell ${dateStr === today ? "today" : ""} ${dayPosts.length ? "has-events" : ""}"><div class="cal-day-num"><button class="cal-day-add" data-new-post-date="${dateStr}" type="button" aria-label="Novo post em ${pad2(d)}/${pad2(month + 1)}">${pad2(d)}<span class="cal-m">/${pad2(month + 1)}</span></button></div>${chips}</div>`;
    }
    const noDate = posts.filter(p => !p.publishDate);
    const monthCount = posts.filter(p => (p.publishDate || "").slice(0, 7) === monthKey).length;
    body = `
      <div class="toolbar">
        <button class="btn-ghost btn-sm" id="ct-prev" type="button" aria-label="Mês anterior">&larr;</button>
        <button class="btn-ghost btn-sm" id="ct-today" type="button">Hoje</button>
        <button class="btn-ghost btn-sm" id="ct-next" type="button" aria-label="Próximo mês">&rarr;</button>
        <span style="font-size:13px;color:var(--text-300);">${(m => m[0].toUpperCase() + m.slice(1))(fmtMonth(monthKey))} &middot; ${monthCount} post(s)</span>
      </div>
      <div class="cal-grid">
        ${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(w => `<div class="cal-weekday">${w}</div>`).join("")}
        ${cells}
      </div>
      ${monthCount ? "" : `<p style="font-size:13px;color:var(--text-400);margin-top:12px;">Nenhum post com data neste mês. Toque em + Novo post para começar.</p>`}
      ${noDate.length ? `<div class="panel followup-panel" style="margin-top:16px;"><div class="section-label" style="margin-top:0;">Sem data (${noDate.length})</div>${noDate.map(p => `<div class="followup-row"><div class="grow"><button class="text-btn" data-open-post="${p.id}" type="button">${escapeHtml(p.title)}</button> <span style="font-size:12px;color:var(--text-400);">${escapeHtml(clientName(p.clientId))}</span></div></div>`).join("")}</div>` : ""}
    `;
  } else {
    body = `<div class="kanban-wrap">${POST_STATUS_ORDER.map(status => {
      const list = posts.filter(p => p.status === status).sort((a, b) => (a.publishDate || "9").localeCompare(b.publishDate || "9"));
      const idx = POST_STATUS_ORDER.indexOf(status);
      return `
        <div class="kanban-col">
          <div class="kanban-col-head"><span class="kanban-col-title">${POST_STATUS[status].label}</span><span class="kanban-col-count">${list.length}</span></div>
          <div class="kanban-cards">${list.map(p => `
            <div class="panel task-card">
              <div class="task-title"><button class="text-btn" data-open-post="${p.id}" type="button">${escapeHtml(p.title)}</button></div>
              <div class="task-meta-row"><span>${escapeHtml(clientName(p.clientId))}</span><span>${escapeHtml(p.format || "")}</span></div>
              <div class="task-meta-row" style="margin-bottom:0;"><span>${escapeHtml(respName(p.responsibleId))}</span><span>${fmtDate(p.publishDate)}</span></div>
              <div class="task-move-row">
                <button class="task-move-btn" data-move-post="${p.id}" data-dir="-1" type="button" ${idx === 0 ? "disabled" : ""}>&larr; Voltar</button>
                <button class="task-move-btn" data-move-post="${p.id}" data-dir="1" type="button" ${idx === POST_STATUS_ORDER.length - 1 ? "disabled" : ""}>Avançar &rarr;</button>
              </div>
            </div>`).join("")}</div>
        </div>`;
    }).join("")}</div>`;
  }

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Conteúdo</div>
        <div class="page-sub">Produção, aprovação e publicação de posts por cliente</div>
      </div>
      <button class="btn-primary" id="btn-new-post" type="button">+ Novo post</button>
    </div>
    <div class="toolbar">
      <button class="filter-chip ${contentMode === "calendario" ? "active" : ""}" data-content-mode="calendario" type="button">Calendário</button>
      <button class="filter-chip ${contentMode === "quadro" ? "active" : ""}" data-content-mode="quadro" type="button">Quadro</button>
      <select id="content-client" aria-label="Filtrar por cliente" style="width:auto;max-width:240px;">
        <option value="">Todos os clientes</option>
        ${DATA.clients.map(c => `<option value="${c.id}" ${contentClientFilter === c.id ? "selected" : ""}>${escapeHtml(c.companyName)}</option>`).join("")}
      </select>
    </div>
    ${body}
  `;
}

function attachConteudoEvents() {
  document.getElementById("btn-new-post").addEventListener("click", () => openPostModal(null));
  document.getElementById("content-client").addEventListener("change", (e) => { contentClientFilter = e.target.value; renderView("conteudo"); });
  document.querySelectorAll("[data-content-mode]").forEach(b => b.addEventListener("click", () => { contentMode = b.dataset.contentMode; renderView("conteudo"); }));
  document.querySelectorAll("[data-open-post]").forEach(b => b.addEventListener("click", () => openPostModal(DATA.contentPosts.find(p => p.id === b.dataset.openPost))));
  document.querySelectorAll("[data-new-post-date]").forEach(b => b.addEventListener("click", () => openPostModal(null, b.dataset.newPostDate)));
  const nav = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("click", () => { fn(); renderView("conteudo"); }); };
  nav("ct-prev", () => contentMonthOffset--);
  nav("ct-next", () => contentMonthOffset++);
  nav("ct-today", () => { contentMonthOffset = 0; });
  document.querySelectorAll("[data-move-post]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const post = DATA.contentPosts.find(p => p.id === btn.dataset.movePost);
      const idx = POST_STATUS_ORDER.indexOf(post.status) + parseInt(btn.dataset.dir);
      if (idx < 0 || idx >= POST_STATUS_ORDER.length) return;
      post.status = POST_STATUS_ORDER[idx];
      await saveData();
      renderView("conteudo");
    });
  });
}

function renderContratos() {
  const now = new Date();
  const in30 = new Date(now); in30.setDate(in30.getDate() + 30);
  const rows = DATA.contracts.map(c => {
    const client = DATA.clients.find(cl => cl.id === c.clientId);
    const st = CONTRACT_STATUS_LABELS[c.status] || CONTRACT_STATUS_LABELS.ATIVO;
    const expiringSoon = c.status === "ATIVO" && c.endDate && parseDate(c.endDate) <= in30 && parseDate(c.endDate) >= parseDate(localToday());
    return `
      <tr>
        <td class="row-link" data-edit-contract="${c.id}">${escapeHtml(client ? client.companyName : "-")}</td>

        <td><span class="badge ${st.cls}"><span class="badge-dot" style="background:currentColor"></span>${st.label}</span></td>
