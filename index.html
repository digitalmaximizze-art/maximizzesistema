<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111318" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Maximizze" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Maximizze Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg-950: #08090B;
    --bg-900: #111318;
    --bg-850: #15171D;
    --bg-800: #1D2027;
    --bg-700: #292D36;
    --bg-600: #383D49;
    --text-100: #F2F2F0;
    --text-200: #CBD0D8;
    --text-300: #A8AFBC;
    --text-400: #767D8C;
    --text-500: #565C69;
    --accent: #C6FF3D;
    --accent-dark: #A9E21E;
    --accent-light: #C6FF3D;
    --accent-glow: rgba(198,255,61,0.11);
    --on-accent: #0E1300;
    --alert: #FF6B5E;
    --alert-glow: rgba(255,107,94,0.14);
    --brand-yellow: #FFC400;
    --brand-yellow-glow: rgba(255,196,0,0.16);
    --success: #22C55E;
    --success-glow: rgba(34,197,94,0.12);
    --warning: #FB923C;
    --warning-glow: rgba(251,146,60,0.16);
    --danger: #B91C1C;
    --danger-glow: rgba(185,28,28,0.16);
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Lexend", var(--font-ui);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    font-variant-numeric: tabular-nums;
    background: var(--bg-950);
    background-image: radial-gradient(circle at 15% 0%, var(--accent-glow), transparent 40%);
    color: var(--text-100);
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Login ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-box { width: 100%; max-width: 360px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-mark {
    width: 40px; height: 32px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-symbol { width: 100%; height: 100%; display: block; }
  .brand-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .panel {
    background: var(--bg-850);
    border: 1px solid var(--bg-700);
    border-radius: 10px;
  }
  .modal-box .panel {
    background: var(--bg-900);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6);
  }
  .login-box .panel { padding: 24px; }
  .login-box h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .login-box .sub { color: var(--text-400); font-size: 13px; margin-top: 4px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--text-300); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  input[type="email"], input[type="password"], input[type="text"], input[type="number"], input[type="date"],
  select, textarea {
    width: 100%; background: var(--bg-850); border: 1px solid var(--bg-700);
    border-radius: 6px; padding: 9px 11px; color: var(--text-100); font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .btn-primary {
    background: var(--accent); color: var(--on-accent); border: none; font-weight: 600;
    border-radius: 6px; padding: 9px 16px; font-size: 13.5px; font-weight: 500;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary.full { width: 100%; padding: 10px; font-size: 14px; }
  .btn-ghost {
    background: none; color: var(--text-300); border: 1px solid var(--bg-700);
    border-radius: 6px; padding: 8px 14px; font-size: 13px;
  }
  .btn-ghost:hover { background: var(--bg-800); color: var(--text-100); }
  .btn-danger-outline {
    background: none; color: var(--alert); border: 1px solid rgba(255,107,94,0.4);
    border-radius: 6px; padding: 8px 14px; font-size: 13px;
  }
  .btn-danger-outline:hover { background: var(--danger-glow); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
  .hint { margin-top: 16px; font-size: 12px; color: var(--text-500); text-align: center; }
  .error-msg { color: var(--alert); font-size: 13px; margin-bottom: 12px; display: none; }
  .login-box .error-msg { color: var(--alert); line-height: 1.45; }
  .ok-msg { color: var(--success); font-size: 13px; line-height: 1.45; margin-bottom: 12px; display: none; }
  .auth-panel { display: none; }
  .auth-panel.active { display: block; }
  .auth-link {
    display: block; width: 100%; min-height: 40px; margin-top: 10px; padding: 8px; background: none; border: 0;
    color: var(--text-300); font: inherit; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .auth-link:hover { color: var(--text-100); }

  /* ---------- App shell ---------- */
  #app-screen { display: none; height: 100vh; height: 100dvh; overflow: hidden; }
  .shell { display: flex; height: 100%; }

  .sidebar {
    width: 236px; flex-shrink: 0; background: var(--bg-900);
    border-right: 1px solid var(--bg-800); display: flex; flex-direction: column;
  }
  .sidebar-header { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 18px; flex-shrink: 0; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .nav-group { margin-bottom: 20px; }
  .nav-group-title { font-size: 11px; color: var(--text-500); padding: 0 8px; margin-bottom: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 6px; font-size: 13.5px; color: var(--text-300); margin-bottom: 1px;
  }
  .nav-item:hover { background: var(--bg-800); color: var(--text-100); }
  .nav-item.active { background: var(--accent-glow); color: var(--accent-light); }
  .nav-icon { width: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-500); }
  .nav-item.active .nav-icon { color: var(--accent-light); }

  .main-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 60px; flex-shrink: 0; border-bottom: 1px solid var(--bg-800);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(8,9,11,0.75); backdrop-filter: blur(6px);
  }
  .search-box {
    display: flex; align-items: center; gap: 8px; background: var(--bg-900);
    border: 1px solid var(--bg-800); border-radius: 6px; padding: 8px 12px;
    width: 100%; max-width: 340px; color: var(--text-500); font-size: 13px;
  }
  .user-chip { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--bg-800); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent-glow);
    color: var(--accent-light); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .logout-btn { background: none; border: none; color: var(--text-400); font-size: 12px; }
  .logout-btn:hover { color: var(--text-100); }

  .content { flex: 1; overflow-y: auto; padding: 26px 28px; }
  .page-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .page-sub { color: var(--text-400); font-size: 13.5px; margin-top: 3px; margin-bottom: 26px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

  .section-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-400); margin-bottom: 12px; margin-top: 26px;
  }
  .section-label::before { content: ""; width: 6px; height: 6px; background: var(--accent); border-radius: 1.5px; flex-shrink: 0; }
  .section-label:first-of-type { margin-top: 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .kpi-card { padding: 18px; }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .kpi-label { font-size: 13px; color: var(--text-400); }
  .kpi-icon {
    width: 26px; height: 26px; border-radius: 6px; background: var(--bg-800);
    display: flex; align-items: center; justify-content: center; color: var(--text-400);
  }
  .kpi-value { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
  .kpi-value.muted { font-size: 13px; font-weight: 400; color: var(--text-500); font-family: var(--font-ui); }

  .placeholder-view {
    height: 65vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
  }
  .placeholder-icon {
    width: 48px; height: 48px; border-radius: 10px; background: var(--accent-glow);
    color: var(--accent-light); display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 14px;
  }
  .placeholder-view h2 { font-size: 16px; font-weight: 600; }
  .placeholder-view p { color: var(--text-400); font-size: 13.5px; max-width: 340px; margin-top: 6px; }
  .placeholder-tag {
    margin-top: 14px; font-size: 11.5px; color: var(--text-400);
    border: 1px solid var(--bg-700); border-radius: 999px; padding: 4px 12px;
  }

  .info-panel { padding: 18px 20px; margin-top: 26px; }
  .info-panel h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
  .info-panel p { color: var(--text-400); font-size: 13.5px; line-height: 1.5; }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-500); padding: 10px 14px; border-bottom: 1px solid var(--bg-800);
    white-space: nowrap;
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--bg-800); color: var(--text-200); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg-850); }
  .row-link { color: var(--text-100); font-weight: 500; cursor: pointer; }
  .row-link:hover { color: var(--accent-light); }
  .cell-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty-row td { text-align: center; color: var(--text-500); padding: 30px; }

  /* ---------- Badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
    border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-green { background: var(--success-glow); color: var(--success); }
  .badge-yellow { background: var(--warning-glow); color: var(--warning); }
  .badge-red { background: var(--alert-glow); color: var(--alert); }
  .badge-gray { background: var(--bg-800); color: var(--text-400); }
  .badge-blue { background: var(--brand-yellow-glow); color: var(--brand-yellow); }

  /* ---------- Filters / toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip {
    background: var(--bg-900); border: 1px solid var(--bg-700); color: var(--text-400);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px;
  }
  .filter-chip.active { background: var(--accent-glow); border-color: transparent; color: var(--accent-light); }
  .toolbar-spacer { flex: 1; }

  /* ---------- Summary cards row ---------- */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }

  /* ---------- Client cards (grid) ---------- */
  .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .client-card { padding: 18px; cursor: pointer; transition: border-color .15s; }
  .card-delete-btn {
    background: none; border: none; color: var(--text-500); padding: 3px;
    border-radius: 5px; display: flex; flex-shrink: 0;
  }
  .card-delete-btn:hover { color: var(--alert); background: var(--danger-glow); }
  .client-card:hover { border-color: var(--accent); }
  .client-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .client-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; }
  .client-meta { font-size: 12.5px; color: var(--text-400); margin-top: 2px; }
  .client-value { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-top: 10px; }
  .client-value-label { font-size: 11.5px; color: var(--text-500); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--bg-800); margin-bottom: 20px; }
  .tab-btn {
    background: none; border: none; color: var(--text-400); font-size: 13.5px;
    padding: 10px 4px; margin-right: 20px; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--text-100); border-bottom-color: var(--accent); }

  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-400); font-size: 13px; margin-bottom: 14px; }
  .back-link:hover { color: var(--text-100); }

  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px 24px; }
  .kv-item .kv-label { font-size: 11.5px; color: var(--text-500); margin-bottom: 3px; }
  .kv-item .kv-value { font-size: 13.5px; color: var(--text-100); }

  .service-tag {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg-800);
    border: 1px solid var(--bg-700); border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
    margin: 0 6px 6px 0;
  }
  .service-tag button { background: none; border: none; color: var(--text-500); font-size: 12px; }
  .service-tag button:hover { color: var(--alert); }
  .service-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .service-pick-item {
    border: 1px solid var(--bg-700); border-radius: 6px; padding: 6px 10px; font-size: 12.5px;
    color: var(--text-300); cursor: pointer; background: var(--bg-850);
  }
  .service-pick-item.selected { border-color: var(--accent); color: var(--accent-light); background: var(--accent-glow); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-grid .field.full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

  /* ---------- Modal ---------- */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px;
    overflow-y: auto;
  }
  #modal-overlay.open { display: flex; }
  .modal-box { width: 100%; max-width: 520px; }
  .modal-box .panel { padding: 22px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -0.005em; }
  .modal-close { background: none; border: none; color: var(--text-400); font-size: 18px; line-height: 1; }
  .modal-close:hover { color: var(--text-100); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--bg-800); border: 1px solid var(--bg-700); color: var(--text-100);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 200;
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.6); display: none;
  }

  @media (max-width: 720px) {
    .sidebar {
      display: flex; position: fixed; inset: 0 auto 0 0; z-index: 90; width: min(280px, 84vw);
      transform: translateX(-100%); transition: transform .18s ease; background: var(--bg-900);
    }
    .sidebar.open { transform: none; }
    .content { padding: 18px 16px; }
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ---------- Menu no celular, busca, avisos ---------- */
  .menu-btn { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0; background: none; border: 0; color: var(--text-300); }
  #drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 80; }
  #drawer-overlay.open { display: block; }
  .search-wrap { position: relative; width: 100%; max-width: 340px; }
  .search-wrap .search-box { max-width: none; padding: 0 12px; }
  .search-wrap input { background: transparent; border: 0; outline: 0; padding: 8px 0; width: 100%; min-width: 0; color: var(--text-100); font: inherit; font-size: 13px; }
  .search-wrap .search-box:focus-within { border-color: var(--text-500); }
  .search-results { position: absolute; top: 44px; left: 0; width: 100%; min-width: 300px; z-index: 60; max-height: 60vh; overflow-y: auto; padding: 6px; display: none; background: var(--bg-900); }
  .search-results.open { display: block; }
  .search-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; color: var(--text-100); font: inherit; font-size: 13px; cursor: pointer; }
  .search-item:hover, .search-item:focus { background: var(--bg-800); outline: 0; }
  .search-item small { display: block; color: var(--text-400); font-size: 11.5px; margin-top: 2px; }
  .search-empty { padding: 10px; color: var(--text-400); font-size: 13px; }
  .sync-banner { display: none; align-items: center; gap: 10px; padding: 10px 22px; background: var(--alert-glow); border-bottom: 1px solid var(--alert); font-size: 13px; color: var(--text-100); }
  .sync-banner.open { display: flex; }
  .sync-banner span { flex: 1; min-width: 200px; line-height: 1.4; }
  #gate-screen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
  #gate-screen .panel { padding: 24px; max-width: 460px; width: 100%; }
  #gate-screen h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin-bottom: 8px; }
  #gate-screen p { color: var(--text-300); font-size: 13.5px; line-height: 1.5; margin-bottom: 16px; }
  .gate-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- Prospeccao, conteudo e capacidade ---------- */
  .followup-panel { padding: 14px 16px; margin-bottom: 16px; }
  .followup-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--bg-800); font-size: 13px; }
  .followup-row:first-of-type { border-top: 0; }
  .followup-row .grow { flex: 1; min-width: 160px; }
  .text-btn { background: none; border: 0; padding: 0; color: var(--text-100); font: inherit; font-weight: 500; text-align: left; cursor: pointer; }
  .text-btn:hover { text-decoration: underline; }
  .next-action { font-size: 12px; color: var(--text-300); margin-top: 8px; line-height: 1.4; }
  .next-action.late { color: var(--alert); }
  .card-links { display: flex; gap: 10px; margin-top: 8px; font-size: 12px; }
  .card-links a { color: var(--text-300); text-decoration: underline; text-underline-offset: 2px; }
  .history-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
  .history-item { font-size: 12.5px; color: var(--text-300); line-height: 1.45; padding-left: 10px; border-left: 2px solid var(--bg-700); }
  .history-item strong { color: var(--text-100); font-weight: 500; }
  .post-chip { display: block; width: 100%; text-align: left; border: 0; font: inherit; font-size: 10.5px; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; background: var(--bg-800); color: var(--text-100); }
  .post-chip.st-green { background: var(--success-glow); color: var(--success); }
  .post-chip.st-yellow { background: var(--warning-glow); color: var(--warning); }
  .post-chip.st-red { background: var(--alert-glow); color: var(--alert); }
  .cal-m { display: none; }
  .cal-day-add { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
  .cal-day-add:hover { color: var(--text-100); text-decoration: underline; }
  .cap-row { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 72px; align-items: center; gap: 12px; padding: 7px 0; font-size: 13px; }
  .cap-track { height: 8px; background: var(--bg-800); border-radius: 999px; overflow: hidden; }
  .cap-fill { height: 100%; background: var(--success); border-radius: 999px; }
  .cap-fill.full { background: var(--warning); }
  .cap-fill.over { background: var(--alert); }
  .cap-count { text-align: right; color: var(--text-300); font-size: 12.5px; }
  .team-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .team-checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text-300); }
  .team-checks input { width: auto; }

  /* ---------- Aplicativo no celular ---------- */
  .bottom-nav { display: none; }
  .install-btn { margin: 8px 14px 14px; min-height: 44px; flex-shrink: 0; background: var(--bg-800); border: 1px solid var(--bg-700); border-radius: 8px; color: var(--text-100); font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .install-btn[hidden] { display: none; }
  .budget-mobile-bar { display: none; }

  /* ---------- Orcamentos e tabela de precos ---------- */
  .budget-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .budget-preview { position: sticky; top: 0; padding: 18px; }
  .bp-title { font-size: 12px; color: var(--text-400); margin-bottom: 8px; }
  .bp-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 13px; color: var(--text-300); }
  .bp-row strong { color: var(--text-100); font-weight: 600; text-align: right; }
  .bp-block { border-top: 1px solid var(--bg-800); margin-top: 10px; padding-top: 10px; }
  .bp-warn { font-size: 12.5px; color: var(--warning); line-height: 1.45; margin-top: 8px; }
  .bp-error { font-size: 12.5px; color: var(--alert); line-height: 1.45; margin-top: 8px; font-weight: 500; }
  .bi-row { display: grid; grid-template-columns: minmax(130px, 1fr) 70px 110px 110px 105px 36px; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--bg-800); }
  .bi-row .field { margin: 0; }
  .bi-row label { font-size: 11.5px; margin-bottom: 4px; }
  .bi-remove { height: 38px; background: none; border: 1px solid var(--bg-700); border-radius: 6px; color: var(--text-300); cursor: pointer; }
  .bi-add { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .bi-add select { flex: 1; min-width: 200px; width: auto; }
  .scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .scenario-card { padding: 18px; }
  .scenario-card.chosen { border-color: var(--accent); }
  .scenario-price { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px; }
  .scenario-sub { font-size: 12.5px; color: var(--text-400); margin-bottom: 10px; }
  .detail-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .price-input { width: 112px; }
  .inline-note { font-size: 12px; color: var(--text-400); }

  /* ---------- Kanban ---------- */
  .kanban-wrap { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .kanban-col { flex: 0 0 250px; }
  .kanban-col-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .kanban-col-title { font-size: 12.5px; font-weight: 600; color: var(--text-300); }
  .kanban-col-count { font-size: 11px; color: var(--text-500); background: var(--bg-800); border-radius: 999px; padding: 1px 8px; }
  .kanban-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .task-card { padding: 12px; }
  .task-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .task-meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 11.5px; color: var(--text-500); }
  .task-move-row { display: flex; justify-content: space-between; gap: 6px; margin-top: 8px; }
  .task-move-btn { flex: 1; background: var(--bg-800); border: none; color: var(--text-400); border-radius: 5px; padding: 5px; font-size: 12px; }
  .task-move-btn:hover:not(:disabled) { background: var(--bg-700); color: var(--text-100); }
  .task-move-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---------- Calendar ---------- */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-weekday { text-align: center; font-size: 11px; color: var(--text-500); padding-bottom: 6px; }
  .cal-cell { min-height: 84px; background: var(--bg-900); border: 1px solid var(--bg-800); border-radius: 8px; padding: 6px; }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-day-num { font-size: 11.5px; color: var(--text-400); margin-bottom: 4px; }
  .cal-event { font-size: 10.5px; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-event.ev-client { background: var(--accent-glow); color: var(--accent-light); }
  .cal-event.ev-employee { background: var(--warning-glow); color: var(--warning); }
  .cal-event.ev-project { background: var(--success-glow); color: var(--success); }
  .cal-event.ev-task { background: var(--alert-glow); color: var(--alert); }
  .cal-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-400); }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  @media (max-width: 1100px) {
    .budget-layout { grid-template-columns: minmax(0, 1fr); }
    .budget-preview { position: static; }
  }
  /* Celular: precisa vir depois de todas as regras acima */
  @media (max-width: 720px) {
    html, body { overscroll-behavior: none; }
    input, select, textarea { font-size: 16px !important; }
    .menu-btn { display: none !important; }
    .topbar { height: auto; min-height: 56px; padding-top: env(safe-area-inset-top); flex-shrink: 0; }
    .sidebar { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

    .bottom-nav {
      display: flex; flex-shrink: 0; background: var(--bg-900); border-top: 1px solid var(--bg-800);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-tab {
      flex: 1; min-width: 0; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      background: none; border: 0; color: var(--text-400); font: inherit; font-size: 11px; font-weight: 500; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .bottom-tab.active { color: var(--accent-light); }
    .bottom-tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
    .toast { bottom: calc(70px + env(safe-area-inset-bottom)); left: 16px; right: 16px; transform: none; text-align: center; max-width: none; }

    .btn-primary, .btn-ghost, .btn-danger-outline { min-height: 44px; }
    .btn-sm { min-height: 40px; padding: 8px 12px; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; }
    .nav-item { min-height: 44px; }
    .page-head { gap: 12px; margin-bottom: 16px; }
    .client-card, .client-card * { min-width: 0; overflow-wrap: anywhere; }
    .card-delete-btn { flex-shrink: 0; min-width: 40px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .page-head > div:first-child { flex: 1 1 100%; }
    .page-head > .btn-primary { width: 100%; }
    .page-title { font-size: 21px; }
    .toolbar { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar, .tabs::-webkit-scrollbar { display: none; }
    .toolbar > * { flex-shrink: 0; }
    .filter-chip { min-height: 38px; white-space: nowrap; }
    .tabs { overflow-x: auto; scrollbar-width: none; }
    .tab-btn { flex-shrink: 0; min-height: 44px; white-space: nowrap; }

    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .kpi-card { padding: 12px; }
    .kpi-value { font-size: 17px; overflow-wrap: anywhere; }
    .kpi-label { font-size: 11.5px; }
    .scenario-grid { grid-template-columns: minmax(0, 1fr); }

    /* Tabelas viram cartoes */
    .table-wrap { overflow: visible; }
    .table-wrap table, .table-wrap tbody, .table-wrap tr, .table-wrap td { display: block; width: 100%; }
    .table-wrap thead { display: none; }
    .table-wrap tr { padding: 12px 14px; border-bottom: 1px solid var(--bg-800); }
    .table-wrap tr:last-child { border-bottom: 0; }
    .table-wrap td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 0; border: 0; text-align: right; font-size: 14px; min-height: 26px; overflow-wrap: anywhere; }
    .table-wrap td::before { content: attr(data-label); flex-shrink: 0; max-width: 45%; color: var(--text-400); font-size: 12.5px; text-align: left; }
    .table-wrap td:first-child { font-weight: 600; font-size: 15px; text-align: left; padding-bottom: 6px; }
    .table-wrap td:first-child::before { display: none; }
    .table-wrap td.cell-empty { display: none; }
    .table-wrap td.cell-actions { justify-content: flex-end; flex-wrap: wrap; padding-top: 8px; }
    .table-wrap td.cell-actions::before { display: none; }
    .table-wrap .empty-row td { justify-content: center; text-align: center; font-weight: 400; font-size: 13.5px; color: var(--text-400); }
    .table-wrap td .price-input { width: 130px; }

    /* Janelas sobem da parte de baixo */
    #modal-overlay { padding: 0 !important; align-items: flex-end !important; overflow: hidden !important; }
    .modal-box { max-width: none !important; }
    .modal-box .panel { border-radius: 16px 16px 0 0; max-height: 92dvh; overflow-y: auto; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); }
    .modal-close { min-width: 44px; min-height: 44px; margin: -10px -10px -10px 0; font-size: 22px; }
    .modal-footer { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); margin: 16px -16px calc(-16px - env(safe-area-inset-bottom)); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg-850, var(--bg-800)); border-top: 1px solid var(--bg-700); flex-wrap: wrap; }
    .modal-footer > * { flex: 1 1 40%; text-align: center; margin-right: 0 !important; }

    .kanban-wrap { scroll-snap-type: x mandatory; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
    .kanban-col { scroll-snap-align: start; flex: 0 0 84vw; max-width: 340px; }
    .task-move-btn { min-height: 40px; }

    .budget-mobile-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; bottom: -18px; z-index: 5;
      margin: 12px -16px -18px; padding: 10px 16px; background: var(--bg-900); border-top: 1px solid var(--bg-700); font-size: 13px; color: var(--text-300);
    }
    .budget-mobile-bar strong { display: block; color: var(--text-100); font-size: 14px; }
    .detail-actions > .btn-primary, .detail-actions > .btn-ghost { flex: 1 1 40%; }
    .menu-btn { display: flex; }
    .topbar { padding: 0 12px; gap: 8px; }
    .search-wrap { flex: 1; min-width: 0; max-width: none; }
    .user-chip { padding-left: 4px; border-left: 0; gap: 4px; }
    #user-email, .user-chip .avatar { display: none; }
    #bell-dropdown { position: fixed !important; top: 64px !important; left: 12px; right: 12px !important; width: auto !important; }
    .search-results { position: fixed; top: 58px; left: 12px; right: 12px; width: auto; }
    .page-head { flex-wrap: wrap; }
    .sync-banner { flex-wrap: wrap; padding: 10px 16px; }
    .kanban-col { flex-basis: 82vw; max-width: 300px; }
    .cal-grid { grid-template-columns: 1fr; }
    .cal-weekday, .cal-cell.empty, .cal-cell:not(.has-events):not(.today) { display: none; }
    .cal-cell { min-height: 0; }
    .cal-m { display: inline; }
    .bi-row { grid-template-columns: 1fr 1fr; }
    .bi-row .bi-name { grid-column: 1 / -1; }
    .bi-remove { grid-column: 1 / -1; }
    .detail-actions { width: 100%; }
    .price-input { width: 96px; }
    .summary-grid > *, .kv-grid > *, .kpi-grid > *, .main-col, .content { min-width: 0; }
    .content [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: 1fr !important; }
    .content [style*="minmax(240px"] { grid-template-columns: 1fr !important; }
    .cal-event, .post-chip { white-space: normal; font-size: 12px; padding: 5px 7px; }
    #modal-overlay { padding: 12px; }
  }
</style>
</head>
<body>

<!-- ============== LOGIN ============== -->
<div id="login-screen">
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark"><svg class="brand-symbol" viewBox="140 268 1041 784" aria-hidden="true"><path d="M237.9 268H537.9L450.7 430H150.7Z" fill="var(--accent)"/><path d="M561.9 268H1181L759.1 1052H140ZM659.3 430H909.3L661.7 890H411.7Z" fill="var(--text-100)" fill-rule="evenodd"/><path d="M870.3 890H1170.3L1083.1 1052H783.1Z" fill="var(--accent)"/></svg></div>
      <span class="brand-name">Maximizze</span>
    </div>
    <div class="panel auth-panel active" id="auth-login">
      <h1>Entrar</h1>
      <p class="sub">Acesse o painel interno da agência.</p>
      <p class="error-msg" id="login-error">E-mail ou senha inválidos.</p>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="voce@maximizze.com.br" />
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="********" />
      </div>
      <button class="btn-primary full" id="login-btn" type="button">Entrar</button>
      <button class="auth-link" id="forgot-link" type="button">Esqueci minha senha</button>
    </div>

    <!-- Pedir o link de redefinicao -->
    <div class="panel auth-panel" id="auth-forgot">
      <h1>Redefinir senha</h1>
      <p class="sub">Informe seu e-mail para receber o link de redefinição.</p>
      <p class="error-msg" id="forgot-error"></p>
      <p class="ok-msg" id="forgot-ok"></p>
      <div class="field">
        <label for="forgot-email">E-mail</label>
        <input type="email" id="forgot-email" placeholder="voce@maximizze.com.br" autocomplete="email" />
      </div>
      <button class="btn-primary full" id="forgot-btn" type="button">Enviar link</button>
      <button class="auth-link" id="forgot-back" type="button">Voltar para o login</button>
    </div>

    <!-- Definir a nova senha (aberto pelo link do e-mail) -->
    <div class="panel auth-panel" id="auth-reset">
      <h1>Criar nova senha</h1>
      <p class="sub">Escolha a nova senha de acesso ao painel.</p>
      <p class="error-msg" id="reset-error"></p>
      <div class="field">
        <label for="reset-password">Nova senha</label>
        <input type="password" id="reset-password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="reset-password2">Confirmar nova senha</label>
        <input type="password" id="reset-password2" placeholder="Repita a nova senha" autocomplete="new-password" />
      </div>
      <button class="btn-primary full" id="reset-btn" type="button">Salvar nova senha</button>
      <button class="auth-link" id="reset-cancel" type="button">Cancelar</button>
    </div>
  </div>
</div>

<!-- ============== AVISOS DE ACESSO ============== -->
<div id="gate-screen">
  <div class="panel">
    <h1 id="gate-title"></h1>
    <p id="gate-text"></p>
    <div class="gate-actions">
      <button class="btn-primary" id="gate-action" type="button"></button>
      <button class="btn-ghost" id="gate-logout" type="button">Sair</button>
    </div>
  </div>
</div>

<!-- ============== APP ============== -->
<div id="app-screen">
  <div id="drawer-overlay"></div>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-mark" style="width:30px;height:23px;"><svg class="brand-symbol" viewBox="140 268 1041 784" aria-hidden="true"><path d="M237.9 268H537.9L450.7 430H150.7Z" fill="var(--accent)"/><path d="M561.9 268H1181L759.1 1052H140ZM659.3 430H909.3L661.7 890H411.7Z" fill="var(--text-100)" fill-rule="evenodd"/><path d="M870.3 890H1170.3L1083.1 1052H783.1Z" fill="var(--accent)"/></svg></div>
        <span class="brand-name" style="font-size:14.5px;">Maximizze</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <button class="install-btn" id="install-app" type="button" hidden>Instalar aplicativo</button>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Abrir menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="search-wrap">
          <label class="search-box" for="global-search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="10.3" cy="10.3" r="6.3"/><line x1="15.2" y1="15.2" x2="20" y2="20"/></svg>
            <input type="search" id="global-search" placeholder="Buscar..." autocomplete="off" aria-label="Buscar no sistema" />
          </label>
          <div class="panel search-results" id="search-results"></div>
        </div>
        <div class="user-chip">
          <div style="position:relative;">
            <button id="bell-btn" type="button" style="background:none;border:none;color:var(--text-400);position:relative;padding:6px;display:flex;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 0-5 5v3.3c0 1-.4 2-1.2 2.7L4.5 16h15l-1.3-1c-.8-.7-1.2-1.7-1.2-2.7V8a5 5 0 0 0-5-5z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
              <span id="bell-badge" style="display:none;position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:10px;border-radius:999px;padding:0 4px;line-height:14px;"></span>
            </button>
            <div id="bell-dropdown" style="display:none;position:absolute;right:0;top:36px;width:300px;z-index:50;"></div>
          </div>
          <div class="avatar" id="user-avatar">A</div>
          <span id="user-email" style="font-size:13px;color:var(--text-300);"></span>
          <button class="logout-btn" id="logout-btn" type="button">Sair</button>
        </div>
      </header>
      <div class="sync-banner" id="sync-banner" role="alert">
        <span id="sync-banner-text"></span>
        <button class="btn-primary btn-sm" id="sync-retry" type="button">Tentar novamente</button>
        <button class="btn-ghost btn-sm" id="sync-reload" type="button">Recarregar dados</button>
      </div>
      <main class="content" id="content"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Menu principal"></nav>
    </div>
  </div>
</div>

<!-- ============== MODAL ============== -->
<div id="modal-overlay">
  <div class="modal-box">
    <div class="panel">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close" type="button">&times;</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===========================================================================
// Config de navegacao
// ===========================================================================
// ===========================================================================
// Icones (SVG inline, sem dependencia externa) — substitui emojis
// ===========================================================================
const ICONS = {
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5L6 20"/>',
  dashboard: '<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.6 2.7-6.2 6-6.2s6 2.6 6 6.2"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.8 13.7c2.6.5 4.2 2.6 4.2 6.3"/>',

// Todas as tabelas usam uuid como chave.
function uid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const x = [...b].map(v => v.toString(16).padStart(2, "0")).join("");
  return x.slice(0, 8) + "-" + x.slice(8, 12) + "-" + x.slice(12, 16) + "-" + x.slice(16, 20) + "-" + x.slice(20);
}
// Sempre o mesmo uuid para o mesmo texto: evita cobranca duplicada entre usuarios.
function stableUuid(text) {
  const seeds = [0x811c9dc5, 0x1b873593, 0xcc9e2d51, 0x9e3779b1];
  const parts = seeds.map((seed) => {
    let h = seed;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); h ^= h >>> 13; }
    return (h >>> 0).toString(16).padStart(8, "0");
  });
  const x = parts.join("");
  return x.slice(0, 8) + "-" + x.slice(8, 12) + "-5" + x.slice(13, 16) + "-a" + x.slice(17, 20) + "-" + x.slice(20);
}
function fmtBRL(v) { return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
// Datas sem horario ("2026-11-05") sao tratadas no fuso local. new Date("2026-11-05")
// assume UTC e, no Brasil, mostraria o dia anterior.
function parseDate(d) {
  const m = typeof d === "string" && d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(d);
}
function fmtDate(d) { if (!d) return "-"; return parseDate(d).toLocaleDateString("pt-BR"); }
function pad2(n) { return String(n).padStart(2, "0"); }
function localToday() { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function monthLabelNow() { return localToday().slice(0, 7); }
function monthLabelOffset(n) { const d = new Date(); const t = new Date(d.getFullYear(), d.getMonth() + n, 1); return t.getFullYear() + "-" + pad2(t.getMonth() + 1); }
function addMonths(ym, n) { const [y, m] = ym.split("-").map(Number); const t = new Date(y, m - 1 + n, 1); return t.getFullYear() + "-" + pad2(t.getMonth() + 1); }
function dueDateFor(ym, day) {
  const [y, m] = ym.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  return ym + "-" + pad2(Math.min(Number(day) || 10, last));
}
function fmtMonth(ym) { const [y, m] = ym.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" }); }
function normalizeText(s) { return (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function whatsappUrl(phone, text) {
  let digits = (phone || "").replace(/\D/g, "");
  if (!digits) return "";
  if (digits.length <= 11) digits = "55" + digits;
  return "https://wa.me/" + digits + (text ? "?text=" + encodeURIComponent(text) : "");
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
function escapeHtml(s) { return (s || "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function showToast(msg) {
  // Com gravacao pendente, a faixa de erro e quem fala: nada de "salvo com sucesso".
  if (SYNC_ERRORS.length) return;
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = "none"; }, 2600);
}

function downloadCSV(filename, headers, rows) {
  const escapeCsv = (v) => {
    const s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [headers.map(escapeCsv).join(","), ...rows.map(r => r.map(escapeCsv).join(","))].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ordem que respeita as chaves estrangeiras: INSERT segue esta ordem (pais antes
// dos filhos) e DELETE segue a ordem inversa (filhos antes dos pais).
const TABLE_ORDER = [
  ["services", "services"], ["employees", "employees"], ["clients", "clients"],
  ["agencyCosts", "agency_costs"], ["payments", "payments"],
  ["employeePayments", "employee_payments"], ["budgets", "budgets"],
  ["projects", "projects"], ["tasks", "tasks"], ["leads", "leads"], ["contentPosts", "content_posts"],
  ["contracts", "contracts"], ["expenses", "expenses"], ["revenues", "revenues"],
  ["auditLogs", "audit_logs"], ["appUsers", "app_users"],
];

function camelToSnake(s) { return s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase()); }
function snakeToCamel(s) { return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }
function rowToDb(obj) {
  const out = {};
  for (const k in obj) out[camelToSnake(k)] = obj[k];
  return out;
}
function rowFromDb(row) {
  const out = {};
  for (const k in row) out[snakeToCamel(k)] = row[k];
  return out;
}

let LAST_SYNCED = null;
let SYNC_ERRORS = [];
let SAVE_CHAIN = Promise.resolve(true);
const clone = (x) => JSON.parse(JSON.stringify(x));

async function fetchData() {
  const results = await Promise.all(
    TABLE_ORDER.map(([, table]) => sb.from(table).select("*").order("created_at", { ascending: true }))
  );
  const data = {};
  TABLE_ORDER.forEach(([key], i) => {
    const { data: rows, error } = results[i];
    if (error) throw new Error(key + ": " + error.message);
    data[key] = (rows || []).map(rowFromDb);
  });
  const settingsRes = await sb.from("settings").select("*").eq("id", "singleton").maybeSingle();
  if (settingsRes.error) throw new Error("settings: " + settingsRes.error.message);
  data.settings = settingsRes.data
    ? rowFromDb(settingsRes.data)
    : { id: "singleton", minMargin: 20, recommendedMargin: 40, premiumMargin: 60, agencyName: "Maximizze", currency: "BRL", clientsPerEmployee: 3, taxPercent: 0, feePercent: 0, proposalValidityDays: 15 };
  if (CURRENT_ROLE === "Colaborador") {
    // Colaborador recebe so nomes, para identificar cliente e responsavel nos cards.
    const { data: dir, error } = await sb.rpc("app_directory");
    if (error) throw new Error("directory: " + error.message);
    data.clients = dir.clients || [];
    const own = data.employees[0];
    data.employees = (dir.employees || []).map(e => (own && e.id === own.id) ? own : e);
  }
  data.auditLogs.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  data.isDemo = TABLE_ORDER.some(([key]) => (data[key] || []).some((x) => x.isDemo));
  return data;
}

async function loadData() {
  const data = await fetchData();
  LAST_SYNCED = clone(data);
  return data;
}

function friendlyDbError(error) {
  const code = (error && error.code) || "";
  if (code === "42501") return "seu perfil não tem permissão para esta alteração";
  if (code === "23503") return "existe outro registro ligado a este";
  if (code === "23505") return "este registro já existe";
  return (error && error.message) || "erro desconhecido";
}

function rowForWrite(row) {
  const out = rowToDb(row);
  delete out.updated_at; // quem define e o banco
  // Campo de data ou de vinculo deixado em branco vai como vazio de verdade.
  for (const k in out) if (out[k] === "" && /(_id|_date|^date|deadline|valid_until)$/.test(k)) out[k] = null;
  return out;
}

async function performSave() {
  const errors = [];
  let conflict = false;
  const plan = TABLE_ORDER.map(([key, table]) => {
    const current = DATA[key] || [];
    const synced = new Map((LAST_SYNCED[key] || []).map((x) => [x.id, x]));
    const currIds = new Set(current.map((x) => x.id));
    return {
      key, table, current, synced,
      toInsert: current.filter((x) => !synced.has(x.id)),
      toUpdate: current.filter((x) => synced.has(x.id) && JSON.stringify(synced.get(x.id)) !== JSON.stringify(x)),
      toDelete: [...synced.values()].filter((x) => !currIds.has(x.id)),
    };
  });

  for (const step of plan) {
    if (!step.toInsert.length) continue;
    const isLog = step.key === "auditLogs"; // perfis comuns gravam auditoria, mas nao a leem
    const query = sb.from(step.table).insert(step.toInsert.map(rowForWrite));
    const { data, error } = isLog ? await query : await query.select();
    if (error) { console.error("Erro ao inserir em " + step.table + ":", error); errors.push(friendlyDbError(error)); continue; }
    step.toInsert.forEach((row) => {
      const saved = isLog ? null : (data || []).find((r) => r.id === row.id);
      if (saved) Object.assign(row, rowFromDb(saved));
      step.synced.set(row.id, clone(row));
    });
  }

  for (const step of plan) {
    for (const row of step.toUpdate) {
      let query = sb.from(step.table).update(rowForWrite(row)).eq("id", row.id);
      if (row.updatedAt) query = query.eq("updated_at", row.updatedAt);
      const { data, error } = await query.select();
      if (error) { console.error("Erro ao atualizar " + step.table + ":", error); errors.push(friendlyDbError(error)); continue; }
      if (!data || !data.length) { conflict = true; continue; } // alguem alterou antes, ou sem permissao
      Object.assign(row, rowFromDb(data[0]));
      step.synced.set(row.id, clone(row));
    }
  }

  for (const step of [...plan].reverse()) {
    for (const row of step.toDelete) {
      if (step.key === "auditLogs" && !row.isDemo) { step.synced.delete(row.id); continue; }
      const { data, error } = await sb.from(step.table).delete().eq("id", row.id).select();
      if (error) { console.error("Erro ao excluir de " + step.table + ":", error); errors.push(friendlyDbError(error)); continue; }
      if (!data || !data.length) { conflict = true; continue; }
      step.synced.delete(row.id);
    }
  }

  plan.forEach((step) => { LAST_SYNCED[step.key] = [...step.synced.values()]; });

  if (DATA.settings && JSON.stringify(DATA.settings) !== JSON.stringify(LAST_SYNCED.settings)) {
    const { error } = await sb.from("settings").upsert({ ...rowToDb(DATA.settings), id: "singleton" });
    if (error) { console.error("Erro ao salvar settings:", error); errors.push(friendlyDbError(error)); }
    else LAST_SYNCED.settings = clone(DATA.settings);
  }

  if (conflict) errors.unshift("CONFLICT");
  setSyncErrors(errors);
  return errors.length === 0;
}

// Grava em fila: dois cliques seguidos nunca rodam ao mesmo tempo.
let SAVE_SEQ = 0;
function saveData() {
  SAVE_SEQ++;
  SAVE_CHAIN = SAVE_CHAIN.then(performSave, performSave).catch((e) => {
    console.error("Erro ao salvar no Supabase:", e);
    setSyncErrors(["sem conexão com o servidor"]);
    return false;
  });
  return SAVE_CHAIN;
}

function setSyncErrors(errors) {
  SYNC_ERRORS = errors;
  const banner = document.getElementById("sync-banner");
  banner.classList.toggle("open", errors.length > 0);
  if (!errors.length) return;
  const isConflict = errors[0] === "CONFLICT";
  const detail = errors.filter((e) => e !== "CONFLICT")[0];
  document.getElementById("sync-banner-text").textContent = isConflict
    ? "Alteração não salva: este registro foi modificado por outra pessoa ou não está mais disponível. Recarregue os dados e refaca a alteração."
    : "Alteração não salva: " + detail + ". Ela será perdida se você fechar o sistema.";
  document.getElementById("sync-retry").style.display = isConflict ? "none" : "";
}

async function reloadAll() {
  try {
    DATA = await loadData();
    setSyncErrors([]);
    await syncRecurringCharges();
    renderView(currentView);
  } catch (e) {
    console.error(e);
    showToast("Não foi possível recarregar. Verifique a conexão.");
  }
}

document.getElementById("sync-retry").addEventListener("click", async () => {
  await saveData();
  if (!SYNC_ERRORS.length) { showToast("Alterações salvas."); renderView(currentView); }
});

// ---------------------------------------------------------------------------
// Mensalidades automaticas: cria a cobranca de cada mes e marca as vencidas.
// ---------------------------------------------------------------------------
async function syncRecurringCharges() {
  if (!canFinance() || !DATA) return;
  const current = monthLabelNow();
  const today = localToday();
  const lastMonth = Number(today.slice(8)) >= 25 ? addMonths(current, 1) : current;
  const newRows = [];

  DATA.clients.filter(c => !c.isDemo && (c.status === "ATIVO" || c.status === "INADIMPLENTE") && Number(c.monthlyValue) > 0).forEach(c => {
    // Nunca cria meses passados: antes, a cobranca so existia quando o pagamento era
    // registrado, entao um mes vazio no historico nao significa divida.
    const months = new Set(DATA.payments.filter(p => p.clientId === c.id).map(p => p.competencia));
    const startMonth = (c.contractStartDate || "").slice(0, 7);
    for (let cursor = startMonth > current ? startMonth : current; cursor <= lastMonth; cursor = addMonths(cursor, 1)) {
      if (months.has(cursor)) continue;
      newRows.push({
        id: stableUuid("mensalidade:" + c.id + ":" + cursor), clientId: c.id, competencia: cursor, value: Number(c.monthlyValue),
        paidValue: null, dueDate: dueDateFor(cursor, c.dueDay), paymentDate: null,
        paymentMethod: c.paymentMethod || null, status: "PENDENTE", notes: "", isDemo: false,
      });
    }
  });

  let mustReload = false;
  if (newRows.length) {
    // O id fixo impede cobranca duplicada se duas pessoas abrirem o sistema juntas.
    const { data, error } = await sb.from("payments").upsert(newRows.map(rowForWrite), { onConflict: "id", ignoreDuplicates: true }).select();
    if (error) { console.error("Erro ao gerar mensalidades:", error); showToast("Não foi possível gerar as mensalidades do mês."); }
    else {
      (data || []).map(rowFromDb).forEach(row => { DATA.payments.push(row); LAST_SYNCED.payments.push(clone(row)); });
      if ((data || []).length !== newRows.length) mustReload = true;
    }
  }

  const overdue = DATA.payments.filter(p => p.status === "PENDENTE" && p.dueDate && p.dueDate < today);
  if (overdue.length) {
    const ids = overdue.map(p => p.id);
    const { data, error } = await sb.from("payments").update({ status: "ATRASADO" }).in("id", ids).eq("status", "PENDENTE").select();
    if (error) console.error("Erro ao marcar atrasos:", error);
    else {
      const byId = new Map(data.map(r => [r.id, rowFromDb(r)]));
      [DATA.payments, LAST_SYNCED.payments].forEach(list => list.forEach(p => { if (byId.has(p.id)) Object.assign(p, clone(byId.get(p.id))); }));
      if (data.length !== ids.length) mustReload = true;
    }
  }
  if (mustReload) DATA = await loadData();
}

// ---------------------------------------------------------------------------
// Atualizacao periodica: traz o que outras pessoas alteraram sem atrapalhar quem digita
// ---------------------------------------------------------------------------
let REFRESH_TIMER = null;
let REFRESHING = false;
const NO_REFRESH_VIEWS = new Set(["orcamento-form", "configuracoes", "custos", "precos"]);

async function refreshFromServer() {
  if (!DATA || REFRESHING || SYNC_ERRORS.length || document.hidden) return;
  if (document.getElementById("modal-overlay").classList.contains("open")) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (NO_REFRESH_VIEWS.has(currentView)) return;
  REFRESHING = true;
  try {
    await SAVE_CHAIN;
    const before = JSON.stringify(LAST_SYNCED);
    const seq = SAVE_SEQ;
    const fresh = await fetchData();
    // Se alguem comecou a editar ou salvar durante a busca, descarta a leitura.
    if (seq !== SAVE_SEQ || SYNC_ERRORS.length || document.getElementById("modal-overlay").classList.contains("open")) return;
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    DATA = fresh;
    LAST_SYNCED = clone(fresh);
    await syncRecurringCharges();
    if (JSON.stringify(LAST_SYNCED) !== before) {
      const content = document.getElementById("content");
      const top = content.scrollTop;
      await renderView(currentView);
      content.scrollTop = top;
    }
  } catch (e) {
    console.warn("Atualização automática falhou:", e);
  } finally { REFRESHING = false; }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshFromServer(); });

  if (error || !data.user) {

      errorEl.textContent = "E-mail ainda não confirmado. Confirme o usuário no Supabase (Authentication > Users) ou desative a exigência de confirmação.";

}

async function handleForgot() {
  const email = document.getElementById("forgot-email").value.trim();
  const btn = document.getElementById("forgot-btn");
  setAuthMsg("forgot-error", "");
  setAuthMsg("forgot-ok", "");
  if (!email) { setAuthMsg("forgot-error", "Informe seu e-mail."); return; }

  // O link volta para o endereco em que o sistema esta aberto. Esse endereco
  // precisa estar em Authentication > URL Configuration > Redirect URLs.
  const options = location.protocol.startsWith("http") ? { redirectTo: location.origin + location.pathname } : {};

  btn.disabled = true; btn.textContent = "Enviando...";
  const { error } = await sb.auth.resetPasswordForEmail(email, options);
  btn.disabled = false; btn.textContent = "Enviar link";

  if (error) {
    const limited = error.status === 429 || /rate limit|security purposes/i.test(error.message);
    setAuthMsg("forgot-error", limited
      ? "Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo."
      : "Erro do Supabase: " + error.message);
    return;
  }
  setAuthMsg("forgot-ok", "Se este e-mail tiver acesso ao painel, o link chegará em instantes. Confira também o spam.");
}

async function handleReset() {
  const password = document.getElementById("reset-password").value;
  const confirm = document.getElementById("reset-password2").value;
  const btn = document.getElementById("reset-btn");
  setAuthMsg("reset-error", "");
  if (password.length < 6) { setAuthMsg("reset-error", "A senha precisa ter pelo menos 6 caracteres."); return; }
  if (password !== confirm) { setAuthMsg("reset-error", "As senhas não são iguais."); return; }

  btn.disabled = true; btn.textContent = "Salvando...";
  const { data, error } = await sb.auth.updateUser({ password });
  btn.disabled = false; btn.textContent = "Salvar nova senha";

  if (error) {
    if (error.code === "same_password" || /different from the old/i.test(error.message)) {
      setAuthMsg("reset-error", "A nova senha precisa ser diferente da atual.");
    } else if (error.code === "weak_password") {
      setAuthMsg("reset-error", "Senha fraca. Use mais caracteres, misturando letras e números.");
    } else if (/session/i.test(error.message)) {
      setRecoveryFlag(false);
      openForgot("Sua sessão de redefinição expirou. Peça um novo link.");
    } else {
      setAuthMsg("reset-error", "Erro do Supabase: " + error.message);
    }
    return;
  }
  setRecoveryFlag(false);
  clearAuthUrl();
  document.getElementById("reset-password").value = "";
  document.getElementById("reset-password2").value = "";
  await enterApp(data.user.email);
  showToast("Senha alterada com sucesso.");
}

async function enterApp(email) {
  CURRENT_USER_EMAIL = email;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("gate-screen").style.display = "none";

  const retry = () => enterApp(email);
  const profile = await sb.from("app_users").select("role").eq("email", email.toLowerCase()).maybeSingle();
  if (profile.error) {
    const missing = profile.error.code === "PGRST205" || profile.error.code === "42P01" || /app_users/.test(profile.error.message || "");
    if (missing) {
      showGate("Falta atualizar o banco de dados", "Esta versão precisa do arquivo migracao-maximizze.sql. Rode esse arquivo no SQL Editor do Supabase e clique em Verificar de novo.", "Verificar de novo", retry);
    } else {
      showGate("Não foi possível carregar", "Verifique a conexão e tente de novo.", "Tentar de novo", retry);
    }
    return;
  }
  if (!profile.data) {
    showGate("Seu acesso ainda não foi liberado", "O e-mail " + email + " não tem um perfil no sistema. Peça ao administrador para adicionar você em Configurações.", "Verificar de novo", retry);
    return;
  }
  CURRENT_ROLE = profile.data.role;

  try {
    DATA = await loadData();
    await syncRecurringCharges();
  } catch (e) {
    console.error("Erro ao carregar dados:", e);
    DATA = null;
    showGate("Não foi possível carregar os dados", "Nada foi alterado. Verifique a conexão e tente de novo.", "Tentar de novo", retry);
    return;
  }

  document.getElementById("app-screen").style.display = "block";
  document.getElementById("user-email").textContent = email;
  document.getElementById("user-avatar").textContent = email.charAt(0).toUpperCase();
  currentView = homeView();
  renderSidebar();
  attachBellEvents();
  await renderView(currentView);
  startNavHistory();
  clearInterval(REFRESH_TIMER);
  REFRESH_TIMER = setInterval(refreshFromServer, 120000);
}

function searchEverything(term) {
  const q = normalizeText(term);
  const hit = (...fields) => fields.some(f => normalizeText(f).includes(q));
  const clientName = (id) => (DATA.clients.find(c => c.id === id) || {}).companyName || "";
  const out = [];
  const add = (view, label, meta, go) => { if (canView(view)) out.push({ label, meta, go }); };
  DATA.clients.filter(c => hit(c.companyName, c.contactName)).forEach(c => add("clientes", c.companyName, "Cliente", () => { currentClientId = c.id; clientDetailTab = "info"; renderView("cliente-detail"); }));
  DATA.leads.filter(l => hit(l.name, l.company, l.niche)).forEach(l => add("leads", l.name, "Lead" + (l.company ? " · " + l.company : ""), () => { renderView("leads"); openLeadModal(l); }));
  DATA.employees.filter(e => hit(e.name)).forEach(e => add("colaboradores", e.name, "Colaborador", () => { currentEmployeeId = e.id; employeeDetailTab = "info"; renderView("colaborador-detail"); }));
  DATA.projects.filter(p => hit(p.name)).forEach(p => add("projetos", p.name, "Projeto · " + clientName(p.clientId), () => renderView("projetos")));
  DATA.tasks.filter(t => hit(t.title)).forEach(t => add("tarefas", t.title, "Tarefa · " + clientName(t.clientId), () => renderView("tarefas")));
  DATA.contentPosts.filter(p => hit(p.title)).forEach(p => add("conteudo", p.title, "Post · " + clientName(p.clientId), () => { renderView("conteudo"); openPostModal(p); }));
  DATA.services.filter(s => hit(s.name, s.category)).forEach(s => add("precos", s.name, "Serviço · " + fmtBRL(s.basePrice), () => renderView("precos")));
  DATA.budgets.filter(b => hit(String(b.number), clientName(b.clientId), b.prospectName)).forEach(b => add("orcamentos", "Orçamento #" + b.number, clientName(b.clientId) || b.prospectName || "", () => { currentBudgetId = b.id; renderView("orcamento-detail"); }));
  DATA.contracts.filter(c => hit(c.servicesDescription, clientName(c.clientId))).forEach(c => add("contratos", "Contrato · " + clientName(c.clientId), c.servicesDescription || "", () => renderView("contratos")));
  return out.slice(0, 12);
}

(function attachSearch() {
  const input = document.getElementById("global-search");
  const box = document.getElementById("search-results");
  const close = () => box.classList.remove("open");
  let current = [];
  input.addEventListener("input", () => {
    const term = input.value.trim();
    if (term.length < 2 || !DATA) { close(); return; }
    current = searchEverything(term);
    box.innerHTML = current.length
      ? current.map((r, i) => `<button class="search-item" type="button" data-result="${i}">${escapeHtml(r.label)}<small>${escapeHtml(r.meta)}</small></button>`).join("")
      : `<div class="search-empty">Nada encontrado para "${escapeHtml(term)}".</div>`;
    box.classList.add("open");
  });
  const choose = (i) => { const r = current[i]; if (!r) return; input.value = ""; close(); r.go(); };
  box.addEventListener("click", (e) => { const b = e.target.closest("[data-result]"); if (b) choose(Number(b.dataset.result)); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { close(); input.blur(); }
    if (e.key === "Enter") { e.preventDefault(); choose(0); }
    if (e.key === "ArrowDown") { const f = box.querySelector(".search-item"); if (f) { e.preventDefault(); f.focus(); } }
  });
  box.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" && e.target.nextElementSibling) { e.preventDefault(); e.target.nextElementSibling.focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); (e.target.previousElementSibling || input).focus(); }
    if (e.key === "Escape") { close(); input.focus(); }
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search-wrap")) close(); });
})();

  if (!isAdmin()) remove("#btn-delete-client, [data-quick-delete-client]");
  if (!canFinance()) remove('.tab-btn[data-tab="financeiro"]');
  if (CURRENT_ROLE === "Financeiro") remove("#btn-new-client, #btn-new-employee, #btn-edit-employee, #btn-new-service, [data-edit-service], [data-delete-service]");
  if (CURRENT_ROLE === "Comercial") remove("#btn-new-employee, #btn-edit-employee");
  if (isCollaborator()) {
    remove("#btn-new-project, [data-delete-project], #btn-new-task, .col-profit");
    neuter("[data-edit-project]");
  }
}

// No celular, cada linha de tabela vira um cartao e usa o titulo da coluna como rotulo.
function labelTableCells() {
  document.querySelectorAll("#content table").forEach(table => {
    const heads = [...table.querySelectorAll("thead th")].map(th => th.textContent.trim());
    table.querySelectorAll("tbody tr").forEach(tr => {
      [...tr.children].forEach((td, i) => {
        if (heads[i] && !td.hasAttribute("colspan")) td.setAttribute("data-label", heads[i]);
        const clean = td.textContent.trim();
        if (!td.children.length && (clean === "" || clean === "-")) td.classList.add("cell-empty");
      });
    });
  });
}

// Botao voltar do celular: fecha janela ou menu e volta a tela anterior.
let NAV_FROM_HISTORY = false;
function navState() { return { mm: 1, view: currentView, clientId: currentClientId, employeeId: currentEmployeeId, budgetId: currentBudgetId }; }
function pushNavState() { try { history.pushState(navState(), ""); } catch (e) {} }
function startNavHistory() {
  try { history.replaceState({ mm: 1, base: true }, ""); history.pushState(navState(), ""); } catch (e) {}
}
window.addEventListener("popstate", (e) => {
  if (!DATA) return;
  const overlayOpen = document.getElementById("modal-overlay").classList.contains("open");
  const drawerOpen = document.querySelector(".sidebar").classList.contains("open");
  if (overlayOpen || drawerOpen) {
    closeModal(); toggleDrawer(false);
    pushNavState();
    return;
  }
  const s = e.state;
  if (!s || !s.mm) return;
  if (s.base) { try { history.back(); } catch (err) {} return; }
  currentClientId = s.clientId; currentEmployeeId = s.employeeId; currentBudgetId = s.budgetId;
  let target = s.view;
  if (target === "orcamento-form" && !budgetDraft) target = "orcamentos";
  NAV_FROM_HISTORY = true;
  renderView(target);
});

async function renderView(view) {
  if (!canView(navKeyFor(view))) view = homeView();
  const changedView = view !== currentView;
  await renderViewContent(view);
  if (changedView) document.getElementById("content").scrollTop = 0;
  applyRoleUi();
  labelTableCells();
  renderBottomNav();
  // No celular, o quadro abre na primeira coluna que tem itens.
  if (changedView && window.innerWidth <= 720) {
    const board = document.querySelector("#content .kanban-wrap");
    const first = board && [...board.querySelectorAll(".kanban-col")].find(col => col.querySelector(".task-card"));
    if (first) board.scrollLeft = first.offsetLeft - board.offsetLeft - 16;
  }
  if (changedView && !NAV_FROM_HISTORY) pushNavState();
  NAV_FROM_HISTORY = false;
}

function operationSnapshot() {
  const today = localToday();
  const leadsDue = DATA.leads.filter(l => l.nextContactDate && l.nextContactDate <= today && l.stage !== "FECHADO" && l.stage !== "PERDIDO");
  const postsApproval = DATA.contentPosts.filter(p => p.status === "APROVACAO");
  const lateTasks = DATA.tasks.filter(t => t.deadline && t.deadline < today && t.status !== "CONCLUIDO");
  return { leadsDue, postsApproval, lateTasks, capacity: employeeLoad() };
}

function renderDashboard() {
  const now = monthLabelNow();
  const monthPayments = DATA.payments.filter(p => p.competencia === now && p.status !== "CANCELADO");
  const received = (p) => (p.status === "PAGO" || p.status === "PARCIAL") ? Number(p.paidValue || p.value) : 0;

  const faturamentoPrevisto = monthPayments.reduce((s, p) => s + Number(p.value), 0);
  const faturamentoRecebido = monthPayments.reduce((s, p) => s + received(p), 0);
  const faturamentoAtraso = DATA.payments.filter(p => p.status === "ATRASADO").reduce((s, p) => s + Number(p.value), 0);
  const custosFixos = DATA.agencyCosts.reduce((s, c) => s + Number(c.value), 0);
  const colaboradoresMes = DATA.employeePayments.filter(p => p.competencia === now);
  const pagoColaboradores = colaboradoresMes.filter(p => p.status === "PAGO").reduce((s, p) => s + Number(p.value), 0);
  const previstoColaboradores = colaboradoresMes.reduce((s, p) => s + Number(p.value), 0);
  const inMonth = (r) => (r.date || "").slice(0, 7) === now;
  const outrasReceitas = DATA.revenues.filter(inMonth).reduce((s, r) => s + Number(r.value), 0);
  const despesas = DATA.expenses.filter(inMonth).reduce((s, e) => s + Number(e.value), 0);
  // Mesmo criterio do Financeiro geral: "realizado" e o saldo do mes.
  const lucroRealizado = computeFinanceiro("este_mes").saldo;
  const lucroEstimado = faturamentoPrevisto + outrasReceitas - custosFixos - previstoColaboradores - despesas;

  const clientesAtivos = DATA.clients.filter(c => c.status === "ATIVO").length;
  const clientesInadimplentes = DATA.clients.filter(c => c.status === "INADIMPLENTE").length;
  const orcamentosAbertos = DATA.budgets.filter(b => b.status === "RASCUNHO").length;
  const orcamentosAprovados = DATA.budgets.filter(b => b.status === "APROVADO").length;
  const op = operationSnapshot();

  const kpi = (label, value, iconKey, currency = true) => `
    <div class="panel kpi-card">
      <div class="kpi-top"><span class="kpi-label">${label}</span><span class="kpi-icon">${icon(iconKey, 14)}</span></div>
      <div class="kpi-value">${currency ? fmtBRL(value) : value}</div>
    </div>
  `;

  const seesTeam = CURRENT_ROLE !== "Comercial";
  return `
    <div class="page-title">Dashboard</div>
    <div class="page-sub">Visão geral da agência neste mês ${DATA.isDemo ? "&middot; dados demonstrativos" : ""}</div>

    ${canFinance() ? `
    <div class="section-label">Financeiro</div>
    <div class="kpi-grid">
      ${kpi("Faturamento previsto", faturamentoPrevisto, "dollar-sign")}
      ${kpi("Faturamento recebido", faturamentoRecebido, "trending-up")}
      ${kpi("Em atraso (todos os meses)", faturamentoAtraso, "alert-triangle")}
      ${kpi("Outras receitas", outrasReceitas, "trending-up")}
      ${kpi("Custos fixos", custosFixos, "trending-down")}
      ${kpi("Despesas avulsas", despesas, "trending-down")}
      ${kpi("Pago a colaboradores", pagoColaboradores, "credit-card")}
      ${kpi("Lucro estimado", lucroEstimado, "trending-up")}
      ${kpi("Lucro realizado", lucroRealizado, "trending-up")}
    </div>` : ""}

    <div class="section-label">Clientes e orçamentos</div>
    <div class="kpi-grid">
      ${kpi("Clientes ativos", clientesAtivos, "users", false)}
      ${kpi("Clientes inadimplentes", clientesInadimplentes, "user-x", false)}
      ${seesTeam ? kpi("Colaboradores", DATA.employees.length, "user", false) : ""}
      ${canView("orcamentos") ? kpi("Orçamentos em aberto", orcamentosAbertos, "clock", false) : ""}
      ${canView("orcamentos") ? kpi("Orçamentos aprovados", orcamentosAprovados, "check-circle", false) : ""}
    </div>

    <div class="section-label">Hoje</div>
    <div class="kpi-grid">
      ${canView("leads") ? kpi("Leads para retornar", op.leadsDue.length, "target", false) : ""}
      ${canView("conteudo") ? kpi("Posts em aprovação", op.postsApproval.length, "image", false) : ""}
      ${canView("tarefas") ? kpi("Tarefas atrasadas", op.lateTasks.length, "alert-triangle", false) : ""}
      ${seesTeam ? kpi("Vagas na equipe", op.capacity.freeSlots + " cliente(s)", "users", false) : ""}
    </div>
  `;
}

function deleteClientCascade(clientId) {
  const client = DATA.clients.find(c => c.id === clientId);
  if (!client) return;

  DATA.payments = DATA.payments.filter(p => p.clientId !== clientId);
  const removedProjectIds = new Set(DATA.projects.filter(p => p.clientId === clientId).map(p => p.id));
  DATA.projects = DATA.projects.filter(p => p.clientId !== clientId);
  DATA.contentPosts = DATA.contentPosts.filter(p => p.clientId !== clientId);
  DATA.tasks = DATA.tasks.filter(t => t.clientId !== clientId && !removedProjectIds.has(t.projectId));
  DATA.contracts = DATA.contracts.filter(c => c.clientId !== clientId);
  DATA.budgets = DATA.budgets.filter(b => b.clientId !== clientId);
  DATA.revenues = DATA.revenues.filter(r => r.clientId !== clientId);
  DATA.leads.forEach(l => { if (l.convertedClientId === clientId) l.convertedClientId = null; });
  DATA.clients = DATA.clients.filter(c => c.id !== clientId);

  logAudit("excluiu", "Cliente", clientId, client.companyName + " excluído (com mensalidades, projetos, tarefas, contratos, orçamentos e receitas vinculados)");
}

function clientPaymentSummary(clientId) {
  const payments = DATA.payments.filter(p => p.clientId === clientId).sort((a, b) => b.competencia.localeCompare(a.competencia));
  const last = payments.find(p => p.status === "PAGO");
  // a mais antiga em aberto: o pagamento quita primeiro o que venceu antes
  const next = [...payments].reverse().find(p => p.status !== "PAGO" && p.status !== "CANCELADO");
  return { payments, last, next };
}
