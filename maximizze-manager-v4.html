<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maximizze Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg-950: #08090B;
    --bg-900: #111318;
    --bg-850: #15171D;
    --bg-800: #1D2027;
    --bg-700: #292D36;
    --bg-600: #383D49;
    --text-100: #F2F4F6;
    --text-200: #CBD0D8;
    --text-300: #A8AFBC;
    --text-400: #767D8C;
    --text-500: #565C69;
    --accent: #E8291C;
    --accent-dark: #C11D13;
    --accent-light: #FF6656;
    --accent-glow: rgba(232,41,28,0.14);
    --brand-yellow: #FFC400;
    --brand-yellow-glow: rgba(255,196,0,0.16);
    --success: #22C55E;
    --success-glow: rgba(34,197,94,0.12);
    --warning: #FB923C;
    --warning-glow: rgba(251,146,60,0.16);
    --danger: #B91C1C;
    --danger-glow: rgba(185,28,28,0.16);
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Lexend", var(--font-ui);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    font-variant-numeric: tabular-nums;
    background: var(--bg-950);
    background-image: radial-gradient(circle at 15% 0%, var(--accent-glow), transparent 40%);
    color: var(--text-100);
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Login ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-box { width: 100%; max-width: 360px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 8px; background: var(--brand-yellow);
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: #1A1300;
    font-family: var(--font-display);
  }
  .brand-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .panel {
    background: var(--bg-850);
    border: 1px solid var(--bg-700);
    border-radius: 10px;
  }
  .modal-box .panel {
    background: var(--bg-900);
    box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6);
  }
  .login-box .panel { padding: 24px; }
  .login-box h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .login-box .sub { color: var(--text-400); font-size: 13px; margin-top: 4px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; color: var(--text-300); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  input[type="email"], input[type="password"], input[type="text"], input[type="number"], input[type="date"],
  select, textarea {
    width: 100%; background: var(--bg-850); border: 1px solid var(--bg-700);
    border-radius: 6px; padding: 9px 11px; color: var(--text-100); font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .btn-primary {
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; padding: 9px 16px; font-size: 13.5px; font-weight: 500;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary.full { width: 100%; padding: 10px; font-size: 14px; }
  .btn-ghost {
    background: none; color: var(--text-300); border: 1px solid var(--bg-700);
    border-radius: 6px; padding: 8px 14px; font-size: 13px;
  }
  .btn-ghost:hover { background: var(--bg-800); color: var(--text-100); }
  .btn-danger-outline {
    background: none; color: var(--danger); border: 1px solid rgba(240,68,56,0.35);
    border-radius: 6px; padding: 8px 14px; font-size: 13px;
  }
  .btn-danger-outline:hover { background: var(--danger-glow); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 5px; }
  .hint { margin-top: 16px; font-size: 12px; color: var(--text-500); text-align: center; }
  .error-msg { color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none; }

  /* ---------- App shell ---------- */
  #app-screen { display: none; height: 100vh; overflow: hidden; }
  .shell { display: flex; height: 100%; }

  .sidebar {
    width: 236px; flex-shrink: 0; background: var(--bg-900);
    border-right: 1px solid var(--bg-800); display: flex; flex-direction: column;
  }
  .sidebar-header { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 18px; flex-shrink: 0; }
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
  .nav-group { margin-bottom: 20px; }
  .nav-group-title { font-size: 11px; color: var(--text-500); padding: 0 8px; margin-bottom: 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 6px; font-size: 13.5px; color: var(--text-300); margin-bottom: 1px;
  }
  .nav-item:hover { background: var(--bg-800); color: var(--text-100); }
  .nav-item.active { background: var(--accent-glow); color: var(--accent-light); }
  .nav-icon { width: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--text-500); }
  .nav-item.active .nav-icon { color: var(--accent-light); }

  .main-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 60px; flex-shrink: 0; border-bottom: 1px solid var(--bg-800);
    display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    background: rgba(8,9,11,0.75); backdrop-filter: blur(6px);
  }
  .search-box {
    display: flex; align-items: center; gap: 8px; background: var(--bg-900);
    border: 1px solid var(--bg-800); border-radius: 6px; padding: 8px 12px;
    width: 100%; max-width: 340px; color: var(--text-500); font-size: 13px;
  }
  .user-chip { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--bg-800); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent-glow);
    color: var(--accent-light); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .logout-btn { background: none; border: none; color: var(--text-400); font-size: 12px; }
  .logout-btn:hover { color: var(--text-100); }

  .content { flex: 1; overflow-y: auto; padding: 26px 28px; }
  .page-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .page-sub { color: var(--text-400); font-size: 13.5px; margin-top: 3px; margin-bottom: 26px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

  .section-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-400); margin-bottom: 12px; margin-top: 26px;
  }
  .section-label::before { content: ""; width: 6px; height: 6px; background: var(--accent); border-radius: 1.5px; flex-shrink: 0; }
  .section-label:first-of-type { margin-top: 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .kpi-card { padding: 18px; }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .kpi-label { font-size: 13px; color: var(--text-400); }
  .kpi-icon {
    width: 26px; height: 26px; border-radius: 6px; background: var(--bg-800);
    display: flex; align-items: center; justify-content: center; color: var(--text-400);
  }
  .kpi-value { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -0.015em; }
  .kpi-value.muted { font-size: 13px; font-weight: 400; color: var(--text-500); font-family: var(--font-ui); }

  .placeholder-view {
    height: 65vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
  }
  .placeholder-icon {
    width: 48px; height: 48px; border-radius: 10px; background: var(--accent-glow);
    color: var(--accent-light); display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 14px;
  }
  .placeholder-view h2 { font-size: 16px; font-weight: 600; }
  .placeholder-view p { color: var(--text-400); font-size: 13.5px; max-width: 340px; margin-top: 6px; }
  .placeholder-tag {
    margin-top: 14px; font-size: 11.5px; color: var(--text-400);
    border: 1px solid var(--bg-700); border-radius: 999px; padding: 4px 12px;
  }

  .info-panel { padding: 18px 20px; margin-top: 26px; }
  .info-panel h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
  .info-panel p { color: var(--text-400); font-size: 13.5px; line-height: 1.5; }

  /* ---------- Tables ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--text-500); padding: 10px 14px; border-bottom: 1px solid var(--bg-800);
    white-space: nowrap;
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--bg-800); color: var(--text-200); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg-850); }
  .row-link { color: var(--text-100); font-weight: 500; cursor: pointer; }
  .row-link:hover { color: var(--accent-light); }
  .cell-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty-row td { text-align: center; color: var(--text-500); padding: 30px; }

  /* ---------- Badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
    border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
  }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-green { background: var(--success-glow); color: var(--success); }
  .badge-yellow { background: var(--warning-glow); color: var(--warning); }
  .badge-red { background: var(--danger-glow); color: var(--danger); }
  .badge-gray { background: var(--bg-800); color: var(--text-400); }
  .badge-blue { background: var(--brand-yellow-glow); color: var(--brand-yellow); }

  /* ---------- Filters / toolbar ---------- */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-chip {
    background: var(--bg-900); border: 1px solid var(--bg-700); color: var(--text-400);
    border-radius: 999px; padding: 6px 13px; font-size: 12.5px;
  }
  .filter-chip.active { background: var(--accent-glow); border-color: transparent; color: var(--accent-light); }
  .toolbar-spacer { flex: 1; }

  /* ---------- Summary cards row ---------- */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }

  /* ---------- Client cards (grid) ---------- */
  .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .client-card { padding: 18px; cursor: pointer; transition: border-color .15s; }
  .card-delete-btn {
    background: none; border: none; color: var(--text-500); padding: 3px;
    border-radius: 5px; display: flex; flex-shrink: 0;
  }
  .card-delete-btn:hover { color: var(--danger); background: var(--danger-glow); }
  .client-card:hover { border-color: var(--accent); }
  .client-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .client-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; }
  .client-meta { font-size: 12.5px; color: var(--text-400); margin-top: 2px; }
  .client-value { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin-top: 10px; }
  .client-value-label { font-size: 11.5px; color: var(--text-500); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--bg-800); margin-bottom: 20px; }
  .tab-btn {
    background: none; border: none; color: var(--text-400); font-size: 13.5px;
    padding: 10px 4px; margin-right: 20px; border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--text-100); border-bottom-color: var(--accent); }

  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-400); font-size: 13px; margin-bottom: 14px; }
  .back-link:hover { color: var(--text-100); }

  .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px 24px; }
  .kv-item .kv-label { font-size: 11.5px; color: var(--text-500); margin-bottom: 3px; }
  .kv-item .kv-value { font-size: 13.5px; color: var(--text-100); }

  .service-tag {
    display: inline-flex; align-items: center; gap: 6px; background: var(--bg-800);
    border: 1px solid var(--bg-700); border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
    margin: 0 6px 6px 0;
  }
  .service-tag button { background: none; border: none; color: var(--text-500); font-size: 12px; }
  .service-tag button:hover { color: var(--danger); }
  .service-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .service-pick-item {
    border: 1px solid var(--bg-700); border-radius: 6px; padding: 6px 10px; font-size: 12.5px;
    color: var(--text-300); cursor: pointer; background: var(--bg-850);
  }
  .service-pick-item.selected { border-color: var(--accent); color: var(--accent-light); background: var(--accent-glow); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-grid .field.full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

  /* ---------- Modal ---------- */
  #modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px;
    overflow-y: auto;
  }
  #modal-overlay.open { display: flex; }
  .modal-box { width: 100%; max-width: 520px; }
  .modal-box .panel { padding: 22px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -0.005em; }
  .modal-close { background: none; border: none; color: var(--text-400); font-size: 18px; line-height: 1; }
  .modal-close:hover { color: var(--text-100); }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--bg-800); border: 1px solid var(--bg-700); color: var(--text-100);
    padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 200;
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.6); display: none;
  }

  @media (max-width: 720px) {
    .sidebar { display: none; }
    .content { padding: 18px; }
    .form-grid { grid-template-columns: 1fr; }
  }

  /* ---------- Kanban ---------- */
  .kanban-wrap { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
  .kanban-col { flex: 0 0 250px; }
  .kanban-col-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .kanban-col-title { font-size: 12.5px; font-weight: 600; color: var(--text-300); }
  .kanban-col-count { font-size: 11px; color: var(--text-500); background: var(--bg-800); border-radius: 999px; padding: 1px 8px; }
  .kanban-cards { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
  .task-card { padding: 12px; }
  .task-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .task-meta-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 11.5px; color: var(--text-500); }
  .task-move-row { display: flex; justify-content: space-between; gap: 6px; margin-top: 8px; }
  .task-move-btn { flex: 1; background: var(--bg-800); border: none; color: var(--text-400); border-radius: 5px; padding: 5px; font-size: 12px; }
  .task-move-btn:hover:not(:disabled) { background: var(--bg-700); color: var(--text-100); }
  .task-move-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---------- Calendar ---------- */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-weekday { text-align: center; font-size: 11px; color: var(--text-500); padding-bottom: 6px; }
  .cal-cell { min-height: 84px; background: var(--bg-900); border: 1px solid var(--bg-800); border-radius: 8px; padding: 6px; }
  .cal-cell.empty { background: transparent; border-color: transparent; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-day-num { font-size: 11.5px; color: var(--text-400); margin-bottom: 4px; }
  .cal-event { font-size: 10.5px; padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-event.ev-client { background: var(--accent-glow); color: var(--accent-light); }
  .cal-event.ev-employee { background: var(--warning-glow); color: var(--warning); }
  .cal-event.ev-project { background: var(--success-glow); color: var(--success); }
  .cal-event.ev-task { background: var(--danger-glow); color: var(--danger); }
  .cal-legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-400); }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 2px; }
</style>
</head>
<body>

<!-- ============== LOGIN ============== -->
<div id="login-screen">
  <div class="login-box">
    <div class="brand">
      <div class="brand-mark">M</div>
      <span class="brand-name">Maximizze</span>
    </div>
    <div class="panel">
      <h1>Entrar</h1>
      <p class="sub">Acesse o painel interno da agência.</p>
      <p class="error-msg" id="login-error">E-mail ou senha inválidos.</p>
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" placeholder="voce@maximizze.com.br" />
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" placeholder="********" />
      </div>
      <button class="btn-primary full" id="login-btn" type="button">Entrar</button>
    </div>
  </div>
</div>

<!-- ============== APP ============== -->
<div id="app-screen">
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-mark" style="width:28px;height:28px;font-size:13px;">M</div>
        <span class="brand-name" style="font-size:14.5px;">Maximizze</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="10.3" cy="10.3" r="6.3"/><line x1="15.2" y1="15.2" x2="20" y2="20"/></svg>
          <span>Buscar clientes, projetos, orcamentos...</span>
        </div>
        <div class="user-chip">
          <div style="position:relative;">
            <button id="bell-btn" type="button" style="background:none;border:none;color:var(--text-400);position:relative;padding:6px;display:flex;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a5 5 0 0 0-5 5v3.3c0 1-.4 2-1.2 2.7L4.5 16h15l-1.3-1c-.8-.7-1.2-1.7-1.2-2.7V8a5 5 0 0 0-5-5z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
              <span id="bell-badge" style="display:none;position:absolute;top:0;right:0;background:var(--danger);color:#fff;font-size:10px;border-radius:999px;padding:0 4px;line-height:14px;"></span>
            </button>
            <div id="bell-dropdown" style="display:none;position:absolute;right:0;top:36px;width:300px;z-index:50;"></div>
          </div>
          <div class="avatar" id="user-avatar">A</div>
          <span id="user-email" style="font-size:13px;color:var(--text-300);"></span>
          <button class="logout-btn" id="logout-btn" type="button">Sair</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<!-- ============== MODAL ============== -->
<div id="modal-overlay">
  <div class="modal-box">
    <div class="panel">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close" type="button">&times;</button>
      </div>
      <div id="modal-body"></div>

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}
function fmtBRL(v) { return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function fmtDate(d) { if (!d) return "-"; const dt = new Date(d); return dt.toLocaleDateString("pt-BR"); }
function monthLabelNow() { return new Date().toISOString().slice(0, 7); }
function monthLabelOffset(n) { const d = new Date(); d.setMonth(d.getMonth() + n); return d.toISOString().slice(0, 7); }
function escapeHtml(s) { return (s || "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = "none"; }, 2600);
}

function downloadCSV(filename, headers, rows) {
  const escapeCsv = (v) => {
    const s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [headers.map(escapeCsv).join(","), ...rows.map(r => r.map(escapeCsv).join(","))].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===========================================================================
// Supabase — conexao, conversao de nomes (camelCase <-> snake_case) e
// sincronizacao dos dados. loadData()/saveData() mantem exatamente a mesma
// assinatura de antes, entao nenhuma outra parte do app precisou mudar.
// ===========================================================================
const SUPABASE_URL = "https://xjqsdchyqflborjsggzi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ehJQgS3sgCRKZEV5hORKbg_8ylkeJE-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ordem que respeita as chaves estrangeiras na hora de INSERIR
// (pais antes dos filhos); DELETE/UPDATE nao dependem dessa ordem.
const TABLE_ORDER = [
  ["services", "services"], ["employees", "employees"], ["clients", "clients"],
  ["agencyCosts", "agency_costs"], ["payments", "payments"],
  ["employeePayments", "employee_payments"], ["budgets", "budgets"],
  ["projects", "projects"], ["tasks", "tasks"], ["leads", "leads"],
  ["contracts", "contracts"], ["expenses", "expenses"], ["revenues", "revenues"],
  ["auditLogs", "audit_logs"],
];

function camelToSnake(s) { return s.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase()); }
function snakeToCamel(s) { return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }
function rowToDb(obj) {
  const out = {};
  for (const k in obj) out[camelToSnake(k)] = obj[k];
  return out;
}
function rowFromDb(row) {
  const out = {};
  for (const k in row) out[snakeToCamel(k)] = row[k];
  return out;
}

let LAST_SYNCED = null;

async function loadData() {
  const results = await Promise.all(
    TABLE_ORDER.map(([, table]) => sb.from(table).select("*").order("created_at", { ascending: true }))
  );
  const data = {};
  TABLE_ORDER.forEach(([key], i) => {
    const { data: rows, error } = results[i];
    if (error) console.error("Erro ao carregar " + key + ":", error);
    data[key] = (rows || []).map(rowFromDb);
  });
  const settingsRes = await sb.from("settings").select("*").eq("id", "singleton").maybeSingle();
  data.settings = settingsRes.data
    ? rowFromDb(settingsRes.data)
    : { minMargin: 20, recommendedMargin: 40, premiumMargin: 60, agencyName: "Maximizze", currency: "BRL" };
  data.isDemo = TABLE_ORDER.some(([key]) => (data[key] || []).some((x) => x.isDemo));
  LAST_SYNCED = JSON.parse(JSON.stringify(data));
  return data;
}

async function saveData() {
  let hadError = false;
  const newSynced = {};
  try {
    for (const [key, table] of TABLE_ORDER) {
      const current = DATA[key] || [];
      const previous = LAST_SYNCED[key] || [];
      const prevIds = new Set(previous.map((x) => x.id));
      const currIds = new Set(current.map((x) => x.id));

      const toInsert = current.filter((x) => !prevIds.has(x.id));
      const toDelete = previous.filter((x) => !currIds.has(x.id));
      const toUpdate = current.filter((x) => {
        if (!prevIds.has(x.id)) return false;
        const prev = previous.find((p) => p.id === x.id);
        return JSON.stringify(prev) !== JSON.stringify(x);
      });

      const failedIds = new Set();

      if (toInsert.length) {
        const { error } = await sb.from(table).insert(toInsert.map(rowToDb));
        if (error) {
          console.error("Erro ao inserir em " + table + ":", error);
          hadError = true;
          toInsert.forEach((x) => failedIds.add(x.id));
        }
      }
      for (const row of toUpdate) {
        const { error } = await sb.from(table).update(rowToDb(row)).eq("id", row.id);
        if (error) { console.error("Erro ao atualizar " + table + ":", error); hadError = true; failedIds.add(row.id); }
      }
      for (const row of toDelete) {
        const { error } = await sb.from(table).delete().eq("id", row.id);
        if (error) { console.error("Erro ao excluir de " + table + ":", error); hadError = true; }
      }

      // so marca como sincronizado o que realmente foi salvo; o que falhou
      // fica de fora do snapshot e e tentado de novo no proximo saveData()
      newSynced[key] = current
        .filter((x) => !failedIds.has(x.id))
        .map((x) => JSON.parse(JSON.stringify(x)));
    }
    if (DATA.settings) {
      const { error } = await sb.from("settings").update(rowToDb(DATA.settings)).eq("id", "singleton");
      if (error) { console.error("Erro ao salvar settings:", error); hadError = true; }
      else newSynced.settings = JSON.parse(JSON.stringify(DATA.settings));
    }
    LAST_SYNCED = newSynced;

    if (hadError) {
      showToast("Alguns dados nao foram salvos no banco. Verifique sua conexao e tente novamente.");
    }
  } catch (e) {
    console.error("Erro ao salvar no Supabase:", e);
    showToast("Nao foi possivel salvar. Verifique sua conexao com a internet.");
  }
}

function ensureMonthlyPayments() {
  const now = monthLabelNow();
  let changed = false;
  DATA.clients.forEach(c => {
    if (!c.monthlyValue || Number(c.monthlyValue) <= 0) return;
    if (c.status === "PAUSADO" || c.status === "INATIVO" || c.status === "EM_NEGOCIACAO") return;
    const exists = DATA.payments.some(p => p.clientId === c.id && p.competencia === now);
    if (!exists) {
      const day = String(c.dueDay || 10).padStart(2, "0");
      DATA.payments.push({
        id: uid(), clientId: c.id, competencia: now, value: Number(c.monthlyValue),
        paidValue: null, dueDate: now + "-" + day, paymentDate: null, paymentMethod: null,
        status: "PENDENTE", notes: "", isDemo: false,
      });
      changed = true;
    }
  });
  return changed;
}

function reconcileOverduePayments() {
  const today = new Date().toISOString().slice(0, 10);
  let changed = false;
  DATA.payments.forEach(p => {
    if (p.status === "PENDENTE" && p.dueDate && p.dueDate < today) {
      p.status = "ATRASADO";
      changed = true;
    }
  });
  return changed;
}

function deleteClientCascade(clientId) {
  const client = DATA.clients.find(c => c.id === clientId);
  if (!client) return;

  DATA.payments = DATA.payments.filter(p => p.clientId !== clientId);
  const removedProjectIds = new Set(DATA.projects.filter(p => p.clientId === clientId).map(p => p.id));
  DATA.projects = DATA.projects.filter(p => p.clientId !== clientId);
  DATA.tasks = DATA.tasks.filter(t => t.clientId !== clientId && !removedProjectIds.has(t.projectId));
  DATA.contracts = DATA.contracts.filter(c => c.clientId !== clientId);
  DATA.budgets = DATA.budgets.filter(b => b.clientId !== clientId);
  DATA.revenues = DATA.revenues.filter(r => r.clientId !== clientId);
  DATA.leads.forEach(l => { if (l.convertedClientId === clientId) l.convertedClientId = null; });
  DATA.clients = DATA.clients.filter(c => c.id !== clientId);

  logAudit("excluiu", "Cliente", clientId, client.companyName + " excluido (com mensalidades, projetos, tarefas, contratos, orcamentos e receitas vinculados)");
}

      <button class="btn-primary" id="modal-save" type="button">Salvar cliente</button>
    `);
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-save").addEventListener("click", async () => {
      const values = readClientForm();
      if (!values.companyName) { showToast("Informe o nome da empresa."); return; }
      const newClient = { id: uid(), ...values, address: "", facebook: "", website: "", contractStartDate: new Date().toISOString().slice(0,10), services: [], isDemo: false };
      DATA.clients.push(newClient);
      ensureMonthlyPayments();
      await saveData();
      closeModal();
      showToast("Cliente cadastrado.");
      renderView("clientes");
    });
  });

  document.querySelectorAll(".client-card").forEach(card => {
    card.addEventListener("click", (e) => {
      if (e.target.closest("[data-quick-delete-client]")) return;
      currentClientId = card.dataset.clientId;
      clientDetailTab = "info";
      renderView("cliente-detail");
    });
  });

  document.querySelectorAll("[data-quick-delete-client]").forEach(btn => {
    btn.addEventListener("click", async (e) => {

      if (!ok) return;
      deleteClientCascade(client.id);
      await saveData();
      showToast("Cliente excluido.");
      renderView("clientes");
    });
  });
}

function renderClientDetail(clientId) {
  const client = DATA.clients.find(c => c.id === clientId);

  const st = CLIENT_STATUS_LABELS[client.status] || CLIENT_STATUS_LABELS.ATIVO;

  let body = "";

  else if (clientDetailTab === "financeiro") body = renderClientFinanceTab(client);

  return `
    <a href="#" class="back-link" id="back-to-clients">&larr; Voltar para clientes</a>
    <div class="page-head">
      <div>
        <div class="page-title">${escapeHtml(client.companyName)}</div>
        <div class="page-sub">${escapeHtml(client.contactName || "-")}</div>
      </div>
      <span class="badge ${st.cls}"><span class="badge-dot" style="background:currentColor"></span>${st.label}</span>
    </div>
    <div class="tabs">
      <button class="tab-btn ${clientDetailTab === "info" ? "active" : ""}" data-tab="info" type="button">Informacoes</button>
      <button class="tab-btn ${clientDetailTab === "servicos" ? "active" : ""}" data-tab="servicos" type="button">Servicos contratados</button>

function renderClientInfoTab(c) {
  const kv = (label, value) => `<div class="kv-item"><div class="kv-label">${label}</div><div class="kv-value">${escapeHtml(value || "-")}</div></div>`;
  return `
    <div class="panel" style="padding:20px;">
      <div class="kv-grid">
        ${kv("CPF/CNPJ", c.document)}
        ${kv("WhatsApp", c.whatsapp)}
        ${kv("E-mail", c.email)}
        ${kv("Instagram", c.instagram)}
        ${kv("Inicio do contrato", fmtDate(c.contractStartDate))}
        ${kv("Dia de vencimento", "Todo dia " + (c.dueDay || "-"))}
        ${kv("Valor da mensalidade", fmtBRL(c.monthlyValue))}
        ${kv("Forma de pagamento", c.paymentMethod)}
      </div>
      ${c.notes ? `<div style="margin-top:18px;"><div class="kv-label" style="margin-bottom:6px;">Observacoes</div><div class="kv-value">${escapeHtml(c.notes)}</div></div>` : ""}

function renderClientServicesTab(c) {
  const contracted = c.services || [];
  const tags = contracted.map(s => `
    <span class="service-tag">${escapeHtml(s)} <button data-remove-service="${escapeHtml(s)}" type="button">&times;</button></span>
  `).join("") || `<p style="color:var(--text-500);font-size:13.5px;">Nenhum servico contratado ainda.</p>`;

function renderClientFinanceTab(c) {
  const { payments, last, next } = clientPaymentSummary(c.id);
  const kv = (label, value) => `<div class="kv-item"><div class="kv-label">${label}</div><div class="kv-value">${value}</div></div>`;

    const st = PAYMENT_STATUS_LABELS[p.status] || PAYMENT_STATUS_LABELS.PENDENTE;
    return `
      <tr>

        <td><span class="badge ${st.cls}"><span class="badge-dot" style="background:currentColor"></span>${st.label}</span></td>
      </tr>

  return `
    <div class="panel" style="padding:20px;margin-bottom:18px;">
      <div class="kv-grid">

        ${kv("Dia de vencimento", "Todo dia " + (c.dueDay || "-"))}
        ${kv("Ultimo pagamento", last ? fmtDate(last.paymentDate) + " &middot; " + fmtBRL(last.paidValue || last.value) : "-")}

      </div>

        <button class="btn-ghost btn-sm" id="btn-partial-payment" type="button">Registrar pagamento parcial</button>

          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;

function openPaymentModal(client, mode) {
  const { next } = clientPaymentSummary(client.id);
  const target = next || null;
  const title = mode === "partial" ? "Registrar pagamento parcial" : "Confirmar pagamento";
  const body = `
    <div class="field">
      <label>Valor pago (R$)</label>
      <input type="number" step="0.01" id="pm-value" value="${target ? target.value : client.monthlyValue}" />
    </div>
    <div class="field">
      <label>Data do pagamento</label>
      <input type="date" id="pm-date" value="${new Date().toISOString().slice(0,10)}" />
    </div>
    <div class="field">
      <label>Forma de pagamento</label>
      <select id="pm-method">${PAYMENT_METHODS.map(m => `<option>${m}</option>`).join("")}</select>
    </div>
    <div class="field">
      <label>Observacao</label>
      <textarea id="pm-notes"></textarea>
    </div>
  `;
  openModal(title, body, `
    <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
    <button class="btn-primary" id="modal-save" type="button">Salvar</button>
  `);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", async () => {
    const value = parseFloat(document.getElementById("pm-value").value) || 0;
    const date = document.getElementById("pm-date").value;
    const method = document.getElementById("pm-method").value;
    const notes = document.getElementById("pm-notes").value.trim();
    const isPartial = mode === "partial";

    if (target) {
      target.status = isPartial ? "PARCIAL" : "PAGO";
      target.paidValue = value;
      target.paymentDate = date;
      target.paymentMethod = method;
      target.notes = notes;
    } else {
      DATA.payments.push({
        id: uid(), clientId: client.id, competencia: monthLabelNow(),
        value: client.monthlyValue, paidValue: value, dueDate: monthLabelNow() + "-" + String(client.dueDay || 10).padStart(2, "0"),
        paymentDate: date, paymentMethod: method, status: isPartial ? "PARCIAL" : "PAGO", notes, isDemo: false,
      });
    }
    if (!isPartial && client.status === "INADIMPLENTE") client.status = "ATIVO";
    logAudit("registrou", "Pagamento", client.id, (isPartial ? "Pagamento parcial de " : "Pagamento de ") + client.companyName + ": " + fmtBRL(value));
    await saveData();
    closeModal();
    showToast("Pagamento registrado.");
    renderView("cliente-detail");
  });
}

function attachClientDetailEvents() {
  document.getElementById("back-to-clients").addEventListener("click", (e) => { e.preventDefault(); currentClientId = null; renderView("clientes"); });
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => { clientDetailTab = btn.dataset.tab; renderView("cliente-detail"); });
  });

  const client = DATA.clients.find(c => c.id === currentClientId);
  if (!client) return;

  if (clientDetailTab === "info") {
    const editBtn = document.getElementById("btn-edit-client");
    if (editBtn) editBtn.addEventListener("click", () => {
      openModal("Editar cliente", clientFormHtml(client), `
        <button class="btn-ghost" id="modal-cancel" type="button">Cancelar</button>
        <button class="btn-primary" id="modal-save" type="button">Salvar alteracoes</button>
      `);
      document.getElementById("modal-cancel").addEventListener("click", closeModal);
      document.getElementById("modal-save").addEventListener("click", async () => {
        const values = readClientForm();
        if (!values.companyName) { showToast("Informe o nome da empresa."); return; }
        Object.assign(client, values);
        ensureMonthlyPayments();
        await saveData();
        closeModal();
        showToast("Cliente atualizado.");
        renderView("cliente-detail");
      });
    });

    const deleteBtn = document.getElementById("btn-delete-client");
    if (deleteBtn) deleteBtn.addEventListener("click", async () => {
      const ok = window.confirm("Excluir " + client.companyName + "? Isso remove tambem mensalidades, projetos, tarefas, contratos, orcamentos e receitas vinculados a este cliente. Essa acao nao pode ser desfeita.");
      if (!ok) return;
      deleteClientCascade(client.id);
      await saveData();
      currentClientId = null;
      showToast("Cliente excluido.");
      renderView("clientes");
    });
  }

  if (clientDetailTab === "servicos") {
    document.querySelectorAll("[data-remove-service]").forEach(btn => {
      btn.addEventListener("click", async () => {
        client.services = (client.services || []).filter(s => s !== btn.dataset.removeService);
        await saveData();
        renderView("cliente-detail");
      });
    });
    document.querySelectorAll("[data-add-service]").forEach(btn => {
      btn.addEventListener("click", async () => {
        client.services = client.services || [];
        client.services.push(btn.dataset.addService);
        await saveData();
        renderView("cliente-detail");
      });
    });
  }

  if (clientDetailTab === "financeiro") {
    const confirmBtn = document.getElementById("btn-confirm-payment");
    const partialBtn = document.getElementById("btn-partial-payment");
    const delinquentBtn = document.getElementById("btn-mark-delinquent");
    if (confirmBtn) confirmBtn.addEventListener("click", () => openPaymentModal(client, "full"));
    if (partialBtn) partialBtn.addEventListener("click", () => openPaymentModal(client, "partial"));
    if (delinquentBtn) delinquentBtn.addEventListener("click", async () => {
      client.status = "INADIMPLENTE";
      const { next } = clientPaymentSummary(client.id);
      if (next) next.status = "ATRASADO";
      logAudit("marcou", "Cliente", client.id, client.companyName + " marcado como inadimplente");
      await saveData();
      showToast("Cliente marcado como inadimplente.");
      renderView("cliente-detail");
    });
  }
}

// MENSALIDADES
// ===========================================================================
function mensalidadeFiltered() {
  const now = monthLabelNow();
  const next = monthLabelOffset(1);
  return DATA.payments.filter(p => {
    if (mensalidadeFilter === "pagos") return p.status === "PAGO";
    if (mensalidadeFilter === "pendentes") return p.status === "PENDENTE";
    if (mensalidadeFilter === "atrasados") return p.status === "ATRASADO";
    if (mensalidadeFilter === "este_mes") return p.competencia === now;
    if (mensalidadeFilter === "proximo_mes") return p.competencia === next;
    return true;
  });
}

function renderMensalidades() {
  const all = DATA.payments;
  const totalPrevisto = all.reduce((s, p) => s + Number(p.value), 0);
  const totalRecebido = all.filter(p => p.status === "PAGO").reduce((s, p) => s + Number(p.paidValue || p.value), 0);
  const totalAtrasado = all.filter(p => p.status === "ATRASADO").reduce((s, p) => s + Number(p.value), 0);
  const totalAReceber = all.filter(p => p.status !== "PAGO" && p.status !== "CANCELADO").reduce((s, p) => s + Number(p.value), 0);

  const filters = [
    ["todos", "Todos"], ["pagos", "Pagos"], ["pendentes", "Pendentes"],
    ["atrasados", "Atrasados"], ["este_mes", "Este mes"], ["proximo_mes", "Proximo mes"],
  ];

  const rows = mensalidadeFiltered().map(p => {
    const client = DATA.clients.find(c => c.id === p.clientId);
    const st = PAYMENT_STATUS_LABELS[p.status] || PAYMENT_STATUS_LABELS.PENDENTE;
    return `
      <tr>
        <td><span class="row-link" data-goto-client="${p.clientId}">${escapeHtml(client ? client.companyName : "-")}</span></td>
        <td>${client && client.dueDay ? "Todo dia " + client.dueDay : "-"}</td>
        <td>${fmtBRL(p.value)}</td>
        <td>${fmtDate(p.dueDate)}</td>
        <td><span class="badge ${st.cls}"><span class="badge-dot" style="background:currentColor"></span>${st.label}</span></td>
        <td>${fmtDate(p.paymentDate)}</td>
        <td class="cell-actions">
          ${p.status !== "PAGO" ? `<button class="btn-primary btn-sm" data-quick-confirm="${p.id}" type="button">Marcar como pago</button>` : ""}
        </td>
      </tr>
    `;
  }).join("") || `<tr class="empty-row"><td colspan="7">Nenhuma mensalidade encontrada para este filtro.</td></tr>`;

  const kpi = (label, value, cls) => `<div class="panel kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value" style="${cls || ""}">${fmtBRL(value)}</div></div>`;

  return `
    <div class="page-title">Mensalidades</div>
    <div class="page-sub">Cobranca gerada automaticamente todo mes para os clientes ativos. Marcar como pago aqui ja atualiza o Financeiro Geral.</div>

    <div class="summary-grid">
      ${kpi("Total a receber", totalAReceber)}
      ${kpi("Total recebido", totalRecebido, "color:var(--success)")}
      ${kpi("Total atrasado", totalAtrasado, "color:var(--danger)")}
      ${kpi("Total previsto", totalPrevisto)}
    </div>

    <div class="toolbar">
      ${filters.map(([key, label]) => `<button class="filter-chip ${mensalidadeFilter === key ? "active" : ""}" data-filter="${key}" type="button">${label}</button>`).join("")}
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Cliente</th><th>Dia</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Data pagamento</th><th>Acoes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function attachMensalidadesEvents() {
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => { mensalidadeFilter = btn.dataset.filter; renderView("mensalidades"); });
  });
  document.querySelectorAll("[data-goto-client]").forEach(el => {
    el.addEventListener("click", () => { currentClientId = el.dataset.gotoClient; clientDetailTab = "financeiro"; renderView("cliente-detail"); });
  });
  document.querySelectorAll("[data-quick-confirm]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const payment = DATA.payments.find(p => p.id === btn.dataset.quickConfirm);
      if (!payment) return;
      payment.status = "PAGO";
      payment.paidValue = payment.value;
      payment.paymentDate = new Date().toISOString().slice(0, 10);
      payment.paymentMethod = payment.paymentMethod || "PIX";
      const client = DATA.clients.find(c => c.id === payment.clientId);
      if (client && client.status === "INADIMPLENTE") client.status = "ATIVO";
      await saveData();
      showToast("Pagamento confirmado.");
      renderView("mensalidades");
    });
  });
}

function nextBudgetNumber() {
  const year = new Date().getFullYear();
  const countThisYear = DATA.budgets.filter(b => b.number.startsWith(String(year))).length;
  return year + "-" + String(countThisYear + 1).padStart(3, "0");
}

function computeBudget(b) {
  const employeeCost = (b.employeeItems || []).reduce((s, i) => s + Number(i.costValue || 0), 0);
  const softwareTotal = DATA.agencyCosts.filter(c => c.category === "SOFTWARE").reduce((s, c) => s + Number(c.value), 0);
  const activeClients = Math.max(1, DATA.clients.filter(c => c.status === "ATIVO").length);

  let softwareCost = 0;
  if (b.softwareCostMode === "RATEIO_AUTOMATICO") softwareCost = softwareTotal / activeClients;
  else if (b.softwareCostMode === "MANUAL") softwareCost = Number(b.manualSoftwareCost || 0);

  const totalCost = employeeCost + softwareCost + Number(b.operationalCost || 0) + Number(b.otherCosts || 0);

  const priceFor = (marginPct) => {
    const m = Number(marginPct) / 100;
    if (m >= 1) return totalCost; // protecao contra divisao por zero/negativa
    return totalCost / (1 - m);
  };

  const minPrice = priceFor(b.minMargin);
  const recommendedPrice = priceFor(b.recommendedMargin);
  const premiumPrice = priceFor(b.premiumMargin);

  return { employeeCost, softwareCost, totalCost, minPrice, recommendedPrice, premiumPrice };
}

  if (e.contractType === "FIXO_MENSAL") return fmtBRL(e.fixedValue) + " /mes";
  if (e.contractType === "POR_CLIENTE") return fmtBRL(e.perClientValue) + " /cliente";
  if (e.contractType === "POR_SERVICO") return fmtBRL(e.perServiceValue) + " /servico";
  if (e.contractType === "PERCENTUAL" || e.contractType === "COMISSAO") return Number(e.percentage || 0) + "% sobre projeto";
  return "A combinar";
}

function monthsForFilter(filter) {
  const now = new Date();
  if (filter === "este_mes") return [monthLabelNow()];
  if (filter === "mes_anterior") return [monthLabelOffset(-1)];
  if (filter === "ultimos_3") return [monthLabelOffset(-2), monthLabelOffset(-1), monthLabelNow()];
  if (filter === "ultimos_6") return [-5,-4,-3,-2,-1,0].map(monthLabelOffset);
  if (filter === "este_ano") {
    const list = [];
    for (let m = 0; m <= now.getMonth(); m++) list.push(`${now.getFullYear()}-${String(m + 1).padStart(2, "0")}`);
    return list;
  }
  return [monthLabelNow()];
}

function computeFinanceiro(filter) {
  const months = monthsForFilter(filter);
  const monthSet = new Set(months);

  const mensalidadesRecebidas = DATA.payments.filter(p => monthSet.has(p.competencia) && p.status === "PAGO");
  const revenuesPeriodo = DATA.revenues.filter(r => monthSet.has((r.date || "").slice(0, 7)));
  const entradas = [
    ...mensalidadesRecebidas.map(p => ({ desc: (DATA.clients.find(c => c.id === p.clientId) || {}).companyName || "Cliente", cat: "Mensalidade", value: Number(p.paidValue || p.value), date: p.paymentDate })),
    ...revenuesPeriodo.map(r => ({ desc: r.description, cat: r.category, value: Number(r.value), date: r.date })),
  ];
  const totalEntradas = entradas.reduce((s, e) => s + e.value, 0);

  const colaboradoresPagos = DATA.employeePayments.filter(p => monthSet.has(p.competencia) && p.status === "PAGO");
  const expensesPeriodo = DATA.expenses.filter(e => monthSet.has((e.date || "").slice(0, 7)));
  const custosAgenciaTotal = DATA.agencyCosts.reduce((s, c) => s + Number(c.value), 0) * months.length;

  const saidas = [
    ...colaboradoresPagos.map(p => ({ desc: p.employee, cat: "Colaborador", value: Number(p.value), date: p.paymentDate })),
    ...expensesPeriodo.map(e => ({ desc: e.description, cat: COST_CATEGORY_LABELS[e.category] || e.category, value: Number(e.value), date: e.date })),
    { desc: "Custos fixos da agencia (" + months.length + " mes(es))", cat: "Estrutura/Software", value: custosAgenciaTotal, date: null },
  ];
  const totalSaidas = saidas.reduce((s, e) => s + e.value, 0);

  const contasAPagar = DATA.employeePayments.filter(p => p.status !== "PAGO").reduce((s, p) => s + Number(p.value), 0)
    + DATA.expenses.filter(e => !e.paid).reduce((s, e) => s + Number(e.value), 0);
  const contasAReceber = DATA.payments.filter(p => p.status === "PENDENTE" || p.status === "ATRASADO").reduce((s, p) => s + Number(p.value), 0);

  return { months, entradas, saidas, totalEntradas, totalSaidas, saldo: totalEntradas - totalSaidas, contasAPagar, contasAReceber };
}

function fluxoDeCaixa() {
  const last6 = [-5,-4,-3,-2,-1,0].map(monthLabelOffset);
  const custosAgenciaMensal = DATA.agencyCosts.reduce((s, c) => s + Number(c.value), 0);
  let saldoAcumulado = 0;
  return last6.map(m => {
    const entradas = DATA.payments.filter(p => p.competencia === m && p.status === "PAGO").reduce((s, p) => s + Number(p.paidValue || p.value), 0)
      + DATA.revenues.filter(r => (r.date || "").slice(0, 7) === m).reduce((s, r) => s + Number(r.value), 0);
    const saidas = DATA.employeePayments.filter(p => p.competencia === m && p.status === "PAGO").reduce((s, p) => s + Number(p.value), 0)
      + DATA.expenses.filter(e => (e.date || "").slice(0, 7) === m).reduce((s, e) => s + Number(e.value), 0)
      + custosAgenciaMensal;
    const saldoInicial = saldoAcumulado;
    saldoAcumulado += entradas - saidas;
    return { month: m, saldoInicial, entradas, saidas, saldoFinal: saldoAcumulado };
  });
}

function rentabilidadePorCliente() {
  const activeClients = DATA.clients.filter(c => c.status === "ATIVO");
  const now = monthLabelNow();
  const totalColaboradoresMes = DATA.employeePayments.filter(p => p.competencia === now).reduce((s, p) => s + Number(p.value), 0);
  const softwareTotal = DATA.agencyCosts.filter(c => c.category === "SOFTWARE").reduce((s, c) => s + Number(c.value), 0);
  const n = Math.max(1, activeClients.length);

  return activeClients.map(c => {
    const mensalidade = Number(c.monthlyValue || 0);
    const custoEquipe = totalColaboradoresMes / n;
    const software = softwareTotal / n;
    const lucro = mensalidade - custoEquipe - software;
    const margem = mensalidade > 0 ? (lucro / mensalidade) * 100 : 0;
    return { client: c, mensalidade, custoEquipe, software, lucro, margem };
  }).sort((a, b) => b.lucro - a.lucro);
}

function renderCalendario() {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + calendarMonthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  const eventsByDay = {};
  const addEvent = (day, label, cls) => {
    if (day < 1 || day > daysInMonth) return;
    if (!eventsByDay[day]) eventsByDay[day] = [];
    eventsByDay[day].push({ label, cls });
  };

  DATA.clients.forEach(c => { if (c.dueDay) addEvent(c.dueDay, "Venc. " + c.companyName, "ev-client"); });
  DATA.employeePayments.filter(p => p.competencia === monthKey && p.status !== "PAGO").forEach(p => {
    addEvent(new Date(p.paymentDate || monthKey + "-05").getDate() || 5, "Pagto " + p.employee, "ev-employee");
  });
  DATA.projects.filter(p => (p.deadline || "").slice(0, 7) === monthKey).forEach(p => {
    addEvent(new Date(p.deadline).getDate(), "Prazo " + p.name, "ev-project");
  });
  DATA.tasks.filter(t => (t.deadline || "").slice(0, 7) === monthKey && t.status !== "CONCLUIDO").forEach(t => {
    addEvent(new Date(t.deadline).getDate(), "Tarefa " + t.title, "ev-task");
  });

  const weekdays = ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
  let cells = "";
  for (let i = 0; i < firstWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${monthKey}-${String(d).padStart(2, "0")}`;
    const evs = (eventsByDay[d] || []).slice(0, 3).map(e => `<div class="cal-event ${e.cls}">${escapeHtml(e.label)}</div>`).join("");
    const extra = (eventsByDay[d] || []).length > 3 ? `<div style="font-size:10px;color:var(--text-500);">+${eventsByDay[d].length - 3} mais</div>` : "";
    cells += `<div class="cal-cell ${dateStr === todayStr ? "today" : ""}"><div class="cal-day-num">${d}</div>${evs}${extra}</div>`;
  }

  const monthName = base.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Calendario</div>
        <div class="page-sub" style="text-transform:capitalize;">${monthName}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost btn-sm" id="cal-prev" type="button">&larr;</button>
        <button class="btn-ghost btn-sm" id="cal-today" type="button">Hoje</button>
        <button class="btn-ghost btn-sm" id="cal-next" type="button">&rarr;</button>
      </div>
    </div>
    <div class="cal-legend">
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--accent-light)"></span>Vencimento de cliente</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--warning)"></span>Pagamento de colaborador</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--success)"></span>Prazo de projeto</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--danger)"></span>Prazo de tarefa</div>
    </div>
    <div class="cal-grid">
      ${weekdays.map(w => `<div class="cal-weekday">${w}</div>`).join("")}
      ${cells}
    </div>
  `;
}

function attachCalendarioEvents() {
  document.getElementById("cal-prev").addEventListener("click", () => { calendarMonthOffset--; renderView("calendario"); });
  document.getElementById("cal-next").addEventListener("click", () => { calendarMonthOffset++; renderView("calendario"); });

// ALERTAS (sino de notificacoes)
// ===========================================================================
function computeAlerts() {
  const alerts = [];
  const now = new Date();
  const in5days = new Date(now); in5days.setDate(in5days.getDate() + 5);
  const in30days = new Date(now); in30days.setDate(in30days.getDate() + 30);

  const delinquent = DATA.clients.filter(c => c.status === "INADIMPLENTE");
  if (delinquent.length) alerts.push({ label: delinquent.length + " cliente(s) inadimplente(s)", view: "mensalidades" });

  DATA.clients.filter(c => c.status === "ATIVO" && c.dueDay).forEach(c => {
    const dueThisMonth = new Date(now.getFullYear(), now.getMonth(), c.dueDay);
    if (dueThisMonth >= now && dueThisMonth <= in5days) {
      alerts.push({ label: "Mensalidade de " + c.companyName + " vence dia " + c.dueDay, view: "mensalidades" });
    }
  });

  const pendentesColab = DATA.employeePayments.filter(p => p.competencia === monthLabelNow() && p.status !== "PAGO");
  if (pendentesColab.length) alerts.push({ label: pendentesColab.length + " pagamento(s) de colaborador pendente(s) este mes", view: "colaboradores" });

  const overdueExpenses = DATA.expenses.filter(e => !e.paid && e.date < now.toISOString().slice(0, 10));
  if (overdueExpenses.length) alerts.push({ label: overdueExpenses.length + " despesa(s) vencida(s) nao paga(s)", view: "financeiro" });

  DATA.projects.filter(p => p.status !== "CONCLUIDO" && p.status !== "CANCELADO" && p.deadline).forEach(p => {
    const d = new Date(p.deadline);
    if (d >= now && d <= in5days) alerts.push({ label: "Projeto \"" + p.name + "\" com prazo proximo", view: "projetos" });
  });

  DATA.contracts.filter(c => c.status === "ATIVO" && c.endDate).forEach(c => {
    const d = new Date(c.endDate);
    if (d >= now && d <= in30days) {
      const client = DATA.clients.find(cl => cl.id === c.clientId);
      alerts.push({ label: "Contrato de " + (client ? client.companyName : "-") + " vence em breve", view: "contratos" });
    }
  });

  return alerts;
}

function renderBell() {
  if (!DATA) return;
  const alerts = computeAlerts();
  const badge = document.getElementById("bell-badge");
  if (alerts.length) { badge.style.display = "block"; badge.textContent = alerts.length; }
  else { badge.style.display = "none"; }

  const dropdown = document.getElementById("bell-dropdown");
  dropdown.innerHTML = `
    <div class="panel" style="padding:14px;max-height:340px;overflow-y:auto;">
      <div style="font-size:12.5px;font-weight:600;margin-bottom:10px;">Alertas</div>
      ${alerts.length ? alerts.map(a => `<div class="row-link" data-alert-goto="${a.view}" style="display:block;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--bg-800);">${escapeHtml(a.label)}</div>`).join("") : '<p style="font-size:12.5px;color:var(--text-500);">Nenhum alerta no momento.</p>'}
    </div>
  `;
  dropdown.querySelectorAll("[data-alert-goto]").forEach(el => {
    el.addEventListener("click", () => { notificationsOpen = false; dropdown.style.display = "none"; renderView(el.dataset.alertGoto); });
  });
}

function attachBellEvents() {
  document.getElementById("bell-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    notificationsOpen = !notificationsOpen;
    document.getElementById("bell-dropdown").style.display = notificationsOpen ? "block" : "none";
  });
  document.addEventListener("click", () => {
    if (notificationsOpen) { notificationsOpen = false; document.getElementById("bell-dropdown").style.display = "none"; }
  });
}

function exportReport(key) {
  if (key === "faturamento") {
    const rows = DATA.payments.map(p => {
      const c = DATA.clients.find(cl => cl.id === p.clientId);
      return [c ? c.companyName : "-", p.competencia, p.value, p.status, p.paymentDate || ""];
    });
    downloadCSV("faturamento.csv", ["Cliente", "Competencia", "Valor", "Status", "Data pagamento"], rows);
  } else if (key === "despesas") {
    const rows = [
      ...DATA.agencyCosts.map(c => [c.name, COST_CATEGORY_LABELS[c.category] || c.category, c.value, "Recorrente"]),
      ...DATA.expenses.map(e => [e.description, COST_CATEGORY_LABELS[e.category] || e.category, e.value, e.date]),
    ];
    downloadCSV("despesas.csv", ["Descricao", "Categoria", "Valor", "Data/Periodicidade"], rows);
  } else if (key === "clientes") {
    const rows = DATA.clients.map(c => [c.companyName, c.contactName, c.email, c.whatsapp, c.status, c.monthlyValue]);
    downloadCSV("clientes.csv", ["Empresa", "Responsavel", "E-mail", "WhatsApp", "Status", "Mensalidade"], rows);
  } else if (key === "inadimplencia") {
    const rows = DATA.payments.filter(p => p.status === "ATRASADO").map(p => {
      const c = DATA.clients.find(cl => cl.id === p.clientId);
      return [c ? c.companyName : "-", p.competencia, p.value, p.dueDate];
    });
    downloadCSV("inadimplencia.csv", ["Cliente", "Competencia", "Valor", "Vencimento"], rows);
  } else if (key === "colaboradores") {
    const rows = DATA.employees.map(e => [e.name, e.role, CONTRACT_TYPE_LABELS[e.contractType] || e.contractType, employeeCostLabel(e), e.status]);
    downloadCSV("colaboradores.csv", ["Nome", "Funcao", "Tipo de contratacao", "Valor", "Status"], rows);
  } else if (key === "rentabilidade") {
    const rows = rentabilidadePorCliente().map(r => [r.client.companyName, r.mensalidade, r.custoEquipe, r.software, r.lucro, r.margem.toFixed(1) + "%"]);
    downloadCSV("rentabilidade-por-cliente.csv", ["Cliente", "Mensalidade", "Custo equipe", "Software", "Lucro", "Margem"], rows);
  } else if (key === "orcamentos") {
    const rows = DATA.budgets.map(b => {
      const c = DATA.clients.find(cl => cl.id === b.clientId);
      const calc = computeBudget(b);
      return ["#" + b.number, c ? c.companyName : (b.prospectName || "-"), b.status, calc.totalCost.toFixed(2), calc.recommendedPrice.toFixed(2)];
    });
    downloadCSV("orcamentos.csv", ["Numero", "Cliente", "Status", "Custo total", "Preco recomendado"], rows);
  } else if (key === "leads") {
    const rows = DATA.leads.map(l => [l.name, l.company, LEAD_STAGE_LABELS[l.stage], l.estimatedValue || "", l.origin || ""]);
    downloadCSV("leads.csv", ["Nome", "Empresa", "Etapa", "Valor estimado", "Origem"], rows);
  } else if (key === "fluxo") {
    const rows = fluxoDeCaixa().map(row => [row.month, row.saldoInicial.toFixed(2), row.entradas.toFixed(2), row.saidas.toFixed(2), row.saldoFinal.toFixed(2)]);
    downloadCSV("fluxo-de-caixa.csv", ["Mes", "Saldo inicial", "Entradas", "Saidas", "Saldo final"], rows);
  }
}

function attachRelatoriosEvents() {
  document.querySelectorAll("[data-rtab]").forEach(btn => {
    btn.addEventListener("click", () => { relatoriosTab = btn.dataset.rtab; renderView("relatorios"); });
  });
  document.querySelectorAll("[data-export]").forEach(btn => {
    btn.addEventListener("click", () => { exportReport(btn.dataset.export); showToast("Relatorio exportado."); });
  });
}

function countDemoRecords() {
  const keys = ["clients","employees","leads","projects","tasks","payments","agencyCosts","employeePayments","budgets","expenses","revenues","contracts","auditLogs"];
  let count = 0;
  keys.forEach(k => { count += (DATA[k] || []).filter(x => x && x.isDemo).length; });
  return count;
}

function renderConfiguracoes() {
  const s = DATA.settings;
  const rolesRows = USER_ROLE_INFO.map(r => `
    <tr><td style="font-weight:500;">${r.role}</td><td>${r.desc}</td></tr>
  `).join("");
  const demoCount = countDemoRecords();

  return `
    <div class="page-title">Configuracoes</div>
    <div class="page-sub">Dados da agencia e visao geral de permissoes</div>

    <div class="panel" style="padding:20px;margin-bottom:20px;">
      <div class="section-label" style="margin-top:0;">Dados da agencia</div>
      <div class="form-grid">
        <div class="field"><label>Nome da agencia</label><input type="text" id="cf-agencyName" value="${escapeHtml(s.agencyName || "")}" /></div>
        <div class="field"><label>CNPJ</label><input type="text" id="cf-document" value="${escapeHtml(s.document || "")}" /></div>
        <div class="field"><label>Telefone</label><input type="text" id="cf-phone" value="${escapeHtml(s.phone || "")}" /></div>
        <div class="field"><label>WhatsApp</label><input type="text" id="cf-whatsapp" value="${escapeHtml(s.whatsapp || "")}" /></div>
        <div class="field"><label>E-mail</label><input type="text" id="cf-email" value="${escapeHtml(s.email || "")}" /></div>
        <div class="field"><label>Chave Pix</label><input type="text" id="cf-pixKey" value="${escapeHtml(s.pixKey || "")}" /></div>
        <div class="field full"><label>Endereco</label><input type="text" id="cf-address" value="${escapeHtml(s.address || "")}" /></div>
        <div class="field full"><label>Dados bancarios</label><textarea id="cf-bankData">${escapeHtml(s.bankData || "")}</textarea></div>
      </div>
      <button class="btn-primary btn-sm" id="btn-save-agency" type="button">Salvar dados da agencia</button>
    </div>

    <div class="panel info-panel" style="margin-bottom:20px;">
      <h3>Margens da calculadora</h3>
      <p>Margem minima ${s.minMargin}% &middot; recomendada ${s.recommendedMargin}% &middot; premium ${s.premiumMargin}%. Editaveis na pagina <strong style="color:var(--text-100)">Custos da Agencia</strong>.</p>
    </div>

    <div class="section-label">Usuarios e permissoes</div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Perfil</th><th>Acesso</th></tr></thead>
      <tbody>${rolesRows}</tbody>
    </table></div></div>
    <p style="font-size:11.5px;color:var(--text-500);margin-top:8px;margin-bottom:26px;">Login multiusuario com permissoes reais entra na migracao para Supabase Auth.</p>

    <div class="section-label">Dados demonstrativos</div>
    <div class="panel" style="padding:20px;border-color:rgba(185,28,28,0.35);">
      <p style="font-size:13.5px;color:var(--text-300);margin-bottom:14px;">
        ${demoCount > 0
          ? "Ha <strong style=\"color:var(--text-100)\">" + demoCount + "</strong> registro(s) demonstrativo(s) (clientes, colaboradores, leads, projetos, tarefas, pagamentos, custos, orcamentos, contratos e auditoria de exemplo). Essa acao remove todos eles de uma vez e nao pode ser desfeita."
          : "Nenhum dado demonstrativo restante. A base atual e 100% real."}
      </p>
      <button class="btn-danger-outline btn-sm" id="btn-clear-demo" type="button" ${demoCount === 0 ? "disabled" : ""}>Remover todos os dados demonstrativos</button>
    </div>
  `;
}

function attachConfiguracoesEvents() {
  document.getElementById("btn-save-agency").addEventListener("click", async () => {
    Object.assign(DATA.settings, {
      agencyName: document.getElementById("cf-agencyName").value.trim(),
      document: document.getElementById("cf-document").value.trim(),
      phone: document.getElementById("cf-phone").value.trim(),
      whatsapp: document.getElementById("cf-whatsapp").value.trim(),
      email: document.getElementById("cf-email").value.trim(),
      pixKey: document.getElementById("cf-pixKey").value.trim(),
      address: document.getElementById("cf-address").value.trim(),
      bankData: document.getElementById("cf-bankData").value.trim(),
    });
    await saveData();
    document.querySelector(".brand-name").textContent = DATA.settings.agencyName || "Maximizze";
    showToast("Dados da agencia atualizados.");
  });

  const clearBtn = document.getElementById("btn-clear-demo");
  if (clearBtn) clearBtn.addEventListener("click", async () => {
    const count = countDemoRecords();
    if (count === 0) return;
    const ok = window.confirm("Remover " + count + " registro(s) demonstrativo(s)? Essa acao nao pode ser desfeita.");
    if (!ok) return;

    const keys = ["clients","employees","leads","projects","tasks","payments","agencyCosts","employeePayments","budgets","expenses","revenues","contracts","auditLogs"];
    keys.forEach(k => { DATA[k] = (DATA[k] || []).filter(x => !(x && x.isDemo)); });
    DATA.isDemo = false;
    logAudit("removeu", "Dados demonstrativos", null, count + " registro(s) demonstrativo(s) removido(s)");
    await saveData();
    showToast("Dados demonstrativos removidos.");
    renderView("configuracoes");
  });
}

  const { data } = await sb.auth.getSession();
  if (data.session && data.session.user) await enterApp(data.session.user.email);
})();
